<style>
:root {
  /* zine paper, single theme. Layout: topic sidebar + topic view with two modes (Посібник / Вправи) */
  --paper: #F6F1E3; --paper-2: #FCFAF4; --clip: #FAF8F1; --ink: #3A1626; --muted: #6F535B;
  --soft: #A9C2E6; --rust: #7A1F45; --blue: #4D74A8; --ok: #2E6B3F; --bad: #B42318; --line: #C1B4AE;
  --display: 'Unbounded', 'Arial Black', sans-serif; --body: 'PT Serif', Georgia, serif;
  --mono: 'PT Mono', ui-monospace, monospace; --hand: 'Caveat', 'Comic Sans MS', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: var(--blue); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 28px 20px 80px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 28px; border-bottom: 1px solid var(--ink); padding-bottom: 18px; }
.brand h1 { width: fit-content; padding: 0 8px; margin: 0 0 0 -8px; background: linear-gradient(transparent 55%, var(--soft) 55%, var(--soft) 92%, transparent 92%); font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); letter-spacing: -1.5px; line-height: 1; }
.brand p { margin: 8px 0 0; font-family: var(--hand); font-size: 23px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.progress { min-width: 240px; display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 13px; }
.bar { height: 8px; background: var(--paper-2); border: 1px solid var(--ink); }
.bar > span { display: block; height: 100%; background: var(--rust); width: 0; transition: width .3s; }
nav.topics { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 32px); overflow-y: auto; }
nav.topics h2 { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 400; }
nav.topics a { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 6px 8px; text-decoration: none; color: var(--ink); border: 1px solid transparent; }
nav.topics a:hover { background: var(--paper-2); }
nav.topics a[aria-current="page"] { background: var(--paper-2); border-color: var(--ink); }
nav.topics .n { font-family: var(--mono); font-size: 12px; color: var(--rust); }
nav.topics .st { font-family: var(--mono); font-size: 11px; color: var(--muted); }
nav.topics .st.done { color: var(--ok); }
main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.t-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 20px; }
.t-head .num { font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--rust); line-height: 1; }
.t-head h2 { width: fit-content; padding: 0 6px; margin-left: -6px; background: linear-gradient(transparent 52%, var(--soft) 52%, var(--soft) 92%, transparent 92%); margin-top: 0; margin-bottom: 0; margin-right: 0; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); letter-spacing: -1px; line-height: 1.1; text-wrap: balance; }
.t-head .title { display: flex; align-items: baseline; gap: 14px; }
.t-head .sub { margin: 6px 0 0; font-family: var(--hand); font-size: 22px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.tabs { display: inline-flex; border: 1px solid var(--ink); }
.tabs a { padding: 8px 16px; text-decoration: none; color: var(--ink); font-size: 15px; background: var(--paper-2); }
.tabs a + a { border-left: 1px solid var(--ink); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.ul { display: block; width: 100%; height: 10px; }
/* book */
.book-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.book { display: flex; flex-direction: column; gap: 22px; align-items: center; }
.book.full { align-items: flex-start; overflow-x: auto; }
.sheet { --s: 1; width: 100%; max-width: 794px; height: calc(1123px * var(--s)); overflow: hidden; position: relative; border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(58, 22, 38, .12); flex: none; }
.book.full .sheet { width: 794px; max-width: none; }
.pg { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; transform: scale(var(--s)); transform-origin: 0 0; }
.pg h1, .pg h2, .pg h3 { text-wrap: balance; }
.pg-num { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; margin-top: -14px; }
/* exercises */
.card { background: var(--paper-2); border: 1px solid var(--ink); padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.35; }
.card h3 .code { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--rust); white-space: nowrap; }
.story { margin: -8px 0 0; font-family: var(--hand); font-size: 21px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.note { margin: -6px 0 0; font-family: var(--hand); font-size: 20px; font-weight: 600; color: var(--blue); line-height: 1.15; }
ol.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: it; }
ol.items > li { counter-increment: it; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; align-items: baseline; }
ol.items > li::before { content: counter(it) "."; font-family: var(--mono); font-size: 13px; color: var(--rust); }
ol.items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.line { font-size: 17px; line-height: 2.1; }
input.blank { border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 0 4px; font-size: 17px; min-width: 5ch; max-width: 100%; }
input.full { width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 4px 2px; font-size: 17px; }
.prompt { font-size: 17px; }
.prompt.mono { font-family: var(--mono); font-size: 15px; }
.lbl { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--rust); margin-right: 6px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.pair > div { display: flex; align-items: baseline; }
input.ok, select.ok { border-color: var(--ok); color: var(--ok); }
input.bad, select.bad { border-color: var(--bad); color: var(--bad); }
input.ok, input.bad { border-bottom-width: 2px; }
.choices { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; margin: 0 4px; }
.choices label { position: relative; cursor: pointer; }
.choices input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choices span { display: inline-block; padding: 1px 10px; border: 1px solid var(--ink); background: var(--paper); font-size: 16px; line-height: 1.6; }
.choices input:checked + span { background: var(--ink); color: var(--paper); }
.choices input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.choices.ok input:checked + span { background: var(--ok); border-color: var(--ok); }
.choices.bad input:checked + span { background: var(--bad); border-color: var(--bad); }
.choices .right span { box-shadow: 0 0 0 2px var(--ok); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 28px; }
.match .right { display: flex; flex-direction: column; gap: 8px; }
.match .right p { margin: 0; font-size: 16px; }
.match .right b { font-family: var(--mono); color: var(--blue); font-weight: 400; margin-right: 6px; }
select { border: 1px solid var(--ink); background: var(--paper); padding: 3px 6px; font-size: 15px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats span { border: 1px solid var(--ink); padding: 3px 10px; font-size: 14px; background: var(--paper); }
textarea { width: 100%; min-height: 150px; border: 1px solid var(--ink); background: var(--paper); padding: 10px 12px; font-size: 16px; line-height: 1.6; resize: vertical;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--line) 25px, var(--line) 26px); background-attachment: local; }
.why-btn { margin-left: 8px; border: 1px solid var(--bad); color: var(--bad); background: transparent; font-family: var(--hand); font-size: 18px; font-weight: 700; line-height: 1; padding: 2px 8px; cursor: pointer; vertical-align: middle; }
.exp { margin-top: 6px; padding: 8px 12px; border-left: 3px solid var(--blue); background: var(--paper); display: flex; flex-direction: column; gap: 2px; }
.diag:empty { display: none; }
.diffline { font-weight: 400 !important; color: var(--ink) !important; font-size: 17px !important; line-height: 1.9 !important; }
.w-bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.w-fix { color: var(--ok); font-weight: 700; border-bottom: 2px solid var(--ok); margin-left: 3px; }
.w-extra { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.w-miss { color: var(--ok); font-weight: 700; border-bottom: 2px dashed var(--ok); }
.w-miss::before { content: '+'; font-size: 12px; vertical-align: super; }
.diffline.soft .w-bad, .diffline.soft .w-extra { color: var(--muted); }
.diffline.soft .w-fix, .diffline.soft .w-miss { color: var(--blue); border-color: var(--blue); }
.diag .ok-line { color: var(--ok) !important; }
.diag .soft-msg { color: var(--blue) !important; font-weight: 400 !important; }
.diag-h.soft { color: var(--blue); }
.why-btn.soft { border-color: var(--blue); color: var(--blue); }
.diag { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px dashed var(--line); }
.diag .diag-h { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
.diag p { margin: 0; font-size: 15.5px; font-weight: 700; color: var(--bad); line-height: 1.4; }
input.near { border-color: var(--rust); color: var(--rust); border-bottom-style: dashed; border-bottom-width: 2px; }
.why-btn.near { border-color: var(--rust); color: var(--rust); }
.exp .ans { font-size: 16px; font-weight: 700; color: var(--ok); }
.exp .why { font-family: var(--hand); font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--blue); }
.clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; padding-top: 6px; }
.clip { position: relative; background: var(--clip); border: 1.5px dashed var(--ink); padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 8px; transform: rotate(-.6deg); box-shadow: 3px 3px 0 rgba(58, 22, 38, .10); }
.clip:nth-child(2n) { transform: rotate(.7deg); }
.clip .sc { position: absolute; top: -12px; left: 18px; background: var(--paper-2); padding: 0 4px; }
.clip .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--rust); }
.clip h4 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: -.4px; line-height: 1.2; }
.clip .f { font-family: var(--mono); font-size: 13.5px; line-height: 1.45; border: 1px solid var(--ink); padding: 6px 10px; background: var(--paper-2); }
.clip p { margin: 0; font-size: 15px; line-height: 1.45; }
.clip .e { font-style: italic; }
.clip a { font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 8px 16px; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.15); }
.score { margin-left: auto; font-family: var(--hand); font-size: 22px; font-weight: 700; line-height: 1; }
.score.good { color: var(--ok); } .score.meh { color: var(--rust); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--ink); padding: 10px 16px; color: var(--ink); background: var(--paper-2); }
.pager a:hover { background: var(--ink); color: var(--paper); }
.free-note { margin: 0; font-family: var(--hand); font-size: 20px; color: var(--muted); font-weight: 600; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 22px; padding-top: 18px; }
  nav.topics { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; max-height: none; }
  nav.topics h2 { width: 100%; margin: 0; }
  nav.topics a { grid-template-columns: auto auto; border-color: var(--ink); padding: 4px 10px; }
  nav.topics a .st { display: none; }
  .match, .pair { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.dl { position: relative; }
.dl summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--ink); background: var(--paper-2); font-size: 15px; }
.dl summary::-webkit-details-marker { display: none; }
.dl summary:hover, .dl[open] summary { background: var(--ink); color: var(--paper); }
.dl .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 300px; background: var(--clip); border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(58, 22, 38, .12); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
.dl .row b { display: block; font-family: var(--display); font-size: 14px; letter-spacing: -.3px; }
.dl .row small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.dl .row div { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.dl .row a { font-size: 14px; padding: 3px 10px; border: 1px solid var(--ink); text-decoration: none; color: var(--ink); background: var(--paper); }
.dl .row a:hover { background: var(--ink); color: var(--paper); }
.dl .hint { margin: 0; font-family: var(--hand); font-size: 19px; font-weight: 600; color: var(--blue); line-height: 1.1; }
@media (max-width: 760px) { .side { align-items: stretch; } .dl .menu { left: 0; right: auto; width: min(300px, 90vw); } }
</style>
</head>

<script>
const TOPICS = [{"id": "word-order", "title": "Word Order", "guide": "1", "sub": "Підмет, допоміжне, основне, додаток — і в якому порядку їх ставити.", "ex": [{"kind": "order", "instr": "Розставте слова в правильному порядку.", "items": [["scrolling / is / Senator Gray / TikTok / during the vote", "Senator Gray is scrolling TikTok during the vote.", "Підмет (Senator Gray) → допоміжне (is) → основне (scrolling) → додаток."], ["not / the minister / is / answering / the question", "The minister is not answering the question.", "not стоїть одразу після допоміжного is."], ["why / the opposition / clapping / is / ?", "Why is the opposition clapping?", "Питальне слово → допоміжне → підмет → основне."], ["sleeping / is / the speaker / again / ?", "Is the speaker sleeping again?", "Без питального слова питання починається з допоміжного."], ["his phone / is / hiding / why / he / ?", "Why is he hiding his phone?", "Why → is → he → hiding → his phone."], ["not / I / am / making / this up", "I am not making this up.", "not — після допоміжного am, перед основним."]], "note": null, "rule": ["wo-plus", "wo-q"], "story": "пряма трансляція з засідання парламенту"}, {"kind": "negq", "instr": "Утворіть заперечення (−) і питання (?).", "items": [["Marta is selling “detox water” for $90 a bottle.", "Marta is not selling “detox water” for $90 a bottle.", "Is Marta selling “detox water” for $90 a bottle?", "not — після is; для питання is стає перед підметом."], ["Her followers are drinking it every morning.", "Her followers are not drinking it every morning.", "Are her followers drinking it every morning?", "are not / Are + підмет — допоміжне керує всім."], ["She is filming her “5 am routine” at 2 pm.", "She is not filming her “5 am routine” at 2 pm.", "Is she filming her “5 am routine” at 2 pm?", "is not → заперечення; Is she…? → питання."], ["I am buying her course on “abundance”.", "I am not buying her course on “abundance”.", "Am I buying her course on “abundance”?", "am not / Am I…? Основне buying не змінюється."], ["The tax office is watching her account.", "The tax office is not watching her account.", "Is the tax office watching her account?", "not після is; у питанні is — на перше місце."]], "note": "not — тільки після допоміжного. Для питання допоміжне стає перед підметом.", "rule": ["wo-minus", "wo-q"], "story": "велнес-інфлюенсерка Марта і її «детокс-вода»"}, {"kind": "transform", "instr": "Поставте питання з питальним словом у дужках.", "items": [["The detective is checking the neighbour’s doorbell camera. (What…?)", "What is the detective checking?", "What + допоміжне is + підмет + основне."], ["The suspect is hiding in his mom’s basement. (Where…?)", "Where is the suspect hiding?", "Where + is + the suspect + hiding."], ["The neighbours are whispering because they know something. (Why…?)", "Why are the neighbours whispering?", "Why + are + підмет + whispering."], ["I am interviewing the victim’s ex. (Who…?)", "Who are you interviewing?", "Питаємо співрозмовника: I am → you are."], ["They are releasing the next episode on Friday. (When…?)", "When are they releasing the next episode?", "When + are + they + releasing."], ["The podcast host is drinking wine on air. (What…?)", "What is the podcast host drinking?", "What + is + підмет + основне."]], "note": null, "rule": ["wo-q"], "story": "тру-крайм подкаст «Хто бреше?»"}, {"kind": "gap", "instr": "Знайдіть у кожному реченні допоміжне й основне дієслово.", "items": [["The jury is pretending to understand crypto. → допоміжне: ___ основне: ___", ["is", "pretending"], "is показує час, pretending — сама дія."], ["Is the billionaire launching himself into space again? → допоміжне: ___ основне: ___", ["is", "launching"], "У питанні допоміжне на початку, але це все одно is."], ["Why are the fans burning his merch? → допоміжне: ___ основне: ___", ["are", "burning"], "are — допоміжне, burning — основне з -ing."], ["I am not paying for a blue tick. → допоміжне: ___ основне: ___", ["am", "paying"], "n as hoarse because she [had been singing|was singing] for three hours.", "had been singing", "Тривало ДО моменту + видно наслідок."], ["At 5 pm yesterday I [had been working|was working]. Allegedly.", "was working", "Конкретний момент у минулому."]], "note": null, "rule": ["pco-types", "ppfc"]}, {"kind": "transform", "instr": "Поясніть ситуацію: що відбувалося до того? Використайте слова в дужках.", "items": [["His hands were shaking. (he / drink / coffee all night)", "He had been drinking coffee all night.", "Тремтіння — наслідок тривалої дії до того."], ["They were exhausted. (they / dance / at the festival all night)", "They had been dancing at the festival all night.", "had been + V-ing."], ["He lost his voice. (he / shout / at the match)", "He had been shouting at the match.", "Голос зник після тривалого крику."], ["The detective looked tired. (he / interrogate / suspects all day)", "He had been interrogating suspects all day.", "Цілий день — тривалість."], ["I had a headache. (I / read / the comments under my post)", "I had been reading the comments under my post.", "Класична причина головного болю."]], "note": null, "rule": ["ppfc"]}, {"kind": "choice", "instr": "Past Perfect чи Past Perfect Continuous?", "items": [["I [had been knowing|had known] him for years before he became famous.", "had known", "know — stative verb."], ["She [had written|had been writing] three angry emails by 10 am.", "had written", "Скільки зроблено (три листи) — Past Perfect."], ["The kids were noisy because they [had been playing|had played] video games all afternoon.", "had been playing", "all afternoon — тривалість."], ["By 2020, the singer [had been selling|had sold] 50 million records.", "had sold", "Кількість — результат → Past Perfect."], ["We were full because we [had been eating|had eaten] a huge pizza.", "had eaten", "Завершена дія з результатом."], ["She [had been writing|had written] emails all morning, so her eyes hurt.", "had been writing", "Як довго (all morning) — Continuous."]], "note": "Скільки зроблено (результат) — Past Perfect. Як довго тривало — Continuous.", "rule": ["ppf", "ppfc"]}], "book": [12]}, {"id": "future", "title": "Future Actions", "guide": "13–14", "sub": "Will, going to і Present Continuous: що коли брати.", "ex": [{"kind": "choice", "instr": "Оберіть найкращий варіант.", "items": [["I [’m meeting|’ll meet|meet] my lawyer tomorrow at 6 — it’s in my calendar.", "’m meeting", "Домовленість з часом → Present Continuous."], ["I’ve decided: I [’m going to delete|’ll delete|delete] all my social media this spring.", "’m going to delete", "Рішення вже прийняте, це намір → going to."], ["One day you [are winning|win|will win] a Grammy!", "will win", "Безпідставне передбачення → will."], ["Man, I [’m killing|’ll kill|kill] you!", "’ll kill", "Погроза → will (і ніхто нікого не вбиває)."], ["We [’re flying|fly|’ll fly] to the Eurovision final next Friday — the tickets are booked.", "’re flying", "Квитки куплені → Present Continuous."], ["Look at those clouds! It [will rain|is going to rain|rains].", "is going to rain", "Висновок на основі фактів (хмари) → going to."], ["[Will|Shall|Do] I order us a pizza?", "Shall", "Пропозиція з I → Shall."], ["Oh, it’s hot in here. I [’m going to open|’m opening|’ll open] the window.", "’ll open", "Спонтанне рішення → will."]], "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "sort", "instr": "Спонтанне рішення, план чи домовленість? Впишіть номер.", "items": {"cats": ["1 — спонтанне рішення (will)", "2 — план, намір (going to)", "3 — домовленість (Present Continuous)"], "items": [["I’m going to start a podcast this year.", 1, "Намір, який уже є."], ["We’re having a watch party on Saturday, everyone’s invited.", 2, "Усіх запросили — домовленість."], ["The phone’s ringing — I’ll get it.", 0, "Вирішили в моменті."], ["This queue is endless. I’ll order online.", 0, "Спонтанне рішення."], ["The president is visiting Kyiv next week, it’s in the official schedule.", 2, "Є в розкладі — домовленість."], ["She’s going to quit her job — she’s told everyone.", 1, "План, про який усі знають."]]}, "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "translate", "instr": "Перекладіть.", "items": [["Я тобі подзвоню пізніше.", "I’ll call you later.", "Обіцянка → will.", ["\\bwill \\w+", "will + V1"]], ["Ми збираємося переїхати в Канаду.", "We’re going to move to Canada.", "«Збираємося» → going to.", ["\\bare going to \\w+", "are going to + V1"]], ["Може, я допоможу? (shall)", "Shall I help you?|Shall I help?", "Пропозиція з I → Shall I…?", ["^shall i\\b", "Shall I …?"]], ["Завтра о десятій я йду до адвоката.", "I’m seeing my lawyer at ten tomorrow.|I’m going to my lawyer at ten tomorrow.|Tomorrow at ten I’m seeing my lawyer.", "Домовленість з часом → Present Continuous.", ["\\bam \\w+ing\\b", "am + V-ing (домовленість)"]], ["Цей рейс точно запізниться — подивись на табло!", "This flight is going to be late — look at the board!|This flight is going to be delayed — look at the board!", "Висновок на основі фактів (табло) → going to.", ["\\bis going to\\b", "is going to (висновок на основі фактів)"]], ["Я тебе приб’ю!", "I’ll kill you!", "Погроза → will.", ["\\bwill \\w+", "will + V1"]]], "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "free", "instr": "Напишіть 3 плани (going to), 2 домовленості (Present Continuous) і 1 безпідставне передбачення про поп-культуру чи політику (will) — наприклад, хто виграє наступне Євробачення.", "items": [], "note": null, "rule": [], "lines": 6}], "book": [13, 14]}, {"id": "modals", "title": "Modal Verbs", "guide": "15–16", "sub": "Можу, мушу, варто, можна: ставлення мовця до дії.", "ex": [{"kind": "choice", "instr": "Оберіть правильний варіант.", "items": [["You [mustn’t|don’t have to] film in the courtroom. It’s forbidden.", "mustn’t", "Сувора заборона → mustn’t."], ["I [can|could] sing when I was five. Now I can’t.", "could", "Здатність у минулому → could."], ["You [must|should] get more sleep — just my advice.", "should", "Порада → should."], ["You [don’t have to|mustn’t] come to the reunion — it’s optional.", "don’t have to", "Не обов’язково → don’t have to."], ["[Could|Should] you stop filming me, please?", "Could", "Ввічливе прохання → Could."], ["He [must|might] be the killer, but there’s no evidence yet.", "might", "Обережне припущення → might."], ["She sang for three hours. Her voice [must|should] be gone.", "must", "Сильне припущення, логічний висновок → must."], ["[Must|May] I ask you a personal question, Mr President?", "May", "Ввічливе прохання → May."], ["The verdict [must|should] come out tomorrow, if nothing changes.", "should", "Очікування → should."], ["After this course, I [will be able to|can] edit videos like a pro.", "will be able to", "Can не має майбутньої форми."]], "note": null, "rule": ["m-can", "m-may", "m-must"]}, {"kind": "match", "instr": "Що виражає модальне дієслово? З’єднайте.", "items": {"left": ["You can leave the courtroom now.", "The scandal could ruin his career.", "We could boycott the brand.", "Journalists have to protect their sources.", "Celebrities should use their platform responsibly.", "You mustn’t share the victim’s name."], "right": ["пропозиція (suggestion)", "заборона (prohibition)", "дозвіл (permission)", "обов’язок через правила", "можливість (possibility)", "моральний обов’язок (duty)"], "ans": {"1": "c", "2": "e", "3": "a", "4": "d", "5": "f", "6": "b"}, "why": ["can — дозвіл.", "could — можливість.", "We could… — пропозиція.", "have to — так вимагають правила професії.", "should — моральний обов’язок.", "mustn’t — сувора заборона."]}, "note": null, "rule": ["m-can", "m-must"]}, {"kind": "gap", "instr": "Must чи have to? Оберіть те, що підходить найкраще.", "items": [["I ___ stop reading the comments — I decided it myself.", ["must"], "Мовець сам наголошує на необхідності → must."], ["Pilots ___ wear a uniform. It’s the rule.", ["have to"], "Правило ззовні → have to."], ["My boss says I ___ work on Saturday.", ["have to"], "Обставини (бос) → have to."], ["I really ___ call my grandma, I haven’t spoken to her for weeks.", ["must"], "Внутрішнє рішення → must."], ["In Ukraine you ___ be 18 to vote.", ["have to"], "Закон → have to."], ["You ___ watch “Making a Murderer”, it’s brilliant!", ["must"], "Сильна порада від мовця → must."]], "note": "must — мовець сам так вирішив; have to — так склалися обставини чи правила.", "rule": ["m-must"]}, {"kind": "transform", "instr": "Перепишіть речення з модальним дієсловом у дужках.", "items": [["It’s possible that the singer is lip-syncing. (might)", "The singer might be lip-syncing.", "Обережне припущення → might + be."], ["I’m sure he is lying. (must)", "He must be lying.", "Впевнений висновок → must + be."], ["It’s not a good idea to argue with trolls. (shouldn’t)", "You shouldn’t argue with trolls.", "Порада → shouldn’t + V1."], ["I was able to read when I was four. (could)", "I could read when I was four.", "Здатність у минулому → could."], ["Is it OK if I record this interview? (may)", "May I record this interview?", "Формальне прохання → May I…?"], ["It isn’t necessary to buy a ticket — it’s free. (don’t have to)", "You don’t have to buy a ticket.|You don’t have to buy a ticket — it’s free.", "Немає необхідності → don’t have to."]], "note": null, "rule": ["m-can", "m-may", "m-must"]}], "book": [15, 16]}, {"id": "conditionals", "title": "Conditionals", "guide": "17–18", "sub": "Нульовий, перший, другий, третій: від фактів до машини часу.", "ex": [{"kind": "sort", "instr": "Який це тип умовного речення? Впишіть 0, I, II або III.", "items": {"cats": ["0", "I", "II", "III"], "items": [["If I had a million followers, I would sell detox tea.", 2, "Past Simple + would."], ["If you heat ice, it melts.", 0, "Факт: Present + Present."], ["If it rains, the festival will move indoors.", 1, "Present + will."], ["If they had checked the alibi, they would have caught him.", 3, "Past Perfect + would have V3."], ["If you mix red and white, you get pink.", 0, "Завжди так: Present + Present."], ["If I were the president, I would ban reality shows.", 2, "Малоймовірно: Past Simple + would."], ["If she wins the case, she will write a book about it.", 1, "Можлива ситуація: Present + will."], ["If he had deleted the tweet, he wouldn’t have lost his job.", 3, "Минуле не змінити: Past Perfect + would have V3."]]}, "note": null, "rule": ["c0", "c1", "c2", "c3"]}, {"kind": "gap", "instr": "Нульовий і перший тип. Розкрийте дужки.", "items": [["If the jury ___ (believe) her, they ___ (let) her go.", ["believes", "will let"], "Ймовірна ситуація: if + Present Simple, will + V."], ["If you ___ (not/hurry), you ___ (miss) the train.", ["don’t hurry", "will miss"], "Після if — Present Simple, не will."], ["Unless the band ___ (apologize), the fans ___ (not/come) back.", ["apologizes|apologises", "won’t come|will not come"], "Unless = if not; the band = it → +s."], ["If you ___ (heat) water to 100°C, it ___ (boil).", ["heat", "boils"], "Факт → нульовий тип."], ["I ___ (buy) you a coffee if you ___ (help) me with this essay.", ["will buy", "help"], "Умова може стояти другою, правило те саме."], ["If he ___ (be) late again, the boss ___ (fire) him.", ["is", "will fire"], "if + is, will + fire."]], "note": null, "rule": ["c0", "c1"]}, {"kind": "gap", "instr": "Другий тип. Розкрийте дужки.", "items": [["If I ___ (be) you, I ___ (block) him.", ["were", "would block"], "were — для всіх осіб; would + V1."], ["If I ___ (have) a time machine, I ___ (go) to Woodstock.", ["had", "would go"], "Нереально зараз → Past Simple + would."], ["She ___ (travel) more if she ___ (not/hate) flying.", ["would travel", "didn’t hate"], "Умова — Past Simple, наслідок — would."], ["If politicians ___ (keep) their promises, we ___ (be) shocked.", ["kept", "would be"], "Малоймовірна ситуація. На жаль."], ["What ___ you ___ (do) if you ___ (win) the lottery?", ["would", "do", "won"], "Питання: What would you do…? Умова — won."], ["If he ___ (speak) English, he ___ (get) that job.", ["spoke", "would get"], "Past Simple + would."]], "note": "were — для всіх осіб.", "rule": ["c2"]}, {"kind": "gap", "instr": "Третій тип. Розкрийте дужки.", "items": [["If I ___ (go) to sleep earlier, I ___ (not/be) so tired yesterday.", ["had gone", "wouldn’t have been"], "Минуле: had + V3, would have + V3."], ["If the police ___ (check) his alibi, they ___ (catch) him sooner.", ["had checked", "would have caught"], "Не перевірили — вже не змінити."], ["We ___ (get) tickets if we ___ (log in) on time.", ["would have got|would have gotten", "had logged in"], "would have + V3; умова — had + V3."], ["If you ___ (tell) me about the affair, I ___ (help) you.", ["had told", "would have helped"], "Шкодування про минуле."], ["If they ___ (not/argue) on live TV, they ___ (not/break) up.", ["hadn’t argued", "wouldn’t have broken"], "hadn’t + V3, wouldn’t have + V3."]], "note": null, "rule": ["c3"]}, {"kind": "transform", "instr": "Перепишіть з unless.", "items": [["If you don’t apologize, she won’t talk to you.", "Unless you apologize, she won’t talk to you.|Unless you apologise, she won’t talk to you.", "Unless = if + don’t, тому don’t зникає."], ["If it doesn’t rain, the festival will go ahead.", "Unless it rains, the festival will go ahead.", "doesn’t rain → unless it rains."], ["If he doesn’t pay his taxes, he will go to prison.", "Unless he pays his taxes, he will go to prison.", "doesn’t pay → unless he pays."], ["I won’t vote for him if he doesn’t answer the question.", "I won’t vote for him unless he answers the question.", "if he doesn’t answer → unless he answers."]], "note": "Unless = if + don’t.", "rule": ["c1"]}], "book": [17, 18]}, {"id": "mixed-conditionals", "title": "Mixed Conditionals", "guide": "19", "sub": "Ходіть мішать: минуле, яке впливає на «зараз», і навпаки.", "ex": [{"kind": "gap", "instr": "Розкрийте дужки.", "items": [["If I ___ (be) more organized, I ___ (not/miss) my train yesterday.", ["were", "wouldn’t have missed"], "Загальна риса (зараз) → наслідок у минулому."], ["If I ___ (make) a better resume a month ago, I ___ (have) a better job now.", ["had made", "would have"], "Дія в минулому → наслідок зараз."], ["If she ___ (not/sign) that contract in 2008, she ___ (be) free now.", ["hadn’t signed", "would be"], "Минуле рішення → теперішній стан."], ["If he ___ (speak) French, he ___ (understand) the waiter last night.", ["spoke", "would have understood"], "Загальне вміння → подія вчора."], ["If we ___ (buy) Bitcoin in 2010, we ___ (be) rich now.", ["had bought", "would be"], "in 2010 → had bought; now → would be."], ["If I ___ (not/be) so shy, I ___ (talk) to the singer after the concert.", ["weren’t", "would have talked"], "Риса характеру → упущений момент у минулому."]], "note": null, "rule": ["mixed"]}, {"kind": "match", "instr": "З’єднайте половинки.", "items": {"left": ["If I had saved money,", "If she were braver,", "If we hadn’t missed the flight,", "If he weren’t so lazy,", "If I hadn’t stayed up watching true crime,"], "right": ["he would have finished the project last week.", "I would have a car now.", "we would be in Rome now.", "I wouldn’t be so sleepy now.", "she would have asked him out yesterday."], "ans": {"1": "b", "2": "e", "3": "c", "4": "a", "5": "d"}, "why": ["Минуле → зараз (would have).", "Риса зараз → минуле (would have asked).", "Минуле → зараз (would be).", "Риса зараз → минуле (would have finished).", "Минуле → зараз (wouldn’t be)."]}, "note": null, "rule": ["mixed"]}, {"kind": "transform", "instr": "Перепишіть ситуацію як змішане умовне речення.", "items": [["I didn’t learn Spanish at school, so I can’t understand Bad Bunny now.", "If I had learned Spanish at school, I would understand Bad Bunny now.|If I had learned Spanish at school, I could understand Bad Bunny now.|If I had learnt Spanish at school, I would understand Bad Bunny now.", "Минуле → наслідок зараз: had learned + would understand."], ["She isn’t careful, so she leaked the secret last week.", "If she were careful, she wouldn’t have leaked the secret last week.", "Риса зараз → минуле: were + wouldn’t have leaked."], ["We didn’t take a map, so we are lost now.", "If we had taken a map, we wouldn’t be lost now.", "had taken + wouldn’t be."], ["I’m not rich, so I didn’t buy that Banksy.", "If I were rich, I would have bought that Banksy.", "were + would have bought."]], "note": null, "rule": ["mixed"]}, {"kind": "free", "instr": "Напишіть 3 змішані умовні речення про власне життя: рішення з минулого, яке впливає на ваше «зараз».", "items": [], "note": null, "rule": [], "lines": 3}], "book": [19]}, {"id": "indirect-speech", "title": "Indirect Speech", "guide": "20", "sub": "Передаємо чужі слова: все «на час назад».", "ex": [{"kind": "transform", "instr": "Перепишіть у непрямій мові.", "items": [["She said: “I’m tired of the rumours.”", "She said (that) she was tired of the rumours.", "am → was."], ["He said: “I’m not dating anyone.”", "He said (that) he wasn’t dating anyone.", "Present Continuous → Past Continuous. Фото з яхти кажуть інше."], ["The couple said: “We split amicably.”", "The couple said (that) they had split amicably.", "Past Simple → Past Perfect. Амікабельно, звісно."], ["She said: “I have done nothing wrong.”", "She said (that) she had done nothing wrong.", "Present Perfect → Past Perfect."], ["He said: “I’ll lower taxes.”", "He said (that) he would lower taxes.", "will → would. Обіцянки теж зсуваються."], ["He said: “I was sleeping at home all night.”", "He said (that) he had been sleeping at home all night.", "Past Continuous → Past Perfect Continuous."], ["She said: “I can’t comment.”", "She said (that) she couldn’t comment.", "can → could."], ["The professor said: “The Earth goes round the Sun.”", "The professor said (that) the Earth goes round the Sun.", "Факт, правдивий завжди, — не зсуваємо."]], "note": "Факти, які правдиві завжди, «на час назад» не відправляємо.", "rule": ["is-tense"], "story": "інтерв’ю після зіркового розлучення"}, {"kind": "transform", "instr": "Питання в непрямій мові.", "items": [["The detective asked me: “Where were you on Friday night?”", "The detective asked me where I had been on Friday night.", "Прямий порядок слів + Past Simple → Past Perfect."], ["He asked: “Do you like me?”", "He asked if I liked him.|He asked whether I liked him.", "Немає питального слова → if / whether."], ["They asked: “Can you help us?”", "They asked if I could help them.|They asked whether I could help them.", "if + can → could."], ["The journalist asked: “What are you hiding?”", "The journalist asked what I was hiding.|The journalist asked me what I was hiding.", "what + прямий порядок: I was hiding."], ["He asked: “Have you seen the new episode?”", "He asked if I had seen the new episode.|He asked whether I had seen the new episode.", "if + Present Perfect → Past Perfect."], ["My boss asked: “Why did you leave early?”", "My boss asked why I had left early.", "why + прямий порядок + Past Perfect."], ["She asked: “Will you vote?”", "She asked if I would vote.|She asked whether I would vote.", "if + will → would."]], "note": null, "rule": ["is-q"]}, {"kind": "error", "instr": "Знайдіть і виправте помилку.", "items": [["She asked me where was she.", "She asked me where she was.", "У непрямому питанні — прямий порядок слів."], ["He asked do I like true crime.", "He asked if I liked true crime.|He asked whether I liked true crime.", "Без питального слова — if / whether, без do."], ["They asked if I can help them.", "They asked if I could help them.", "can → could «на час назад»."], ["The detective asked where did I live.", "The detective asked where I lived.", "Прибираємо did, прямий порядок."], ["He promised he will lower taxes.", "He promised he would lower taxes.|He promised that he would lower taxes.", "will → would."]], "note": null, "rule": ["is-tense", "is-q"]}], "book": [20]}, {"id": "passive", "title": "Passive Voice", "guide": "21", "sub": "Коли важливіше, що сталося, ніж хто це зробив.", "ex": [{"kind": "transform", "instr": "Перепишіть у пасивному стані.", "items": [["Someone stole the Mona Lisa in 1911.", "The Mona Lisa was stolen in 1911.", "Хто вкрав — не важливо: was + V3."], ["Someone hacked my Instagram.", "My Instagram was hacked.|My Instagram has been hacked.", "Past Simple → was + hacked."], ["They update the rules every month.", "The rules are updated every month.", "Present Simple → are + V3."], ["Jamala wrote “1944”.", "“1944” was written by Jamala.", "Виконавець важливий → by Jamala."], ["They are filming a series about the scandal.", "A series about the scandal is being filmed.", "Continuous → is being + V3."], ["Someone has leaked the documents!", "The documents have been leaked!", "Present Perfect → have been + V3."], ["They will announce the verdict tomorrow.", "The verdict will be announced tomorrow.", "will → will be + V3."]], "note": "Допоміжне дієслово часу лишається, до нього додаємо to be у потрібній формі + V3.", "rule": ["pv"], "story": "музейні пограбування і злиті документи"}, {"kind": "gap", "instr": "Розкрийте дужки в пасиві.", "items": [["The Eiffel Tower ___ (build) for the 1889 World’s Fair.", ["was built"], "Минуле → was + V3."], ["English ___ (speak) all over the world.", ["is spoken"], "Факт → is + V3."], ["The suspect ___ (question) right now.", ["is being questioned"], "right now → is being + V3."], ["The documents ___ (leak) yesterday.", ["were leaked"], "yesterday, множина → were + V3."], ["The winner ___ (announce) tomorrow.", ["will be announced"], "Майбутнє → will be + V3."], ["The video ___ (already/watch) by millions.", ["has already been watched"], "already → has been + V3."], ["Phones ___ (not/allow) in the courtroom.", ["aren’t allowed|are not allowed"], "Правило зараз → are not + V3."]], "note": null, "rule": ["pv"]}, {"kind": "choice", "instr": "Активний чи пасивний стан?", "items": [["Coffee [grows|is grown] in Brazil.", "is grown", "Каву вирощують → пасив."], ["“Bohemian Rhapsody” [was written|wrote] by Freddie Mercury.", "was written", "Пісня не пише — її написали."], ["My grandma [was made|made] this borscht.", "made", "Бабуся — виконавиця дії."], ["The thief [arrested|was arrested] last night.", "was arrested", "Злодій не арештовував — його арештували."], ["The concert [was cancelled|cancelled] because of the storm.", "was cancelled", "Концерт скасували → пасив."], ["The police [arrested|were arrested] the thief.", "arrested", "Поліція виконує дію → активний стан."]], "note": null, "rule": ["pv"]}, {"kind": "translate", "instr": "Перекладіть.", "items": [["Мій акаунт зламали.", "My account was hacked.|My account has been hacked.", "Хто — невідомо → пасив.", ["\\b(was|has been|got) hacked\\b", "was / has been + V3 (пасив)"]], ["Цей будинок побудували в 1900 році.", "This house was built in 1900.", "was + V3.", ["\\bwas built\\b", "was + V3 (пасив)"]], ["Тут розмовляють англійською.", "English is spoken here.", "is + V3.", ["\\bis spoken\\b", "is + V3 (пасив)"]], ["Борщ внесли до списку ЮНЕСКО у 2022 році.", "Borscht was added to the UNESCO list in 2022.|Borscht was included in the UNESCO list in 2022.|Borscht was inscribed on the UNESCO list in 2022.", "was + V3; конкретний рік.", ["\\b(was|were|has been) \\w+(ed|en)\\b|\\bwas put\\b", "was + V3 (пасив)"]], ["Нас запросили на прем’єру.", "We were invited to the premiere.|We have been invited to the premiere.", "were + invited.", ["\\b(were|have been) invited\\b", "were + V3 (пасив)"]]], "note": null, "rule": ["pv"]}], "book": [21]}, {"id": "articles", "title": "Articles", "guide": "22–23", "sub": "Два з половиною артиклі — і чому без них «моя дівчина 10».", "ex": [{"kind": "gap", "instr": "Вставте a, an, the або — (без артикля).", "items": [["I have ___ cat. ___ cat hates me.", ["a", "The"], "Уперше — a; вдруге, вже конкретний — the."], ["My dad is ___ lawyer.", ["a"], "З професіями — a."], ["___ Sun is a star.", ["The"], "Унікальне, єдине → the."], ["I want to buy ___ guitar.", ["a"], "Якусь, одну з багатьох → a."], ["I can play ___ guitar.", ["the"], "Музичний інструмент як вид → the."], ["___ influencers are exhausting. (усі, в принципі)", ["—"], "Узагальнення → без артикля."], ["This is ___ best album of the year.", ["the"], "Найвищий ступінь → the."], ["I post on Instagram once ___ week.", ["a"], "Замість per → a."], ["Ruslana was ___ first Ukrainian to win Eurovision.", ["the"], "Порядковий числівник → the."], ["We took ___ children to ___ zoo.", ["the", "the"], "Конкретні діти, конкретний зоопарк."], ["___ rich should pay more taxes.", ["The"], "Прикметник → група людей: the rich."], ["I usually go to ___ bed at 3 am, thanks to true crime.", ["—"], "go to bed — без артикля."]], "note": null, "rule": ["art-a", "art-the", "art-zero"]}, {"kind": "gap", "instr": "Національності: the чи -s? Впишіть слово з дужок у правильній формі.", "items": [["___ (French) won the World Cup in 2018.", ["The French"], "-ch → the French."], ["Many ___ (Italian) live in my city.", ["Italians"], "Решта національностей → -s, без the."], ["___ (Japanese) invented karaoke.", ["The Japanese"], "-ese → the Japanese."], ["Two ___ (Mexican) opened a taco place nearby.", ["Mexicans"], "Mexican → Mexicans."], ["A ___ (Swiss) won the race.", ["Swiss"], "АЛЕ: a Swiss — швейцарець."], ["___ (English) drink a lot of tea.", ["The English"], "-sh → the English."]], "note": null, "rule": ["art-nat"]}, {"kind": "error", "instr": "Знайдіть і виправте помилку.", "items": [["My mom is teacher.", "My mom is a teacher.", "Професія → a."], ["I’m going to the bed.", "I’m going to bed.", "go to bed — без артикля."], ["The life is short, watch the series.", "Life is short, watch the series.", "Узагальнення → без артикля."], ["She plays a violin very well.", "She plays the violin very well.", "Інструмент → the."], ["Sun is very hot today.", "The sun is very hot today.", "Унікальне → the."], ["I stayed at the home all day.", "I stayed at home all day.", "at home — без артикля."]], "note": null, "rule": ["art-a", "art-the", "art-zero"]}, {"kind": "free", "instr": "Придумайте свою пару речень, де артикль змінює зміст, — як «My girlfriend is a 10 / My girlfriend is 10». Поясніть різницю.", "items": [], "note": null, "rule": [], "lines": 3}], "book": [22, 23]}, {"id": "stative", "title": "Stative Verbs", "guide": "24–25", "sub": "Дієслова, які не люблять -ing. І ті, що змінюють з ним значення.", "ex": [{"kind": "choice", "instr": "Simple чи Continuous? Зверніть увагу на значення.", "items": [["The MasterChef judge [tastes|is tasting] the soup.", "is tasting", "taste = пробувати → -ing."], ["She [has|is having] two Grammys.", "has", "have = мати → Simple."], ["This soup [is tasting|tastes] amazing.", "tastes", "taste = бути на смак → Simple."], ["She [has|is having] lunch with her lawyer.", "is having", "have lunch — інше значення → -ing."], ["I [think|am thinking] the ending was terrible.", "think", "think = вважати → Simple."], ["He [is being|is] very polite today — the cameras are on.", "is being", "Поводиться не так, як завжди → is being."], ["You [are looking|look] tired.", "look", "look = виглядати → Simple."], ["Be quiet, I [think|am thinking] about the plot twist!", "am thinking", "think = роздумувати → можна -ing."], ["Why [are you looking|do you look] at me like that?", "are you looking", "look = дивитися → -ing."], ["The parcel [is weighing|weighs] 2 kilos.", "weighs", "weigh = важити → Simple."], ["I [see|am seeing] what you mean.", "see", "see = розуміти, бачити → Simple."], ["I [am seeing|see] someone new — we met in October.", "am seeing", "see = зустрічатися → -ing."]], "note": null, "rule": ["st-change"]}, {"kind": "gap", "instr": "Розкрийте дужки.", "items": [["I ___ (not/understand) the ending of this series.", ["don’t understand"], "understand — stative → Simple."], ["She ___ (know) the killer for years.", ["has known"], "know + for years → Present Perfect, не Continuous."], ["This villa ___ (belong) to a former minister.", ["belongs"], "belong — stative."], ["Right now I ___ (need) your help.", ["need"], "need — stative навіть з right now."], ["We ___ (have) lunch at the moment, can I call you back?", ["are having"], "have lunch — дія → можна -ing."], ["___ you ___ (believe) in conspiracy theories?", ["Do", "believe"], "believe — stative."], ["The baker ___ (weigh) the flour.", ["is weighing"], "weigh = зважувати → -ing."], ["This perfume ___ (smell) like my ex.", ["smells"], "smell = пахнути → Simple."]], "note": null, "rule": ["st-list", "st-change"]}, {"kind": "sort", "instr": "Тільки Simple чи можна і в Continuous (з іншим значенням)? Впишіть номер.", "items": {"cats": ["1 — тільки Simple", "2 — можна в Continuous (інше значення)"], "items": [["feel", 1, "відчувати тактильно / почуватися."], ["taste", 1, "пробувати / бути на смак."], ["know", 0, "Mental state."], ["think", 1, "роздумувати / вважати."], ["own", 0, "Possessions."], ["have", 1, "інше значення / мати."], ["believe", 0, "Mental state."], ["see", 1, "зустрічатися / бачити."], ["belong", 0, "Possessions."], ["want", 0, "Mental state."]]}, "note": null, "rule": ["st-list", "st-change"], "compact": true}], "book": [24, 25, 26]}];
const RULES = {"wo-plus": {"page": 1, "title": "Ствердження", "formula": "Підмет + допоміжне + основне + додаток.", "text": "Допоміжне дієслово не перекладається, але показує, в якому часі відбувається дія. Основне — перекладається і виражає саму дію.", "ex": "I am playing Minecraft."}, "wo-minus": {"page": 1, "title": "Заперечення", "formula": "Підмет + допоміжне + not + основне + додаток.", "text": "Щоб утворити заперечення, додаємо not до допоміжного.", "ex": "I am not playing Minecraft."}, "wo-q": {"page": 1, "title": "Питання", "formula": "(Питальне слово) + допоміжне + підмет + основне + додаток + ?", "text": "Щоб утворити питання, змінюємо порядок слів: допоміжне стає перед підметом.", "ex": "Am I playing…? Why am I playing Minecraft?"}, "ps-form": {"page": 2, "title": "Present Simple: будова", "formula": "Допоміжне: do / does. Основне: V; he / she / it → V + s, es.", "text": "У Present Simple в розповідному реченні допоміжне НЕ СТАВИМО. Якщо підмет he, she, it, то +s / es додаємо до основного в розповідному реченні, а до допоміжного (does) — у запереченні й питанні.", "ex": "My cat hates me. He doesn’t hate me. Does he hate me?"}, "ps-use": {"page": 2, "title": "Present Simple: використання", "formula": "регулярні дії · загальновідомі факти · розклади і графіки", "text": "Слова-маркери: always, usually, often, sometimes, rarely, hardly ever, never; every day, every Monday, once a week, twice a month.", "ex": "The shop opens at 9."}, "ps-be": {"page": 3, "title": "Дія чи стан?", "formula": "дія → do / does · стан → am / is / are", "text": "Якщо в реченні можна знайти відповідь на питання «що робить?», використовуємо do / does. Якщо відповіді немає — теперішні форми to be.", "ex": "He drinks too much. → Does he drink…? / She is tired. → Is she tired?"}, "pc-form": {"page": 4, "title": "Present Continuous: будова", "formula": "Допоміжне: to be (am / is / are). Основне: +ing.", "text": "Якщо бачите в назві часу Continuous, то до основного дієслова 100% додаємо закінчення -ing.", "ex": "My cat is ruining my kitchen."}, "pc-use": {"page": 4, "title": "Present Continuous: використання", "formula": "дія в даний момент · як майбутній", "text": "Як і в українському «я йду гуляти наступної суботи», час той самий, а майбутнє показують часові рамки.", "ex": "I am playing curling next weekend."}, "stative-short": {"page": 4, "title": "Stative Verbs", "formula": "дієслова, які не можна ставити в тривалі часи", "text": "know, want, like, understand, believe, own, need… Детально — в Додатку I.", "ex": "I know (не I am knowing)."}, "pp-form": {"page": 5, "title": "Present Perfect: будова", "formula": "Допоміжне: have / has. Основне: +ed / V3.", "text": "Past Participle (V3) — третій стовпчик таблиці неправильних дієслів, використовуємо для Perfect. Правильні дієслова просто отримують -ed.", "ex": "I have run a marathon."}, "pp-use": {"page": 5, "title": "Present Perfect: використання", "formula": "дія завершилась, час триває · результат у теперішньому · досвід", "text": "Тут немає чітких часових рамок. Коли відбулись усі ці події? Хтозна.", "ex": "She has seen this movie three times."}, "pp-markers": {"page": 5, "title": "Present Perfect: слова-маркери", "formula": "already · recently · yet · just · never · ever · since · for", "text": "Already — вже (для розповідних речень). Yet — вже, ще (питання і заперечення). Just — щойно. Ever — колись, коли-небудь.", "ex": "I have already cleaned my room."}, "forms": {"page": 5, "title": "Три форми неправильних дієслів", "formula": "V1 base form · V2 Past Simple · V3 Past Participle", "text": "V2 використовуємо ТІЛЬКИ І ВИКЛЮЧНО для Past Simple. V3 — для Perfect. Таблиця — в Додатку II.", "ex": "go — went — gone"}, "pas-vs-pp": {"page": 9, "title": "Past Simple vs Present Perfect", "formula": "чіткий час → Past Simple · розмиті рамки → Present Perfect", "text": "Для Present Perfect характерні дуже розмиті часові рамки. Past Simple має чітко визначений час: учора, два дні тому, минулого року.", "ex": "I posted this cringe story 2 years ago."}, "ppc-form": {"page": 7, "title": "Present Perfect Continuous: будова", "formula": "Допоміжне: have been / has been. Основне: +ing.", "text": "Для будови ми буквально змішуємо Present Perfect (have / has і V3 — been) і Present Continuous (to be і -ing).", "ex": "She has been trying to understand grammar rules for the last 5 years."}, "ppc-use": {"page": 7, "title": "Present Perfect Continuous: використання", "formula": "дія почалась у минулому, триває досі або нещодавно закінчилась", "text": "Слова-маркери: for — протягом (якогось часу); since — з (якогось часу).", "ex": "I have been cooking all morning."}, "ppc-vs-pp": {"page": 8, "title": "Perfect чи Perfect Continuous?", "formula": "stative verbs → Perfect · наголос на тривалості → Continuous · на факті → Perfect", "text": "Через те, що ми не можемо використати know у тривалому часі, ми змушені будувати речення в Present Perfect. У решті випадків вирішує, що хочемо наголосити.", "ex": "I have known her for 10 years. / He has been living here since 2020."}, "pas-form": {"page": 9, "title": "Past Simple: будова", "formula": "Допоміжне: did. Основне: +ed / V2.", "text": "У Past Simple в розповідному реченні допоміжне НЕ СТАВИМО. У запереченні й питанні є did, тому основне повертається у V1.", "ex": "I posted… / I didn’t post… / Did I post…?"}, "pas-use": {"page": 9, "title": "Past Simple: використання", "formula": "конкретний час («коли?») · хронологічні події · дії, що не повторяться", "text": "Слова-маркери: yesterday, two days ago, last year, in 2020, in the past.", "ex": "Her sister was born in 2008."}, "pco-form": {"page": 10, "title": "Past Continuous", "formula": "Допоміжне: was / were. Основне: +ing.", "text": "Буквально тривала дія в минулому.", "ex": "I was playing the guitar at 4 am yesterday."}, "pco-types": {"page": 10, "title": "Тривалі дії бувають різні", "formula": "1 тривала · 2 перервана раптовою дією · 3 паралельні", "text": "Тривала дія — Past Continuous. Раптова дія, яка її перериває, — Past Simple (when). Дві тривалі дії одночасно — while.", "ex": "She was watching series when her mom came back from work."}, "ppf": {"page": 11, "title": "Past Perfect", "formula": "Допоміжне: had. Основне: +ed / V3.", "text": "Дія перед іншою дією в минулому. Те, що сталося ПЕРЕД ТИМ, — Past Perfect; звичайна завершена дія в минулому — Past Simple.", "ex": "I was late because I had overslept."}, "ppf-logic": {"page": 11, "title": "Відчуваєте логіку?", "formula": "When I arrived, he left. ≠ When I arrived, he had left.", "text": "Past Perfect чітко показує, що дія передувала конкретному моменту в минулому: ми не перетнулись, він пішов до того, як я прийшла.", "ex": "When I arrived, he had left."}, "ppfc": {"page": 12, "title": "Past Perfect Continuous", "formula": "Допоміжне: had been. Основне: +ing.", "text": "Тривала дія перед іншою дією в минулому: зупиняємось у моменті й повертаємось назад, щоб розказати, що відбувалося до того.", "ex": "He had been cooking for two hours when I came home."}, "fs": {"page": 13, "title": "Future Simple", "formula": "will + V1 · shall з I / we", "text": "Спонтанні дії; погрози, обіцянки; безпідставні передбачення. Shall використовуємо з I і we, щоб щось запропонувати.", "ex": "Oh, it’s hot. I’ll open the window. / Shall I help you?"}, "fpc": {"page": 14, "title": "Present Continuous для майбутнього", "formula": "to be + V-ing + часові рамки", "text": "Домовленості та особисті плани на майбутнє: ваш френд має бути в курсі, квитки куплені.", "ex": "I’m flying to London next Monday."}, "fgt": {"page": 14, "title": "to be going to", "formula": "am / is / are + going to + V", "text": "Аналог «збиратися щось зробити»; висновки на основі фактів (темні хмари — буде дощ).", "ex": "It’s going to rain."}, "m-can": {"page": 15, "title": "Can · Could · Will be able to", "formula": "можу · міг би · зможу", "text": "Can: здатність, можливість, пропозиція, прохання, дозвіл. Could: здатність у минулому, можливість, пропозиція, ввічливе прохання. Can не має майбутньої форми, тому — will be able to.", "ex": "I could swim when I was five."}, "m-may": {"page": 16, "title": "Might · May", "formula": "might — обережне припущення · may — ймовірніше, формальніше", "text": "Might: можливість, ввічливий дозвіл, гіпотетичні ситуації. May: припущення, ввічливе прохання, формальний дозвіл.", "ex": "He might know the answer. А може і не знати."}, "m-must": {"page": 16, "title": "Must · Have to · Should", "formula": "must — сам вирішив · have to — обставини · should — порада", "text": "Must: обов’язок, сильне припущення, сувора заборона (mustn’t). Have to: необхідність через правила чи ситуацію. Should: порада, моральний обов’язок, очікування.", "ex": "You mustn’t smoke here. / I have to wear a uniform at work."}, "c0": {"page": 17, "title": "Conditional 0", "formula": "if + Present Simple + Present Simple", "text": "Факти, ситуації, що відбуваються завжди. Просто запам’ятовуємо.", "ex": "If you heat ice, it melts."}, "c1": {"page": 17, "title": "Conditional I", "formula": "if + Present Simple + Future Simple", "text": "Можливі, ймовірні ситуації в теперішньому чи майбутньому. Unless = if + don’t.", "ex": "If she studies hard, she will go to the concert."}, "c2": {"page": 18, "title": "Conditional II", "formula": "if + Past Simple + would", "text": "Неможливі чи малоймовірні ситуації в теперішньому чи майбутньому. Забуваємо про was: для всіх осіб — were.", "ex": "If I were you, I would call him."}, "c3": {"page": 18, "title": "Conditional III", "formula": "if + Past Perfect + would have V3", "text": "Неможливі ситуації в минулому. І шкодування про сумнівні рішення.", "ex": "If I had gone to sleep earlier, I wouldn’t have been so tired yesterday."}, "mixed": {"page": 19, "title": "Mixed Conditionals", "formula": "if + Past Simple + would have V3 · if + Past Perfect + would", "text": "Загальна умова «в принципі» → наслідок у минулому. Або дія в минулому → наслідок у теперішньому часі.", "ex": "If I had made a better resume a month ago, I would get a better job."}, "is-tense": {"page": 20, "title": "Непряма мова: часи", "formula": "беремо те, що в лапках, і переводимо «на час назад»", "text": "Present Simple → Past Simple; Present Continuous → Past Continuous; Past Simple і Present Perfect → Past Perfect; Past Continuous → Past Perfect Continuous; will → would. Фізичні й хімічні явища не зсуваються.", "ex": "She said (that) she was busy."}, "is-q": {"page": 20, "title": "Непряма мова: питання", "formula": "Wh- · Yes / No · модальні", "text": "Залишаємо питальне слово і робимо прямий порядок слів. Якщо питального слова немає — додаємо «чи»: if / whether. Модальне слово ставимо в минулий час (can → could).", "ex": "She asked me where she was. / She asked if I liked her."}, "pv": {"page": 21, "title": "Passive Voice", "formula": "Object + (auxiliary verb if needed) + to be + V3", "text": "Використовуємо, коли фокус на дії або об’єкті, над яким відбувається дія, а не на людині, яка її виконує.", "ex": "An apple was bought (by me)."}, "art-a": {"page": 22, "title": "A (an)", "formula": "«якийсь, один»", "text": "Згадуємо про щось уперше; щось, що належить до ряду таких же речей; з професіями; замість per.", "ex": "I have a dog. / My dad is a doctor. / Once a week."}, "art-the": {"page": 22, "title": "The", "formula": "«цей, конкретний»", "text": "Згадуємо вдруге; щось унікальне; щось конкретне; прикметник → група людей (the rich); найвищий ступінь; порядкові числівники; назва виду (play the piano).", "ex": "The dog is very active. / the best, the first"}, "art-zero": {"page": 23, "title": "Без артикля", "formula": "узагальнення · most = більшість · сталі вирази", "text": "Books are expensive (усі книги в принципі). go to bed / be in bed; go to work / be at work; arrive home / be at home / stay home.", "ex": "Most shops are closed on holidays."}, "art-nat": {"page": 23, "title": "Національності", "formula": "-sh, -ch, -ese → the · інші → -s", "text": "the English, the French, the Chinese, the Japanese; Mexicans, Italians, Ukrainians. АЛЕ: the Swiss — швейцарці, a Swiss — швейцарець.", "ex": "The French … / Many Italians …"}, "st-list": {"page": 24, "title": "Stative Verbs", "formula": "слова, які не можна використовувати в тривалих часах", "text": "Mental state (know, understand, believe, want, need…), emotional state (love, hate, like…), possessions (own, belong…), sense perceptions, states and conditions (seem, cost, contain…).", "ex": "I know the answer."}, "st-change": {"page": 25, "title": "Коли -ing змінює значення", "formula": "think · have · taste · smell · feel · see · look · appear · weigh · be", "text": "think: роздумувати / вважати; have: інше значення / мати; taste: пробувати / бути на смак; see: зустрічатись / бачити; look: дивитись / виглядати; be: стилістичне вживання / бути.", "ex": "I’m having breakfast. / She’s being so cheerful today…"}};
