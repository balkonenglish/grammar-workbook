t-align: left; transform: rotate(1deg)\"><p style=\"margin: 0 0 6px; font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">слова-маркери:</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>yesterday</b> — вчора</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>two days ago</b> — два дні тому</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>last year</b> — минулого року</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>in 2020</b> — у 2020-му</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>in the past</b> — в минулому</p></div></div><div style=\"display: flex; flex-direction: column; gap: 18px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Конкретний час.</b> Past Simple відповідає на питання «коли?»: учора, два дні тому, минулого року, у 2013-му. Для мене і для вас «учора» однакове — це точка в минулому.</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>I lived in Lviv in 2013.</i></p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Послідовні події.</b> «Вчора я прокинулась, вмилась, приготувала їсти, поїла і вийшла». Послідовні дії? Так, значить усі вони будуть у Past Simple.</p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">3</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Дії, що не повторяться.</b> Past Simple — це подія в закритій коробці: почалась, тривала, закінчилась — усе в минулому.</p></div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>The Titanic sank in 1912.</i></p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I was in Turkey 2 years ago.</i> — ця поїздка не повториться, бо «2 роки тому» вже не повториться.</p></div></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Simple чи Present Perfect</span><span>15 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Simple чи Present Perfect?</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Саме ці два часи плутають найчастіше. Розкладаємо по поличках.</p></div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Точка чи дужки</h3></div><div style=\"display: flex; flex-direction: column; gap: 2px; align-items: stretch\"><svg style=\"align-self: center; display: block\" width=\"560\" height=\"62\" viewBox=\"0 0 560 62\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now</text><circle cx=\"200\" cy=\"44\" r=\"6\" fill=\"#7A1F45\"></circle><text x=\"176\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"14\" fill=\"#3A1626\">in 2013</text></svg><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: center\"><b>Past Simple — точка</b>: дія сталась у конкретний момент, і він уже минув.</p><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\"><i>I lived in Lviv in 2013.</i></p></div><div style=\"display: flex; flex-direction: column; gap: 2px; align-items: stretch\"><svg style=\"align-self: center; display: block\" width=\"560\" height=\"74\" viewBox=\"0 0 560 74\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now</text><path d=\"M240 18 C 224 30, 224 58, 240 70\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M448 18 C 464 30, 464 58, 448 70\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><circle cx=\"340\" cy=\"44\" r=\"6\" fill=\"#7A1F45\"></circle><text x=\"252\" y=\"18\" font-family=\"PT Serif, serif\" font-size=\"14\" fill=\"#3A1626\">in the last 5 years</text></svg><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: center\"><b>Present Perfect — дужки</b>: дія сталась у будь-який момент періоду, який <b>ще не закінчився</b> — сьогодні, цього тижня, за останні 5 років, за життя.</p><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\"><i>I have changed jobs twice in the last 5 years.</i></p></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Коли?</h3></div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Past Simple</b> — час чіткий, однаковий для всіх: <i>yesterday, two days ago, last year, in 2013</i>.</p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Present Perfect</b> — час розмитий або неважливий: <i>recently, just, already, ever, never</i>. От коли відбулось «нещодавно»? Хвилину тому чи пів року? Хтозна.</p></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Коробка чи полиця?</h3></div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Past Simple</b> — закрита коробка: усе сталось і лишилось у минулому.<br><i>I was in Turkey 2 years ago.</i></p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Present Perfect</b> — ачівка на полиці: досвід є зараз, і можна поїхати ще.<br><i>I have been to Turkey.</i></p></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: center\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>У живій розмові вони чергуються</b></div><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: left\">— <i>Have you ever been to Turkey?</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">досвід, без часу → Present Perfect</p><p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.45; text-align: left\">— <i>Yes, I have. I went there in 2019.</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">з’явилось «коли» → Past Simple</p></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(0.6deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Лайфхак</b></div><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Є слово, яке каже <b>коли</b> (yesterday, in 2019, two days ago) — Past Simple.</p><p style=\"margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Немає такого слова — і сумніваєтесь? Ставте <b>Present Perfect</b>.</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Continuous</span><span>16 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Continuous</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" s gin: 0; font-size: 14px; line-height: 1.45; text-align: center\">3. Паралельні дії в минулому:</p><p style=\"margin: 0; font-size: 16.5px; line-height: 1.45; text-align: center\"><i>She <span style=\"color: #4D74A8; font-weight: 700\">was watching</span> a series while her mom <span style=\"color: #4D74A8; font-weight: 700\">was cooking</span> dinner.</i></p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: center\">Вона <b>дивилась</b> <span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; color: #4D74A8; white-space: nowrap\">(що робила?)</span> серіал, поки мама <b>готувала</b> <span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; color: #4D74A8; white-space: nowrap\">(що робила?)</span> вечерю. Обидві — Past Continuous.</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Perfect</span><span>18 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 12px; margin-top: 18px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Perfect</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">показує час</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">третя форма дієслова</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">had</b></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; font-family: 'PT Serif', serif; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 20px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор — для всіх осіб</span></div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; row-gap: 2px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">+</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">had</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">−</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">hadn’t</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">?</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\"><b style=\"color: #4D74A8\">Had</b> you finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>?</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">дія перед іншою дією в минулому.</li></ol></div></div><p style=\"margin: 0; font-size: 21px; line-height: 1.3; text-align: center\">I was late because I <span style=\"position: relative; display: inline-block\">had overslept<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span>.</p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"64\" viewBox=\"0 0 560 64\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now</text><path d=\"M214 36 L 230 52 M 230 36 L 214 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><circle cx=\"310\" cy=\"44\" r=\"5\" fill=\"#3A1626\"></circle><path d=\"M310 36 C 300 4, 250 2, 228 30 M 222 20 L 227 31 L 237 26\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><div style=\"display: grid; grid-template-columns: 200px 200px; gap: 40px; justify-content: center; font-size: 14px; line-height: 1.4\"><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">Тому що ПЕРЕД ТИМ я проспав.</p>Past Perfect.</div><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Я спізнився.</p>Past Simple. Звичайна завершена дія в минулому.</div></div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Тут з’являється цілком логічне питання: чому я не можу сказати <i>«I was late because I overslept»</i>?</p><p style=\"margin: 0; text-align: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">МОЖЕТЕ.</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">В такому випадку нахіба мені той Past Perfect?</p><div style=\"display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><span style=\"color: #7A1F45\">Як викладач</span> я скажу: тут Past Perfect показує, що певна дія передувала конкретному моменту в минулому. Якщо послідовність і так зрозуміла, то цілком виправдано використати Past Simple в обидвох випадках. Але це не завжди так очевидно. Наприклад:</p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: center\"><i>When I arrived, he left.</i></p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Він пішов до того, як я прийшла, чи в той самий момент? Ми перетнулись чи ні? Якщо сказати:</p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: center\"><i>When I arrived, he had left.</i></p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">— то буде чітко зрозуміло, що ми не перетнулись: він пішов до того, як я прийшла. Відчуваєте логіку?</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><span style=\"color: #7A1F45\">Як людина, яка махала вчити більше, ніж треба</span>, скажу: та нінахіба.</p><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Він просто пригодиться вам надалі в складнішій граматиці, без якої вже тяжче добитись високого рівня.</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Perfect Continuous</span><span>19 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Perfect Continuous</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Past Perfect Progressive. Минулий Доконаний Тривалий.</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 6px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11px; letter-spacing: .06em; color: #7A1F45\">ФОРМУЛА</span></div><div style=\"display: grid; grid-template-columns: auto 18px auto 18px auto; justify-content: start; column-gap: 4px; row-gap: 6px; align-items: start\"><span style=\"justify-self: start; border: 1.5px solid #3A1626; border-radius: 6px; padding: 2px 8px; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1.35; white-space: nowrap\">підмет</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #4D74A8; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\"><b style=\"color: #4D74A8\">had been</b></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V + <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ing</b></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">показує час</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">дієслово + ing</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">He</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">had been</b></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">cook<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ing</b>.</span></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; font-family: 'PT Serif', serif; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 20px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор — для всіх осіб</span></div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; row-gap: 2px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">+</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">had been</b> cook<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ing</b>.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">−</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">hadn’t been</b> cook<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ing</b>.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">?</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\"><b style=\"color: #4D74A8\">Had</b> you <b style=\"color: #4D74A8\">been</b> cook<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ing</b>?</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">тривала дія перед іншою дією в минулому.</li></ol></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px\"><b style=\"color: #7A1F45\">Будова різна, а різниця — тільки в питанні</b></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #7A1F45\">PAST PERFECT</span><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1.1; color: #4D74A8\">що зробив до того?</span><i style=\"font-size: 15px; line-height: 1.35\">He had cooked dinner when I came home.</i><span style=\"font-size: 13.5px; line-height: 1.35\">Вечеря вже була готова — результат.</span></div><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #7A1F45\">PAST PERFECT CONTINUOUS</span><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1.1; color: #4D74A8\">що робив до того?</span><i style=\"font-size: 15px; line-height: 1.35\">He had been cooking for two hours when I came home.</i><span style=\"font-size: 13.5px; line-height: 1.35\">Готував дві години — процес.</span></div></div></div><p style=\"margin: 0; font-size: 21px; line-height: 1.3; text-align: center\">He <span style=\"position: relative; display: inline-block\">had been cooking<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> for two hours when I <span style=\"position: relative; display: inline-block\">came<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> home.</p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"64\" viewBox=\"0 0 560 64\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now</text><path d=\"M150 36 V 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M150 26 Q 156.0 22, 162 26 Q 168.0 30, 174 26 Q 180.0 22, 186 26 Q 192.0 30, 198 26 Q 204.0 22, 210 26 Q 216.0 30, 222 26 Q 228.0 22, 234 26 Q 240.0 30, 246 26 Q 252.0 22, 258 26 Q 264.0 30, 270 26 Q 276.0 22, 282 26 M 275 21 L 282 26 L 275 31\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><circle cx=\"300\" cy=\"44\" r=\"5\" fill=\"#3A1626\"></circle></svg><div style=\"display: grid; grid-template-columns: 220px 200px; gap: 40px; justify-content: center; font-size: 14px; line-height: 1.4\"><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">А ДО ТОГО він уже 2 години готував.</p>Тривала дія. Past Perfect Continuous.</div><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Я прийшла.</p>Past Simple. Звичайна завершена дія в минулому.</div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 16px 22px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Система приблизно така ж: ми можемо використати Past Continuous — тривала дія, перервана іншою дією. <b>Але!</b></p><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.45; text-align: center\">Як у Past Perfect, так і в Past Perfect Continuous ми наче зупиняємось у моменті і повертаємось назад, щоб розказати події до того.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Future Actions</span><span>20 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 26px\"><div style=\"position: relative; display: flex; flex-direction: column g: 2px 8px; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1.35; white-space: nowrap\">підмет</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #4D74A8; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\"><b style=\"color: #4D74A8\">will</b></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V1</span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">або shall (див. нижче)</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">дієслово без змін</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">will</b></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">help.</span></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 10px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; font-family: 'PT Serif', serif; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 20px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор — для всіх осіб</span></div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; row-gap: 2px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">+</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">will</b> help. = I<b style=\"color: #4D74A8\">’ll</b> help.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">−</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\">I <b style=\"color: #4D74A8\">won’t</b> help. <br><span style=\"font-size: 13px\">won’t = will not</span></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45\">?</span><span style=\"font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.4\"><b style=\"color: #4D74A8\">Will</b> you help?</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">спонтанні дії;</li><li style=\"margin: 0 0 2px\">погрози, обіцянки;</li><li style=\"margin: 0 0 2px\">безпідставні передбачення.</li></ol></div></div><div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 26px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 16px 18px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.2deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Весь цивілізований світ використовує <b>will</b> для утворення майбутнього. <b>Але!</b> <b>Shall</b> ми використовуємо із займенниками I і we для того, щоб щось запропонувати (або ж у формальному стилі мовлення).</p><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><i>Shall we go out?<br>Shall I help you?</i></p></div><div style=\"display: flex; flex-direction: column; gap: 14px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>Oh, it’s hot. I’ll open the window.</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Спонтанно. Подумав, що спекотно — відкрив вікно. Ви ж не планували це рік наперед, окей.</p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>Man, I’ll kill you!</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">«Я тебе приб’ю!» — але ж це ну не означає, що ви зібрались когось прибивать.</p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">3</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>One day you will win the lottery!</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Прям лотерею виграю? А з чого такі висновки?</p></div></div></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Після when, if, as soon as, before, after, until — майбутнього не ставимо</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Там, де українською «коли прийду», англійською — теперішній час:</p><p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>I’ll call you when I <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">get</b> home.</i> — не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">when I will get home</span></span>.</p><p style=\"margin: 2px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>If it <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">rains</b>, we’ll stay home.</i></p></div></div></div>", "<div style=\"width: 794px; height: 112 ify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V1</span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">модальне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">теж допоміжне, не змінюється</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">без to і без -s</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">She</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">can</b></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">swim.</span></div><div style=\"height: 10px\"></div><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"font-size: 14px\">Усі три форми — без do</b></div><div style=\"display: grid; grid-template-columns: 22px 330px minmax(0, 1fr); column-gap: 10px; row-gap: 4px; align-items: baseline; margin-top: 4px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45\">+</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">підмет + <b style=\"color: #4D74A8\">модальне</b> + V1</span><i style=\"font-size: 15px\">She <b style=\"color: #4D74A8\">can</b> swim.</i><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45\">−</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">підмет + <b style=\"color: #4D74A8\">модальне</b> + not + V1</span><i style=\"font-size: 15px\">She <b style=\"color: #4D74A8\">can’t</b> swim. <span style=\"font-style: normal; font-size: 13px\">(can + not = cannot / can’t)</span></i><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45\">?</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\"><b style=\"color: #4D74A8\">модальне</b> + підмет + V1 + ?</span><i style=\"font-size: 15px\"><b style=\"color: #4D74A8\">Can</b> she swim?</i></div><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Не так: <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She cans swim.</span></span> <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She can to swim.</span></span> <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She can swims.</span></span> <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">Does she can swim?</span></span></p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">1.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Can</h2></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">можу</p><div style=\"display: flex; flex-direction: column; gap: 14px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Ability (здатність):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I can swim.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, щось фізично може відбутись):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It can happen.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Offer (пропозиція):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I can help you.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Request (прохання):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Can you help me?</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (дозвіл):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You can leave.</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">2.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Could</h2></div><div style=\"display: flex; align-items: baseline; gap: 4px\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">міг · міг би</p></div><div style=\"display: flex; flex-direction: column; gap: 14px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Past ability (здатність у минулому):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I could swim when I was five.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It could rain tonight.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Suggestion (пропозиція):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">We could go to the cinema.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Polite request (ввічливе прохання):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Could you help me?</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (ввічливий дозвіл):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Could I use your phone?</span></div></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Modal Verbs</span><span>26 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Modal Verbs</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження.</p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">3.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">May</h2></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">можливо, можна</p><div style=\"display: flex; flex-direction: column; gap: 15px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, припущення, ймовірніше, ніж might):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It may rain today.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Polite request (ввічливе прохання):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">May I ask you a question?</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (дозвіл, формальніше, ніж can):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You may leave now.</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">4.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Might</h2></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">може, а може й ні</p><div style=\"display: flex; flex-direction: column; gap: 15px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, обережне припущення):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">He might know the answer. А може і не знати.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Hypothetical situations (гіпотетичні ситуації):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I might buy this dress if it were cheaper.</span></div></div><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">Might I ask you a question?</span></span> — прибрали: так ніхто не каже.</p></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 40px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">5.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Must</h2></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">мушу, обов’язково</p><div style=\"display: flex; flex-direction: column; gap: 15px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Obligation (сильний обов’язок, частіше в письмі й правилах):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I must finish the project today.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Strong deduction (сильне припущення, логічний висновок):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">She must be tired after the night shift.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Prohibition (сувора заборона):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You mustn’t smoke here.</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">6.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Should</h2></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">варто, слід</p><div style=\"display: flex; flex-direction: column; gap: 15px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Advice / recommendation (порада, рекомендація):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You should get more sleep.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Duty (моральний обов’язок):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">People should respect each other.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Expectation (очікування):</span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">The train should arrive at 6.</span></div></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Conditionals</span><span>27 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 22px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Conditionals</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Умовні речення. Складаються з двох частин: умови та наслідку.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(0.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Кома</b></div><p style=\"margin: 2px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Речення починається з <b>if</b> — ставимо кому: <i>If you heat ice, it melts.</i> <b>If</b> у середині — коми немає: <i>It melts if you heat it.</i></p></div><section style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">ZERO CONDITIONAL</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">якщо</p></div><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.5px; line-height: 1.2\">if + Present Simple, Present Simple</h2></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg); width: 210px; box-sizing: border-box\">Так, цей просто запам’ятовуємо, це легко.</div></div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Факти, ситуації, що відбуваються завжди.</p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><i style=\"font-size: 18px; line-height: 1.35\">If you heat ice, it melts.</i><span style=\"font-size: 14.5px; line-height: 1.4\">→ Якщо нагріваєш лід, він тане.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><i style=\"font-size: 18px; line-height: 1.35\">I don’t go to the gym if I’m tired.</i><span style=\"font-size: 14.5px; line-height: 1.4\">→ Я не йду в зал, якщо я втомлена.</span></div></div><div style=\"display: flex; align-items: baseline; gap: 6px\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Як в англійській теперішній, так і перекладаємо — теперішнім.</p></div></section><div style=\"height: 1px; background: #3A1626\"></div><section style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">FIRST CONDITIONAL</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">якщо</p></div><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.5px; line-height: 1.2\">if + Present Simple, Future Simple</h2></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg); width: 210px; box-sizing: border-box\">Цей теж запам’ятовуємо.</div></div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Реальні, ймовірні ситуації в майбутньому: якщо щось станеться (зараз чи пізніше), то в майбутньому буде наслідок.</p><div style=\"display: flex; justify-content: flex-start; align-items: flex-start; gap: 16px; margin-top: 4px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 20px; line-height: 1.15; white-space: nowrap\">If you leave now,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #4D74A8; text-align: center; white-space: nowrap\">Present Simple</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 20px; line-height: 1.15; white-space: nowrap\">we won’t be late.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">Future Simple</span></div></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">→ Якщо ти вийдеш зараз, ми не запізнимось.</p><div style=\"display: flex; flex-direction: column; gap: 1px\"><i style=\"font-size: 18px; line-height: 1.35\">If you buy me flowers, I’ll be the happiest girl in the world.</i><span style=\"font-size: 14.5px; line-height: 1.4\">→ Якщо купиш мені квіти, я буду найщасливіша.</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">а ще ним чудово шантажувати</p></div></div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Зверніть увагу: українською обидві частини в майбутньому («вийдеш», «не запізнимось»), а англійською після <b>if</b> — Present Simple. Те саме правило, що й у Future Simple: після if — без will.</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Замість <b>will</b> можна <b>can / may / might</b>: <i>If it rains, we might stay home.</i></p><div style=\"display: flex; align-items: center; gap: 14px; margin-top: 4px\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-8deg)\">Unless =<br>if + don’t</p><svg width=\"18\" height=\"70\" viewBox=\"0 0 18 70\" aria-hidden=\"true\"><path d=\"M2 2 C 10 2, 8 29.0, 9 33.0 C 10 35.0, 13 35.0, 16 35.0 C 13 35.0, 10 35.0, 9 37.0 C 8 41.0, 10 68, 2 68\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 17px\"><span>If you <span style=\"position: relative; display: inline-block\">don’t<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> leave now, we’ll be late.</span><span><span style=\"position: relative; display: inline-block\">Unless<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> you leave now, we’ll be late.</span></div></div></section></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Conditionals</span><span>28 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Conditionals</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Другий тип.</p></div><section style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">SECOND CONDITIONAL</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">якби … б</p></div><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.5px; line-height: 1.2\">if + Past Simple, would + V1</h2></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg); width: 210px; box-sizing: border-box\">А тепер включаємо логіку: беремо будову першого типу і переробляємо в минулий час:<br>Present Simple → Past Simple<br>will → would<br>Так, <b>would</b> — це минула форма will.</div></div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\"><b>Уявні ситуації</b> — неможливі або малоймовірні. Не про конкретний час, а взагалі, в принципі.</p><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Тобто другий тип — про <b>нереальне завжди</b>: те, що про вас неправда і тоді, і зараз.</p></section><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><i style=\"font-size: 18px; line-height: 1.35\">If I won the lottery, I would travel the world.</i><span style=\"font-size: 14.5px; line-height: 1.4\">→ Якби я виграла в лотерею, я б подорожувала світом.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><i style=\"font-size: 18px; line-height: 1.35\">If I <span style=\"position: relative; display: inline-block\">were<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> you, I would call him.</i><span style=\"font-size: 14.5px; line-height: 1.4\">→ Якби я була тобою, я б йому подзвонила.</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">тут забуваємо про was: для всіх осіб — were</p></div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Машина часу</b></div><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Уявіть, що ви маєте машину часу. От дії в умовному реченні другого типу не можуть відбутись, навіть якщо ви повернетесь у минуле чи почапаєте в майбутнє. Якби я була тобою, я б йому подзвонила. Але я не можу бути тобою, і ніяка машина часу мене тут не врятує.</p></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Що ще варто знати</h3><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><b>If I were you, I’d…</b> — класична формула поради: «На твоєму місці я б…»</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Замість <b>would</b> можна <b>could / might</b>: <i>If I had more time, I could learn Spanish.</i> — Якби в мене було більше часу, я б могла вивчити іспанську.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Conditionals</span><span>29 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 18px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Conditionals</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Третій тип і всі разом.</p></div><section style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 2px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">THIRD CONDITIONAL</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">якби … б</p></div><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.5px; line-height: 1.2\">if + Past Perfect, would have V3</h2></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg); width: 210px; box-sizing: border-box\">Тут схожа ситуація: беремо другий тип і переробляємо все в Perfect:<br>Past Simple → Past Perfect<br>would → would have V3</div></div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Неможливі ситуації в минулому: якби тоді сталось щось інше, то й результат тоді був би інший. Обидві частини — про минуле, яке вже не змінити.</p><p style=\"margin: 0; font-size: 19px; line-height: 1.3; text-align: left\"><span style=\"position: relative; display: inline-block\">If I had gone to sleep earlier,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> <span style=\"position: relative; display: inline-block\">I wouldn’t have been so tired yesterday.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span></p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">→ Якби я ВЧОРА пішла спати раніше, то ВЧОРА я б не була такою втомленою.</p></section><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>А тепер та сама машина часу</b></div><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">А от дії в умовному реченні третього типу можуть відбутись, якщо ви повернетесь у минуле. Якби я вчора пішла спати раніше, я б не була такою втомленою: повернулась би у вчора — і могла б лягти раніше.</p><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.45; text-align: left; color: #555\">Єдиний кондішонал, який відповідає за минуле… і шкодування про сумнівні рішення, які вже можна вирішити хіба що за допомогою машини часу.</p></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.3deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Одне речення — чотири типи</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Немає речень, які «належать» тільки одному типу. Те саме речення можна сказати в усіх чотирьох — зміниться тільки контекст.</p><div style=\"display: grid; grid-template-column
