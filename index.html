<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Workbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Mono&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* zine paper, single theme. Layout: topic sidebar + topic view with two modes (Посібник / Вправи) */
  --paper: #F6F1E3; --paper-2: #FCFAF4; --clip: #FAF8F1; --ink: #3A1626; --muted: #6F535B;
  --soft: #A9C2E6; --rust: #7A1F45; --blue: #4D74A8; --ok: #2E6B3F; --bad: #B42318; --line: #C1B4AE;
  --display: 'Unbounded', 'Arial Black', sans-serif; --body: 'PT Serif', Georgia, serif;
  --mono: 'PT Mono', ui-monospace, monospace; --hand: 'Caveat', 'Comic Sans MS', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
a { color: var(--blue); }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.wrap { max-width: 1160px; margin: 0 auto; padding: 28px 20px 80px; display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; }
header.top { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px 28px; border-bottom: 1px solid var(--ink); padding-bottom: 18px; }
.brand h1 { width: fit-content; padding: 0 8px; margin: 0 0 0 -8px; background: linear-gradient(transparent 55%, var(--soft) 55%, var(--soft) 92%, transparent 92%); font-family: var(--display); font-weight: 800; font-size: clamp(30px, 5vw, 46px); letter-spacing: -1.5px; line-height: 1; }
.brand p { margin: 8px 0 0; font-family: var(--hand); font-size: 23px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.progress { min-width: 240px; display: flex; flex-direction: column; gap: 6px; font-family: var(--mono); font-size: 13px; }
.bar { height: 8px; background: var(--paper-2); border: 1px solid var(--ink); }
.bar > span { display: block; height: 100%; background: var(--rust); width: 0; transition: width .3s; }
nav.topics { position: sticky; top: 16px; align-self: start; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 32px); overflow-y: auto; }
nav.topics h2 { margin: 0 0 8px; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 400; }
nav.topics a { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; padding: 6px 8px; text-decoration: none; color: var(--ink); border: 1px solid transparent; }
nav.topics a:hover { background: var(--paper-2); }
nav.topics a[aria-current="page"] { background: var(--paper-2); border-color: var(--ink); }
nav.topics .n { font-family: var(--mono); font-size: 12px; color: var(--rust); }
nav.topics .st { font-family: var(--mono); font-size: 11px; color: var(--muted); }
nav.topics .st.done { color: var(--ok); }
main { min-width: 0; display: flex; flex-direction: column; gap: 28px; }
.t-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 20px; }
.t-head .num { font-family: var(--display); font-weight: 800; font-size: 34px; color: var(--rust); line-height: 1; }
.t-head h2 { width: fit-content; padding: 0 6px; margin-left: -6px; background: linear-gradient(transparent 52%, var(--soft) 52%, var(--soft) 92%, transparent 92%); margin-top: 0; margin-bottom: 0; margin-right: 0; font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4vw, 34px); letter-spacing: -1px; line-height: 1.1; text-wrap: balance; }
.t-head .title { display: flex; align-items: baseline; gap: 14px; }
.t-head .sub { margin: 6px 0 0; font-family: var(--hand); font-size: 22px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.tabs { display: inline-flex; border: 1px solid var(--ink); }
.tabs a { padding: 8px 16px; text-decoration: none; color: var(--ink); font-size: 15px; background: var(--paper-2); }
.tabs a + a { border-left: 1px solid var(--ink); }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--paper); }
.ul { display: block; width: 100%; height: 10px; }
/* book */
.book-tools { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.book { display: flex; flex-direction: column; gap: 22px; align-items: center; }
.book.full { align-items: flex-start; overflow-x: auto; }
.sheet { --s: 1; width: 100%; max-width: 794px; height: calc(1123px * var(--s)); overflow: hidden; position: relative; border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(58, 22, 38, .12); flex: none; }
.book.full .sheet { width: 794px; max-width: none; }
.pg { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; transform: scale(var(--s)); transform-origin: 0 0; }
.pg h1, .pg h2, .pg h3 { text-wrap: balance; }
.pg-num { font-family: var(--mono); font-size: 12px; color: var(--muted); align-self: center; margin-top: -14px; }
/* exercises */
.card { background: var(--paper-2); border: 1px solid var(--ink); padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.card h3 { margin: 0; display: flex; gap: 12px; align-items: baseline; font-size: 17px; line-height: 1.35; }
.card h3 .code { font-family: var(--display); font-weight: 800; font-size: 18px; color: var(--rust); white-space: nowrap; }
.story { margin: -8px 0 0; font-family: var(--hand); font-size: 21px; font-weight: 600; color: var(--rust); line-height: 1.1; }
.note { margin: -6px 0 0; font-family: var(--hand); font-size: 20px; font-weight: 600; color: var(--blue); line-height: 1.15; }
ol.items { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; counter-reset: it; }
ol.items > li { counter-increment: it; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; align-items: baseline; }
ol.items > li::before { content: counter(it) "."; font-family: var(--mono); font-size: 13px; color: var(--rust); }
ol.items.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.line { font-size: 17px; line-height: 2.1; }
input.blank { border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 0 4px; font-size: 17px; min-width: 5ch; max-width: 100%; }
input.full { width: 100%; border: 0; border-bottom: 1.5px solid var(--ink); background: transparent; padding: 4px 2px; font-size: 17px; }
.prompt { font-size: 17px; }
.prompt.mono { font-family: var(--mono); font-size: 15px; }
.lbl { font-family: var(--display); font-weight: 700; font-size: 13px; color: var(--rust); margin-right: 6px; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 18px; }
.pair > div { display: flex; align-items: baseline; }
input.ok, select.ok { border-color: var(--ok); color: var(--ok); }
input.bad, select.bad { border-color: var(--bad); color: var(--bad); }
input.ok, input.bad { border-bottom-width: 2px; }
.choices { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; margin: 0 4px; }
.choices label { position: relative; cursor: pointer; }
.choices input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choices span { display: inline-block; padding: 1px 10px; border: 1px solid var(--ink); background: var(--paper); font-size: 16px; line-height: 1.6; }
.choices input:checked + span { background: var(--ink); color: var(--paper); }
.choices input:focus-visible + span { outline: 2px solid var(--blue); outline-offset: 2px; }
.choices.ok input:checked + span { background: var(--ok); border-color: var(--ok); }
.choices.bad input:checked + span { background: var(--bad); border-color: var(--bad); }
.choices .right span { box-shadow: 0 0 0 2px var(--ok); }
.match { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px 28px; }
.match .right { display: flex; flex-direction: column; gap: 8px; }
.match .right p { margin: 0; font-size: 16px; }
.match .right b { font-family: var(--mono); color: var(--blue); font-weight: 400; margin-right: 6px; }
select { border: 1px solid var(--ink); background: var(--paper); padding: 3px 6px; font-size: 15px; }
.cats { display: flex; flex-wrap: wrap; gap: 8px; }
.cats span { border: 1px solid var(--ink); padding: 3px 10px; font-size: 14px; background: var(--paper); }
textarea { width: 100%; min-height: 150px; border: 1px solid var(--ink); background: var(--paper); padding: 10px 12px; font-size: 16px; line-height: 1.6; resize: vertical;
  background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--line) 25px, var(--line) 26px); background-attachment: local; }
.why-btn { margin-left: 8px; border: 1px solid var(--bad); color: var(--bad); background: transparent; font-family: var(--hand); font-size: 18px; font-weight: 700; line-height: 1; padding: 2px 8px; cursor: pointer; vertical-align: middle; }
.exp { margin-top: 6px; padding: 8px 12px; border-left: 3px solid var(--blue); background: var(--paper); display: flex; flex-direction: column; gap: 2px; }
.diag:empty { display: none; }
.diffline { font-weight: 400 !important; color: var(--ink) !important; font-size: 17px !important; line-height: 1.9 !important; }
.w-bad { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.w-fix { color: var(--ok); font-weight: 700; border-bottom: 2px solid var(--ok); margin-left: 3px; }
.w-extra { color: var(--bad); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.w-miss { color: var(--ok); font-weight: 700; border-bottom: 2px dashed var(--ok); }
.w-miss::before { content: '+'; font-size: 12px; vertical-align: super; }
.diffline.soft .w-bad, .diffline.soft .w-extra { color: var(--muted); }
.diffline.soft .w-fix, .diffline.soft .w-miss { color: var(--blue); border-color: var(--blue); }
.diag .ok-line { color: var(--ok) !important; }
.diag .soft-msg { color: var(--blue) !important; font-weight: 400 !important; }
.diag-h.soft { color: var(--blue); }
.why-btn.soft { border-color: var(--blue); color: var(--blue); }
.diag { display: flex; flex-direction: column; gap: 2px; padding-bottom: 4px; margin-bottom: 2px; border-bottom: 1px dashed var(--line); }
.diag .diag-h { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--bad); }
.diag p { margin: 0; font-size: 15.5px; font-weight: 700; color: var(--bad); line-height: 1.4; }
input.near { border-color: var(--rust); color: var(--rust); border-bottom-style: dashed; border-bottom-width: 2px; }
.why-btn.near { border-color: var(--rust); color: var(--rust); }
.exp .ans { font-size: 16px; font-weight: 700; color: var(--ok); }
.exp .why { font-family: var(--hand); font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--blue); }
.clips { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; padding-top: 6px; }
.clip { position: relative; background: var(--clip); border: 1.5px dashed var(--ink); padding: 22px 20px 16px; display: flex; flex-direction: column; gap: 8px; transform: rotate(-.6deg); box-shadow: 3px 3px 0 rgba(58, 22, 38, .10); }
.clip:nth-child(2n) { transform: rotate(.7deg); }
.clip .sc { position: absolute; top: -12px; left: 18px; background: var(--paper-2); padding: 0 4px; }
.clip .meta { font-family: var(--mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--rust); }
.clip h4 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 16px; letter-spacing: -.4px; line-height: 1.2; }
.clip .f { font-family: var(--mono); font-size: 13.5px; line-height: 1.45; border: 1px solid var(--ink); padding: 6px 10px; background: var(--paper-2); }
.clip p { margin: 0; font-size: 15px; line-height: 1.45; }
.clip .e { font-style: italic; }
.clip a { font-size: 14px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px dashed var(--line); }
.btn { border: 1px solid var(--ink); background: var(--ink); color: var(--paper); padding: 8px 16px; cursor: pointer; font-size: 15px; text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:hover { filter: brightness(1.15); }
.score { margin-left: auto; font-family: var(--hand); font-size: 22px; font-weight: 700; line-height: 1; }
.score.good { color: var(--ok); } .score.meh { color: var(--rust); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.pager a { text-decoration: none; border: 1px solid var(--ink); padding: 10px 16px; color: var(--ink); background: var(--paper-2); }
.pager a:hover { background: var(--ink); color: var(--paper); }
.free-note { margin: 0; font-family: var(--hand); font-size: 20px; color: var(--muted); font-weight: 600; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 22px; padding-top: 18px; }
  nav.topics { position: static; flex-direction: row; flex-wrap: wrap; gap: 6px; max-height: none; }
  nav.topics h2 { width: 100%; margin: 0; }
  nav.topics a { grid-template-columns: auto auto; border-color: var(--ink); padding: 4px 10px; }
  nav.topics a .st { display: none; }
  .match, .pair { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 18px 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.side { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
.dl { position: relative; }
.dl summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border: 1px solid var(--ink); background: var(--paper-2); font-size: 15px; }
.dl summary::-webkit-details-marker { display: none; }
.dl summary:hover, .dl[open] summary { background: var(--ink); color: var(--paper); }
.dl .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 300px; background: var(--clip); border: 1px solid var(--ink); box-shadow: 4px 4px 0 rgba(58, 22, 38, .12); padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 12px; }
.dl .row b { display: block; font-family: var(--display); font-size: 14px; letter-spacing: -.3px; }
.dl .row small { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.dl .row div { display: flex; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
.dl .row a { font-size: 14px; padding: 3px 10px; border: 1px solid var(--ink); text-decoration: none; color: var(--ink); background: var(--paper); }
.dl .row a:hover { background: var(--ink); color: var(--paper); }
.dl .hint { margin: 0; font-family: var(--hand); font-size: 19px; font-weight: 600; color: var(--blue); line-height: 1.1; }
@media (max-width: 760px) { .side { align-items: stretch; } .dl .menu { left: 0; right: auto; width: min(300px, 90vw); } }
</style>
</head>

<script>
const TOPICS = [{"id": "word-order", "title": "Word Order", "guide": "1–2", "sub": "Підмет, допоміжне, основне, додаток — і в якому порядку їх ставити.", "ex": [{"kind": "order", "instr": "Розставте слова в правильному порядку.", "items": [["expanding / is / the universe", "The universe is expanding.", "Підмет (the universe) → допоміжне (is) → основне (expanding)."], ["right now / a billionaire / launching / is / himself / into space", "Right now a billionaire is launching himself into space.|A billionaire is launching himself into space right now.", "Підмет → is → launching → додаток. Час можна на початок або в кінець."], ["not / the Leaning Tower of Pisa / is / falling / anymore", "The Leaning Tower of Pisa is not falling anymore.", "not стоїть одразу після допоміжного is."], ["is / sinking / Venice / ?", "Is Venice sinking?", "Без питального слова питання починається з допоміжного."], ["away from the Earth / the Moon / moving / is / why / ?", "Why is the Moon moving away from the Earth?", "Питальне слово → допоміжне → підмет → основне."], ["not / I / am / making / this up", "I am not making this up.", "not — після допоміжного am, перед основним."]], "note": null, "rule": ["wo-plus", "wo-q"]}, {"kind": "negq", "instr": "Утворіть заперечення (−) і питання (?).", "items": [["The universe is expanding.", "The universe is not expanding.", "Is the universe expanding?", "not — після is; для питання is стає перед підметом."], ["Scientists are building a giant telescope in Chile.", "Scientists are not building a giant telescope in Chile.", "Are scientists building a giant telescope in Chile?", "are not / Are + підмет — допоміжне керує всім."], ["The neighbours are drilling the wall again.", "The neighbours are not drilling the wall again.", "Are the neighbours drilling the wall again?", "are not → заперечення; Are the neighbours…? → питання."], ["I am reading “1984” for the third time.", "I am not reading “1984” for the third time.", "Am I reading “1984” for the third time?", "am not / Am I…? Основне reading не змінюється."], ["Astronauts are getting taller in space.", "Astronauts are not getting taller in space.", "Are astronauts getting taller in space?", "not після are; у питанні are — на перше місце. (Спойлер: таки ростуть.)"]], "note": "not — тільки після допоміжного. Для питання допоміжне стає перед підметом.", "rule": ["wo-minus", "wo-q"]}, {"kind": "transform", "instr": "Поставте питання з питальним словом у дужках.", "items": [["Frodo is carrying the Ring to Mordor. (What…?)", "What is Frodo carrying?|What is Frodo carrying to Mordor?", "What + допоміжне is + підмет + основне."], ["Harry Potter is living under the stairs. (Where…?)", "Where is Harry Potter living?", "Where + is + підмет + living."], ["Forrest Gump is running across America because he feels like it. (Why…?)", "Why is Forrest Gump running across America?", "Why + is + підмет + running."], ["NASA is sending astronauts back to the Moon. (Where…?)", "Where is NASA sending astronauts?", "Where + is + NASA + sending."], ["The minister is promising cheaper bread again. (What…?)", "What is the minister promising again?|What is the minister promising?", "What + is + підмет + promising."], ["Barbie is driving a pink car. (What…?)", "What is Barbie driving?", "What + is + підмет + основне."]], "note": null, "rule": ["wo-q"]}, {"kind": "gap", "instr": "Знайдіть у кожному реченні допоміжне й основне дієслово.", "items": [["The Netherlands is building houses on water. → допоміжне: ___ основне: ___", ["is", "building"], "is показує час, building — сама дія."], ["Is the Leaning Tower of Pisa still leaning? → допоміжне: ___ основне: ___", ["is", "leaning"], "У питанні допоміжне на початку, але це все одно is."], ["Why are flamingos standing on one leg? → допоміжне: ___ основне: ___", ["are", "standing"], "are — допоміжне, standing — основне з -ing."], ["I am not reading the comments. → допоміжне: ___ основне: ___", ["am", "reading"], "not не дієслово: допоміжне am, основне reading."], ["What is the James Webb Telescope looking at? → допоміжне: ___ основне: ___", ["is", "looking"], "is — допоміжне, looking — основне."]], "note": null, "rule": ["wo-plus"]}], "book": [1, 2, 3]}, {"id": "present-simple", "title": "Present Simple", "guide": "4–6", "sub": "Регулярні дії, факти, розклади. І вічне питання: do чи am / is / are?", "ex": [{"kind": "gap", "instr": "Розкрийте дужки. Уважно до підмета: -s потрібне не всюди.", "items": [["A group of flamingos ___ (be) called a flamboyance.", ["is"], "a group = it → is."], ["Octopuses ___ (have) three hearts and blue blood.", ["have"], "octopuses = they → have."], ["Sherlock Holmes ___ (live) at 221B Baker Street.", ["lives"], "Sherlock Holmes = he → lives."], ["___ the Sun ___ (rise) in the west on Venus?", ["Does", "rise"], "the Sun = it → Does; основне без -s."], ["Koalas ___ (sleep) up to 20 hours a day. Goals.", ["sleep"], "koalas = they → sleep."], ["Honey ___ (not/go) bad. Ever.", ["doesn’t go"], "honey = it → doesn’t + V1."], ["The Eiffel Tower ___ (grow) about 15 cm every summer.", ["grows"], "it → grows. Метал розширюється від спеки."], ["Finland ___ (drink) more coffee per person than any other country.", ["drinks"], "Finland = it → drinks."]], "note": null, "rule": ["ps-form", "ps-use"]}, {"kind": "choice", "instr": "Дія чи стан? Оберіть правильний варіант.", "items": [["[Do|Are] some cats allergic to humans? Yes, really.", "Are", "allergic — прикметник, стан → Are."], ["Pluto [doesn’t|isn’t] a planet anymore. It’s coping.", "isn’t", "Планета — стан, дії немає → isn’t."], ["[Does|Is] the Mona Lisa have eyebrows?", "Does", "have — дієслово, it → Does."], ["[Do|Are] sloths really that slow? Painfully.", "Are", "slow — прикметник, стан → are."], ["Mr Bean [doesn’t|isn’t] talk much.", "doesn’t", "talk — дія → doesn’t."], ["The Great Wall of China [isn’t|doesn’t] visible from space with the naked eye.", "isn’t", "visible — прикметник, стан → isn’t."], ["[Are|Do] you know who wrote “Kobzar”?", "Do", "know — дієслово → Do."], ["Shrek [isn’t|doesn’t] like visitors in his swamp.", "doesn’t", "like — дієслово, he → doesn’t."], ["[Are|Do] bananas berries? (Yes. Strawberries aren’t.)", "Are", "Ягода — стан, дії немає → are."], ["Penguins [don’t|aren’t] fly.", "don’t", "fly — дія, they → don’t."]], "note": "Перевірка: «що робить?» Є відповідь-дія — do / does. Немає — am / is / are.", "rule": ["ps-be"]}, {"kind": "error", "instr": "Знайдіть і виправте помилку.", "items": [["The Earth go round the Sun.", "The Earth goes round the Sun.", "the Earth = it → go + es."], ["Does a spider has eight legs?", "Does a spider have eight legs?", "-s уже «з’їло» does, тож основне — have."], ["Koalas doesn’t drink much water.", "Koalas don’t drink much water.", "koalas = they → don’t."], ["Do the Eiffel Tower is in Paris?", "Is the Eiffel Tower in Paris?", "Дії немає — це стан, do не потрібне."], ["My boss don’t read emails. He just replies “ok”.", "My boss doesn’t read emails. He just replies “ok”.|My boss doesn’t read emails.", "my boss = he → doesn’t."], ["Water boil at 100 °C.", "Water boils at 100 °C.", "water = it → boils."], ["Harry Potter wear glasses.", "Harry Potter wears glasses.", "he → wears."]], "note": null, "rule": ["ps-form", "ps-be"]}, {"kind": "order", "instr": "Поставте прислівник частотності на своє місце.", "items": [["late / always / the White Rabbit / is", "The White Rabbit is always late.", "Після to be: is always."], ["never / Sherlock Holmes / misses / a detail", "Sherlock Holmes never misses a detail.", "Перед основним дієсловом: never misses."], ["usually / bears / sleep / in winter", "Bears usually sleep in winter.", "usually — перед основним sleep."], ["usually / politicians / promise / cheaper bread / before elections", "Politicians usually promise cheaper bread before elections.", "usually — перед основним promise."], ["do / ever / koalas / drink / water / ?", "Do koalas ever drink water?", "Do + підмет + ever + основне."], ["to the gym / go / twi ting married.", ["\\bare (getting married|marrying)\\b", "are getting married (Present Continuous)"]]], "note": null, "rule": ["pc-use"]}, {"kind": "error", "instr": "Stative verbs: знайдіть і виправте помилку.", "items": [["I am knowing who the killer is in “Knives Out”.", "I know who the killer is in “Knives Out”.", "know — stative verb, у Continuous не ставимо."], ["Gollum is wanting the Ring back.", "Gollum wants the Ring back.", "want — stative: тільки Simple."], ["This coffee is tasting like tap water.", "This coffee tastes like tap water.", "taste у значенні «бути на смак» — без -ing."], ["Are you understanding the plot of “Inception”?", "Do you understand the plot of “Inception”?", "understand — stative, тому Do you understand."], ["Scrooge McDuck is owning a huge money bin.", "Scrooge McDuck owns a huge money bin.", "own (володіти) — stative."], ["I am hating Mondays.", "I hate Mondays.", "hate — stative: I hate."]], "note": "Підглядайте в Додаток I.", "rule": ["stative-short"]}, {"kind": "choice", "instr": "Норма чи тимчасово? Present Simple чи Present Continuous.", "items": [["I [live|am living] in Kyiv. It’s my home.", "live", "Норма, постійне → Present Simple."], ["Water [is boiling|boils] at 100 °C.", "boils", "Факт → Present Simple."], ["She [is working|works] from home this month — the office is closed.", "is working", "this month, тимчасово."], ["He [is working|works] as a lawyer.", "works", "Професія — норма."], ["This year I [learn|am learning] German.", "am learning", "this year — тимчасовий період."], ["I [am living|live] with my parents until I find a flat.", "am living", "Тимчасово → Present Continuous."]], "note": null, "rule": ["pc-temp"]}], "book": [7, 8]}, {"id": "present-perfect", "title": "Present Perfect", "guide": "9–10", "sub": "Результат на полочці, досвід без дат і день, що триває.", "ex": [{"kind": "gap", "instr": "Неправильні дієслова: впишіть V2 і V3.", "items": [["steal — ___ — ___", ["stole", "stolen"], "steal — stole — stolen."], ["hide — ___ — ___", ["hid", "hidden"], "hide — hid — hidden."], ["catch — ___ — ___", ["caught", "caught"], "catch — caught — caught."], ["sell — ___ — ___", ["sold", "sold"], "sell — sold — sold."], ["win — ___ — ___", ["won", "won"], "win — won — won."], ["lose — ___ — ___", ["lost", "lost"], "lose — lost — lost."], ["forget — ___ — ___", ["forgot", "forgotten"], "forget — forgot — forgotten."], ["break — ___ — ___", ["broke", "broken"], "break — broke — broken."], ["write — ___ — ___", ["wrote", "written"], "write — wrote — written."], ["be — ___ — ___", ["was/were|was / were|was|were", "been"], "be — was / were — been."]], "note": "Таблиця неправильних дієслів — у Додатку II посібника.", "rule": ["forms"]}, {"kind": "gap", "instr": "Розкрийте дужки.", "items": [["Ukraine ___ (win) Eurovision three times.", ["has won"], "Досвід без конкретної дати → has + V3."], ["Scientists ___ (not/find) life on Mars yet.", ["haven’t found|have not found"], "yet у запереченні → haven’t + V3."], ["___ you ever ___ (read) “Harry Potter” in English?", ["Have", "read"], "ever — досвід: Have you ever + V3?"], ["Look, it ___ (just/start) snowing!", ["has just started"], "just — щойно: has just + V3."], ["People ___ (be) to the Moon, but not to Mars.", ["have been"], "Досвід людства без дати → have been."], ["I ___ (never/watch) a single episode of “Friends”.", ["have never watched"], "Досвід (точніше, його відсутність) → have never + V3."], ["Trump ___ (call) himself “a very stable genius”.", ["has called"], "Без дати, «за весь час» → has + V3."], ["J. K. Rowling ___ (sell) more than 500 million Harry Potter books.", ["has sold"], "Результат на сьогодні → has + V3."]], "note": null, "rule": ["pp-form", "pp-markers"]}, {"kind": "choice", "instr": "Present Perfect чи Past Simple?", "items": [["Scientists [haven’t solved|didn’t solve] this mystery yet.", "haven’t solved", "yet — маркер Present Perfect."], ["Oops, I [sent|have sent] the message to the wrong chat!", "have sent", "Рез onditions for an hour, and I still don’t know what I agreed to.", "have been reading", "Процес триває годину."], ["She [has written|has been writing] three books.", "has written", "Скільки зроблено (три книжки) — результат → Perfect."], ["They [have been owning|have owned] this café since 2015.", "have owned", "own — stative verb."], ["I [have been losing|have lost] my passport. The night before the flight.", "have lost", "Одна дія з результатом: паспорта немає."], ["I [have known|have been knowing] her for ten years.", "have known", "know — stative verb, тільки Perfect."]], "note": null, "rule": ["ppc-vs-pp"]}, {"kind": "transform", "instr": "Поставте питання з How long…?", "items": [["you / learn / English", "How long have you been learning English?", "How long + have + you + been + V-ing."], ["she / work / at the museum", "How long has she been working at the museum?|How long has she worked at the museum?", "she → has been working."], ["they / wait / for the train", "How long have they been waiting for the train?", "they → have been waiting."], ["the neighbours / drill / the wall", "How long have the neighbours been drilling the wall?", "the neighbours = they → have been drilling."], ["the volcano / erupt", "How long has the volcano been erupting?", "the volcano = it → has been erupting."], ["you / live / in this city", "How long have you been living in this city?|How long have you lived in this city?", "have you been living — або Perfect з live."]], "note": null, "rule": ["ppc-form"]}], "book": [11, 12]}, {"id": "past-simple", "title": "Past Simple", "guide": "13–15", "sub": "Конкретний час, послідовні дії і те, що вже не повториться.", "ex": [{"kind": "gap", "instr": "Розкрийте дужки.", "items": [["Neil Armstrong ___ (walk) on the Moon in 1969.", ["walked"], "in 1969 — конкретний час; правильне дієслово → +ed."], ["Columbus ___ (not/reach) India. He ___ (reach) America.", ["didn’t reach", "reached"], "didn’t + V1; у ствердженні — V+ed."], ["In 1932, Australia ___ (declare) war on emus. The emus ___ (win).", ["declared", "won"], "Конкретний рік → Past Simple; win — won."], ["Elon Musk ___ (buy) Twitter in 2022.", ["bought"], "in 2022 → Past Simple; buy — bought."], ["Kalush Orchestra ___ (win) Eurovision in 2022.", ["won"], "win — won; конкретний рік."], ["Where ___ archaeologists ___ (find) Tutankhamun’s tomb? In the Valley of the Kings.", ["did", "find"], "Where + did + підмет + V1."], ["In 2019, Trump ___ (offer) to buy Greenland. Denmark ___ (say) no.", ["offered", "said"], "Конкретний рік → Past Simple; say — said."], ["I ___ (wake) up, ___ (read) the news and ___ (go) back to bed.", ["woke", "read", "went"], "Послідовні дії → усі в Past Simple."], ["Why ___ The Beatles ___ (break) up?", ["did", "break"], "Why + did + підмет + V1."]], "note": null, "rule": ["pas-form", "pas-use"]}, {"kind": "error", "instr": "Знайдіть і виправте помилку.", "items": [["Leonardo da Vinci didn’t painted only the Mona Lisa.", "Leonardo da Vinci didn’t paint only the Mona Lisa.", "Після didn’t — V1."], ["Did you saw the eclipse?", "Did you see the eclipse?", "Минулий час уже в did, тож see."], ["Archaeologists finded Tutankhamun’s tomb in 1922.", "Archaeologists found Tutankhamun’s tomb in 1922.", "find — неправильне: found."], ["Napoleon wasn’t short. He were taller than the average Frenchman of his time.", "Napoleon wasn’t short. He was taller than the average Frenchman of his time.|He was taller than the average Frenchman of his time.", "he → was."], ["He has graduated from university last year.", "He graduated from university last year.", "last year — конкретний час → Past Simple."], ["When the Titanic sank?", "When did the Titanic sink?", "У питанні потрібне did, основне — V1."], ["Many fans didn’t were happy with the last season.", "Many fans weren’t happy with the last season.|Many fans were not happy with the last season.", "Зі станом to be допоміжне did не потрібне."]], "note": null, "rule": ["pas-form"]}, {"kind": "transform", "i ого моменту в минулому: had never + V3."], ["We ___ (not/eat) all day, so we ___ (order) three pizzas.", ["hadn’t eaten|had not eaten", "ordered"], "Не їли ДО того (Past Perfect), потім замовили (Past Simple)."], ["___ you ___ (read) the book before you saw the film?", ["Had", "read"], "Had + підмет + V3."], ["Columbus ___ (think) that he ___ (reach) India.", ["thought", "had reached"], "Думав — дія в минулому; «дістався» — ще раніше → had reached."], ["By the time the finale started, we ___ (eat) all the popcorn.", ["had eaten"], "By the time — до того моменту."], ["He couldn’t log in because he ___ (forget) the password.", ["had forgotten"], "Забув раніше → had forgotten."]], "note": null, "rule": ["ppf"]}, {"kind": "gap", "instr": "Що сталося раніше? Past Simple + Past Perfect.", "items": [["When I ___ (get) to the cinema, the film ___ (start), and someone ___ (take) my seat.", ["got", "had started", "had taken"], "Обидві події сталися ДО того, як я прийшла."], ["She ___ (be) nervous because she ___ (never/speak) on TV before.", ["was", "had never spoken"], "Досвіду не було до того моменту."], ["I ___ (realize) that someone ___ (steal) my identity.", ["realized|realised", "had stolen"], "Вкрали раніше, ніж я помітила."], ["After the director ___ (finish) the film, he ___ (show) it to his mom.", ["had finished|finished", "showed"], "Після after можна і Past Simple: послідовність і так зрозуміла."], ["The room ___ (look) clean — someone ___ (tidy) it.", ["looked", "had tidied"], "Прибрали до того, як ми побачили кімнату."], ["We ___ (arrive) at the station, but the train ___ (already/leave).", ["arrived", "had already left"], "Потяг поїхав раніше."]], "note": null, "rule": ["ppf", "ppf-logic"]}, {"kind": "transform", "instr": "Об’єднайте два речення за допомогою слова в дужках.", "items": [["I failed the test. I didn’t study. (because)", "I failed the test because I hadn’t studied.", "Не вчив ДО тесту → hadn’t studied."], ["The thief left the building. Then the police arrived. (by the time)", "By the time the police arrived, the thief had left the building.|The thief had left the building by the time the police arrived.", "Раніша дія — had left."], ["The Beatles broke up. Then “Let It Be” came out. (before)", "The Beatles had broken up before “Let It Be” came out.", "Розійшлися раніше → had broken up."], ["The tickets sold out. Then I opened the website. (when)", "When I opened the website, the tickets had sold out.|The tickets had sold out when I opened the website.", "Квитки скінчилися ДО того, як я відкрила сайт."]], "note": null, "rule": ["ppf"]}, {"kind": "match", "instr": "Відчуваєте логіку? З’єднайте речення з його значенням.", "items": {"left": ["When I arrived, he left.", "When I arrived, he had left.", "When she called, I was taking a shower.", "When she called, I took a shower."], "right": ["Ми не перетнулись: він пішов раніше.", "Спочатку дзвінок, потім душ.", "Ми перетнулись: він пішов, коли я прийшла.", "Дзвінок перервав тривалу дію."], "ans": {"1": "c", "2": "a", "3": "d", "4": "b"}, "why": ["Обидві дії в Past Simple — одна за одною, ми бачились.", "had left — він пішов ДО мого приходу.", "was taking — тривала дія, яку перервали.", "Дві послідовні дії в Past Simple."]}, "note": null, "rule": ["ppf-logic"]}], "book": [18]}, {"id": "past-perfect-continuous", "title": "Past Perfect Continuous", "guide": "19", "sub": "Тривала дія ДО іншого моменту в минулому.", "ex": [{"kind": "gap", "instr": "Past Perfect Continuous чи Past Simple? Розкрийте дужки.", "items": [["He ___ (cook) for two hours when I ___ (come) home.", ["had been cooking", "came"], "Готував дві години ДО (had been cooking); я прийшла — Past Simple."], ["I ___ (wait) for 40 minutes before the bus finally ___ (come).", ["had been waiting", "came"], "Чекала 40 хвилин ДО (had been waiting); приїхав — Past Simple."], ["Her eyes were red — she ___ (read) in the dark.", ["had been reading"], "Видно наслідок тривалої дії в минулому."], ["The detective ___ (not/sleep) well for weeks before he ___ (solve) the case.", ["hadn’t been sleeping|had not been sleeping", "solved"], "Тривалий стан ДО розкриття справи; розкрив — Past Simple."], ["How long ___ Howard Carter ___ (search) for the tomb before he found it?", ["had", "been searching"], "How long + had + підмет + been + V-ing."], ["The workers ___ (strike) for a month when the company finally ___ (agree).", ["had been striking", "agreed"], "Страйк тривав ДО згоди; погодилась — Past Simple."], ["The streets ___ (be) wet. It ___ (rain) all night.", ["were", "had been raining"], "Вулиці були мокрі — стан у минулому; дощ ішов ДО того цілу ніч."]], "note": null, "rule": ["ppfc"]}, {"kind": "choice", "instr": "Past Continuous чи Past Perfect Continuous?", "items": [["When I came in, the cat [had been sleeping|was sleeping] on my laptop.", "was sleeping", "Що відбувалося в момент приходу → Past Continuous."], ["By the time the minister arrived, the journalists [had been waiting|were waiting] for an hour.", "had been waiting", "By the time + for an hour → тривалість до моменту."], ["When I came in, she [was cooking|had been cooking] — she was still stirring the soup.", "was cooking", "Дія тривала саме в той момент."], ["We [had been walking|were walking] in the park when it started to rain.", "were walking", "Тривала дія, перервана раптовою подією."], ["The singer was hoarse because she [had been singing|was singing] for three hours.", "had been singing", "Тривало ДО моменту + видно наслідок."], ["At 5 pm yesterday I [had been working|was working]. Allegedly.", "was working", "Конкретний момент у минулому."]], "note": null, "rule": ["pco-types", "ppfc"]}, {"kind": "transform", "instr": "Поясніть ситуацію: що відбувалося до того? Використайте слова в дужках.", "items": [["His hands were shaking. (he / drink / coffee all night)", "He had been drinking coffee all night.", "Тремтіння — наслідок тривалої дії до того."], ["They were exhausted. (they / dance / at the festival all night)", "They had been dancing at the festival all night.", "had been + V-ing."], ["He lost his voice. (he / shout / at the match)", "He had been shouting at the match.", "Голос зник після тривалого крику."], ["The detective looked tired. (he / interrogate / suspects all day)", "He had been interrogating suspects all day.", "Цілий день — тривалість."], ["I had a headache. (I / read / the comments under my post)", "I had been reading the comments under my post.", "Класична причина головного болю."]], "note": null, "rule": ["ppfc"]}, {"kind": "choice", "instr": "Past Perfect чи Past Perfect Continuous?", "items": [["I [had been knowing|had known] him for years before he became famous.", "had known", "know — stative verb."], ["She [had written|had been writing] three angry emails by 10 am.", "had written", "Скільки зроблено (три листи) — Past Perfect."], ["The kids were noisy because they [had been playing|had played] video games all afternoon.", "had been playing", "all afternoon — тривалість."], ["By 2020, the singer [had been selling|had sold] 50 million records.", "had sold", "Кількість — результат → Past Perfect."], ["We were full because we [had been eating|had eaten] a huge pizza.", "had eaten", "Завершена дія з результатом."], ["She [had been writing|had written] emails all morning, so her eyes hurt.", "had been writing", "Як довго (all morning) — Continuous."]], "note": "Скільки зроблено (результат) — Past Perfect. Як довго тривало — Continuous.", "rule": ["ppf", "ppfc"]}], "book": [19]}, {"id": "future", "title": "Future Actions", "guide": "20–24", "sub": "Will, going to, Present Continuous — і ті, що «раз за життя».", "ex": [{"kind": "choice", "instr": "Оберіть найкращий варіант.", "items": [["I [’m meeting|’ll meet|meet] my lawyer tomorrow at 6 — it’s in my calendar.", "’m meeting", "Домовленість з часом → Present Continuous."], ["I’ve decided: I [’m going to delete|’ll delete|delete] all my social media this spring.", "’m going to delete", "Рішення вже прийняте, це намір → going to."], ["One day you [are winning|win|will win] a Grammy!", "will win", "Безпідставне передбачення → will."], ["Man, I [’m killing|’ll kill|kill] you!", "’ll kill", "Погроза → will (і ніхто нікого не вбиває)."], ["We [’re flying|fly|’ll fly] to the Eurovision final next Friday — the tickets are booked.", "’re flying", "Квитки куплені → Present Continuous."], ["Look at those clouds! It [will rain|is going to rain|rains].", "is going to rain", "Висновок на основі фактів (хмари) → going to."], ["[Will|Shall|Do] I order us a pizza?", "Shall", "Пропозиція з I → Shall."], ["Oh, it’s hot in here. I [’m going to open|’m opening|’ll open] the window.", "’ll open", "Спонтанне рішення → will."]], "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "sort", "instr": "Спонтанне рішення, план чи домовленість? Впишіть номер.", "items": {"cats": ["1 — спонтанне рішення (will)", "2 — план, намір (going to)", "3 — домовленість (Present Continuous)"], "items": [["I’m going to start a podcast this year.", 1, "Намір, який уже є."], ["We’re having a watch party on Saturday, everyone’s invited.", 2, "Усіх запросили — домовленість."], ["The phone’s ringing — I’ll get it.", 0, "Вирішили в моменті."], ["This queue is endless. I’ll order online.", 0, "Спонтанне рішення."], ["The president is visiting Kyiv next week, it’s in the official schedule.", 2, "Є в розкладі — домовленість."], ["She’s going to quit her job — she’s told everyone.", 1, "План, про який усі знають."]]}, "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "translate", "instr": "Перекладіть.", "items": [["Я тобі подзвоню пізніше.", "I’ll call you later.", "Обіцянка → will.", ["\\bwill \\w+", "will + V1"]], ["Ми збираємося переїхати в Канаду.", "We’re going to move to Canada.", "«Збираємося» → going to.", ["\\bare going to \\w+", "are going to + V1"]], ["Може, я допоможу? (shall)", "Shall I help you?|Shall I help?", "Пропозиція з I → Shall I…?", ["^shall i\\b", "Shall I …?"]], ["Завтра о десятій я йду до адвоката.", "I’m seeing my lawyer at ten tomorrow.|I’m going to my lawyer at ten tomorrow.|Tomorrow at ten I’m seeing my lawyer.", "Домовленість з часом → Present Continuous.", ["\\bam \\w+ing\\b", "am + V-ing (домовленість)"]], ["Цей рейс точно запізниться — подивись на табло!", "This flight is going to be late — look at the board!|This flight is going to be delayed — look at the board!", "Висновок на основі фактів (табло) → going to.", ["\\bis going to\\b", "is going to (висновок на основі фактів)"]], ["Я тебе приб’ю!", "I’ll kill you!", "Погроза → will.", ["\\bwill \\w+", "will + V1"]]], "note": null, "rule": ["fs", "fpc", "fgt"]}, {"kind": "choice", "instr": "Present Continuous чи going to? Домовились чи тільки вирішили?", "items": [["She [is flying|is going to fly] to Warsaw tomorrow — the tickets are in her bag.", "is flying", "Квитки вже є → домовленість."], ["I [am starting|am going to start] running. One day. Maybe on Monday.", "am going to start", "Тільки вирішила, нічого не домовлено → going to."], ["I’ve booked a table. We [are having|are going to have] dinner at 8.", "are having", "Стіл заброньовано — домовились → Present Continuous."], ["Look at those clouds! It [is going to rain|is raining].", "is going to rain", "Висновок з фактів → going to."], ["One day I [am writing|am going to write] a book.", "am going to write", "Без часу, план у голові → going to."]], "note": "Часто різниця мізерна, і носії вживають обидва. Але going to може бути без часу і для висновків з фактів.", "rule": ["pc-vs-gt", "fpc", "fgt"]}, {"kind": "gap", "instr": "Що робитиму чи що зроблю до того моменту? Future Continuous чи Future Perfect.", "items": [["This time tomorrow I ___ (fly) to Turkey.", ["will be flying"], "Що робитиму в той момент → will be + ing."], ["By the end of the year I ___ (read) 50 books.", ["will have read"], "by the end of the year — завершиться до → will have + V3."], ["Don’t call me at 5 — I ___ (sleep).", ["will be sleeping"], "Буду в процесі → will be + ing."], ["By the time you arrive, we ___ (eat) all the pizza.", ["will have eaten"], "До моменту → will have + V3."], ["At 9 pm tomorrow she ___ (watch) the final.", ["will be watching"], "at 9 pm tomorrow → Future Continuous."], ["He ___ (finish) the report by Friday.", ["will have finished"], "by Friday → Future Perfect."]], "note": null, "rule": ["fcont", "fperf"]}, {"kind": "free", "instr": "Напишіть 3 плани (going to), 2 домовленості (Present Continuous) і 1 безпідставне передбачення (will) — наприклад, хто виграє наступне Євробачення чи який фільм візьме «Оскар».", "items": [], "note": null, "rule": [], "lines": 6}], "book": [20, 21, 22, 23, 24]}, {"id": "modals", "title": "Modal Verbs", "guide": "25–26", "sub": "Можу, мушу, варто, можна: ставлення мовця до дії.", "ex": [{"kind": "choice", "instr": "Оберіть правильний варіант.", "items": [["You [mustn’t|shouldn’t] use flash in this museum. It’s forbidden.", "mustn’t", "Сувора заборона → mustn’t."], ["I [can|could] sing when I was five. Now I can’t.", "could", "Здатність у минулому → could."], ["You [might|mustn’t] wake a sleeping cat. Ever.", "mustn’t", "Сувора заборона → mustn’t."], ["You [should|might] try this café — it’s great.", "should", "Порада → should."], ["[Could|Should] you open the window, please?", "Could", "Ввічливе прохання → Could."], ["Life [must|might] exist on other planets, but there’s no proof yet.", "might", "Обережне припущення → might."], ["She sang for three hours. Her voice [must|should] be gone.", "must", "Сильне припущення, логічний висновок → must."], ["[Must|May] I ask you a personal question, Mr President?", "May", "Ввічливе прохання → May."], ["The new season [must|should] come out in May, if nothing changes.", "should", "Очікування → should."], ["Take an umbrella. It [may|must] rain later.", "may", "Можливо → may."]], "note": null, "rule": ["m-can", "m-may", "m-must"]}, {"kind": "match", "instr": "Що виражає модальне дієслово? З’єднайте.", "items": {"left": ["You can take photos here.", "This volcano could erupt at any moment.", "We could watch “Dune” tonight.", "Journalists must protect their sources.", "People should respect each other.", "You mustn’t feed the animals."], "right": ["пропозиція (suggestion)", "заборона (prohibition)", "дозвіл (permission)", "сильний обов’язок (obligation)", "можливість (possibility)", "моральний обов’язок (duty)"], "ans": {"1": "c", "2": "e", "3": "a", "4": "d", "5": "f", "6": "b"}, "why": ["can — дозвіл.", "could — можливість.", "We could… — пропозиція.", "must — сильний обов’язок.", "should — моральний обов’язок.", "mustn’t — сувора заборона."]}, "note": null, "rule": ["m-can", "m-must"]}, {"kind": "error", "instr": "Модальне + V1: без to, без -s, без do. Знайдіть і виправте помилку.", "items": [["She cans swim.", "She can swim.", "Модальне не змінюється: без -s."], ["Does she can drive?", "Can she drive?", "Питання без do: модальне вперед."], ["You must to stop.", "You must stop.", "Після модального — V1 без to."], ["He shoulds call his mom.", "He should call his mom.", "Без -s."], ["I don’t can come today.", "I can’t come today.|I cannot come today.", "Заперечення без do: can + not."], ["May I to ask a question?", "May I ask a question?", "Без to."], ["She can swims very well.", "She can swim very well.", "Після модального — V1 без -s."]], "note": null, "rule": ["m-can"]}, {"kind": "transform", "instr": "Перепишіть речення з модальним дієсловом у дужках.", "items": [["It’s possible that the singer is lip-syncing. (might)", "The singer might be lip-syncing.", "Обережне припущення → might + be."], ["I’m sure he is lying. (must)", "He must be lying.", "Впевнений висновок → must + be."], ["It’s not a good idea to argue with trolls. (shouldn’t)", "You shouldn’t argue with trolls.", "Порада → shouldn’t + V1."], ["I was able to read when I was four. (could)", "I could read when I was four.", "Здатність у минулому → could."], ["Is it OK if I record this interview? (may)", "May I record this interview?", "Формальне прохання → May I…?"], ["Smoking is not allowed here. (mustn’t)", "You mustn’t smoke here.|You must not smoke here.", "Сувора заборона → mustn’t + V1."]], "note": null, "rule": ["m-can", "m-may", "m-must"]}], "book": [25, 26]}, {"id": "conditionals", "title": "Conditionals", "guide": "27–29", "sub": "Нульовий, перший, другий, третій: від фактів до машини часу.", "ex": [{"kind": "sort", "instr": "Який це тип умовного речення? Впишіть 0, I, II або III.", "items": {"cats": ["0", "I", "II", "III"], "items": [["If politicians had to take a lie-detector test, parliament would be empty.", 2, "Уява: Past Simple + would."], ["If you heat ice, it melts.", 0, "Факт: Present + Present."], ["If it rains, the festival will move indoors.", 1, "Present + will."], ["If the crew had seen the iceberg earlier, the Titanic wouldn’t have sunk.", 3, "Past Perfect + would have V3."], ["If you mix red and white, you get pink.", 0, "Завжди так: Present + Present."], ["If I were a cat, I would sleep 16 hours a day.", 2, "Неможливо: Past Simple + would."], ["If she wins the case, she will write a book about it.", 1, "Можлива ситуація: Present + will."], ["If he had deleted the tweet, he wouldn’t have lost his job.", 3, "Минуле не змінити: Past Perfect + would have V3."]]}, "note": null, "rule": ["c0", "c1", "c2", "c3"]}, {"kind": "gap", "instr": "Нульовий і перший тип. Розкрийте дужки.", "items": [["If the film ___ (get) good reviews, I ___ (watch) it.", ["gets", "will watch"], "Ймовірна ситуація: if + Present Simple, will + V."], ["If you ___ (not/hurry), you ___ (miss) the train.", ["don’t hurry", "will miss"], "Після if — Present Simple, не will."], ["Unless it ___ (stop) raining, the match ___ (not/start).", ["stops", "won’t start|will not start"], "Unless = if not; it → stops."], ["If you ___ (heat) water to 100°C, it ___ (boil).", ["heat", "boils"], "Факт → нульовий тип."], ["I ___ (buy) you a coffee if you ___ (help) me with this essay.", ["will buy", "help"], "Умова може стояти другою, правило те саме."], ["If he ___ (be) late again, the boss ___ (fire) him.", ["is", "will fire"], "if + is, will + fire."]], "note": null, "rule": ["c0", "c1"]}, {"kind": "gap", "instr": "Другий тип. Розкрийте дужки.", "items": [["If I ___ (be) you, I ___ (call) her.", ["were", "would call"], "were — для всіх осіб; would + V1."], ["If I ___ (have) a time machine, I ___ (go) to Woodstock.", ["had", "would go"], "Нереально зараз → Past Simple + would."], ["She ___ (travel) more if she ___ (not/hate) flying.", ["would travel", "didn’t hate"], "Умова — Past Simple, наслідок — would."], ["If people ___ (sleep) eight hours a night, they ___ (be) happier.", ["slept", "would be"], "Уявна ситуація → Past Simple + would."], ["What ___ you ___ (do) if you ___ (win) the lottery?", ["would", "do", "won"], "Питання: What would you do…? Умова — won."], ["If Pluto ___ (be) still a planet, it ___ (be) the smallest one.", ["were|was", "would be"], "Past Simple + would."]], "note": "were — для всіх осіб.", "rule": ["c2"]}, {"kind": "gap", "instr": "Третій тип. Розкрийте дужки.", "items": [["If I ___ (go) to sleep earlier, I ___ (not/be) so tired yesterday.", ["had gone", "wouldn’t have been"], "Минуле: had + V3, would have + V3."], ["If the crew ___ (see) the iceberg earlier, the Titanic ___ (not/sink).", ["had seen", "wouldn’t have sunk"], "Не побачили вчасно — вже не змінити."], ["We ___ (get) tickets if we ___ (log in) on time.", ["would have got|would have gotten", "had logged in"], "would have + V3; умова — had + V3."], ["If you ___ (tell) me about the party, I ___ (come).", ["had told", "would have come"], "Шкодування про минуле."], ["If Alexander Fleming ___ (not/leave) his lab messy, he ___ (not/discover) penicillin.", ["hadn’t left", "wouldn’t have discovered"], "hadn’t + V3, wouldn’t have + V3."]], "note": null, "rule": ["c3"]}, {"kind": "transform", "instr": "Перепишіть з unless.", "items": [["If you don’t apologize, she won’t talk to you.", "Unless you apologize, she won’t talk to you.|Unless you apologise, she won’t talk to you.", "Unless = if + don’t, тому don’t зникає."], ["If it doesn’t rain, the festival will go ahead.", "Unless it rains, the festival will go ahead.", "doesn’t rain → unless it rains."], ["If he doesn’t pay his taxes, he will go to prison.", "Unless he pays his taxes, he will go to prison.", "doesn’t pay → unless he pays."], ["I won’t vote for him if he doesn’t answer the question.", "I won’t vote for him unless he answers the question.", "if he doesn’t answer → unless he answers."]], "note": "Unless = if + don’t.", "rule": ["c1"]}, {"kind": "gap", "instr": "Одне речення — чотири типи. Розкрийте дужки й відчуйте, як змінюється контекст.", "items": [["Zero: If I ___ (drink) coffee, I ___ (be) happy.", ["drink", "am"], "Так буває завжди: Present + Present. «Якщо я п’ю каву, я щаслива»."], ["First: If I ___ (drink) coffee, I ___ (be) happy.", ["drink", "will be"], "Реально: Present + will. «Якщо я вип’ю каву, я буду щаслива»."], ["Second: If I ___ (drink) coffee, I ___ (be) happy.", ["drank", "would be"], "Уява: Past Simple + would. «Якби я випила каву, я була б щаслива»."], ["Third: If I ___ (drink) coffee yesterday, I ___ (be) happy.", ["had drunk", "would have been"], "Минуле: Past Perfect + would have V3."], ["Zero: If he ___ (call) me, I ___ (answer).", ["calls", "answer"], "Завжди так: Present + Present."], ["First: If he ___ (call) me, I ___ (answer).", ["calls", "will answer"], "Реально: Present + will."], ["Second: If he ___ (call) me, I ___ (answer).", ["called", "would answer"], "Уява: Past Simple + would."], ["Third: If he ___ (call) me, I ___ (answer).", ["had called", "would have answered"], "Минуле: Past Perfect + would have V3."]], "note": "Zero і First перекладаємо через «якщо», Second і Third — через «якби».", "rule": ["c-four"]}], "book": [27, 28, 29]}, {"id": "mixed-conditionals", "title": "Mixed Conditionals", "guide": "30", "sub": "Ходіть мішать: минуле, яке впливає на «зараз», і навпаки.", "ex": [{"kind": "gap", "instr": "Розкрийте дужки.", "items": [["If I ___ (be) more organized, I ___ (not/miss) my train yesterday.", ["were", "wouldn’t have missed"], "Загальна риса (зараз) → наслідок у минулому."], ["If I ___ (make) a better resume a month ago, I ___ (have) a better job now.", ["had made", "would have"], "Дія в минулому → наслідок зараз."], ["If she ___ (not/sign) that contract in 2008, she ___ (be) free now.", ["hadn’t signed", "would be"], "Минуле рішення → теперішній стан."], ["If he ___ (speak) French, he ___ (understand) the waiter last night.", ["spoke", "would have understood"], "Загальне вміння → подія вчора."], ["If we ___ (buy) Bitcoin in 2010, we ___ (be) rich now.", ["had bought", "would be"], "in 2010 → had bought; now → would be."], ["If I ___ (not/be) so shy, I ___ (talk) to the singer after the concert.", ["weren’t", "would have talked"], "Риса характеру → упущений момент у минулому."]], "note": null, "rule": ["mixed"]}, {"kind": "match", "instr": "З’єднайте половинки.", "items": {"left": ["If I had saved money,", "If she were braver,", "If we hadn’t missed the flight,", "If he weren’t so lazy,", "If I hadn’t stayed up watching films,"], "right": ["he would have finished the project last week.", "I would have a car now.", "we would be in Rome now.", "I wouldn’t be so sleepy now.", "she would have sung at the concert yesterday."], "ans": {"1": "b", "2": "e", "3": "c", "4": "a", "5": "d"}, "why": ["Минуле → зараз (would have).", "Риса зараз → минуле (would have sung).", "Минуле → зараз (would be).", "Риса зараз → минуле (would have finished).", "Минуле → зараз (wouldn’t be)."]}, "note": null, "rule": ["mixed"]}, {"kind": "transform", "instr": "Перепишіть ситуацію як змішане умовне речення.", "items": [["I didn’t learn Spanish at school, so I can’t understand Bad Bunny now.", "If I had learned Spanish at school, I would understand Bad Bunny now.|If I had learned Spanish at school, I could understand Bad Bunny now.|If I had learnt Spanish at school, I would understand Bad Bunny now.", "Минуле → наслідок зараз: had learned + would understand."], ["She isn’t careful, so she leaked the secret last week.", "If she were careful, she wouldn’t have leaked the secret last week.", "Риса зараз → минуле: were + wouldn’t have leaked."], ["We didn’t take a map, so we are lost now.", "If we had taken a map, we wouldn’t be lost now.", "had taken + wouldn’t be."], ["I’m not rich, so I didn’t buy that Banksy.", "If I were rich, I would have bought that Banksy.", "were + would have bought."]], "note": null, "rule": ["mixed"]}, {"kind": "free", "instr": "Напишіть 3 змішані умовні речення про власне життя: рішення з минулого, яке впливає на ваше «зараз».", "items": [], "note": null, "rule": [], "lines": 3}], "book": [30]}, {"id": "indirect-speech", "title": "Indirect Speech", "guide": "31–32", "sub": "Передаємо чужі слова: все «на час назад».", "ex": [{"kind": "transform", "instr": "Перепишіть у непрямій мові.", "items": [["Trump said: “Windmills cause cancer.”", "Trump said (that) windmills caused cancer.", "Present Simple → Past Simple. Вітряки не коментують."], ["He said: “I’m working on a new album.”", "He said (that) he was working on a new album.", "Present Continuous → Past Continuous."], ["The band said: “We recorded the album in a week.”", "The band said (that) they had recorded the album in a week.", "Past Simple → Past Perfect."], ["She said: “I have done nothing wrong.”", "She said (that) she had done nothing wrong.", "Present Perfect → Past Perfect."], ["Trump said: “I will end the war in 24 hours.”", "Trump said (that) he would end the war in 24 hours.", "will → would. Минуло трохи більше ніж 24 години."], ["He said: “I was sleeping at home all night.”", "He said (that) he had been sleeping at home all night.", "Past Continuous → Past Perfect Continuous."], ["She said: “I can’t comment.”", "She said (that) she couldn’t comment.", "can → could."], ["The professor said: “The Earth goes round the Sun ge [is tasting|tastes] the soup.", "is tasting", "taste = пробувати → -ing."], ["Why [do you look|are you looking] at me like that?", "are you looking", "look = дивитися → -ing."], ["I [think|am thinking] the ending was terrible.", "think", "think = вважати → Simple."], ["She [has|is having] two Grammys.", "has", "have = мати → Simple."], ["He [is|is being] very polite today — the cameras are on.", "is being", "Поводиться не так, як завжди → is being."], ["Be quiet, I [think|am thinking] about the plot twist!", "am thinking", "think = роздумувати → можна -ing."]], "note": null, "rule": ["st-change"]}, {"kind": "gap", "instr": "Розкрийте дужки.", "items": [["I ___ (not/understand) the ending of this series.", ["don’t understand"], "understand — stative → Simple."], ["She ___ (know) the director for years.", ["has known"], "know + for years → Present Perfect, не Continuous."], ["This painting ___ (belong) to the Louvre.", ["belongs"], "belong — stative."], ["Right now I ___ (need) your help.", ["need"], "need — stative навіть з right now."], ["We ___ (have) lunch at the moment, can I call you back?", ["are having"], "have lunch — дія → можна -ing."], ["___ you ___ (believe) in conspiracy theories?", ["Do", "believe"], "believe — stative."], ["The baker ___ (weigh) the flour.", ["is weighing"], "weigh = зважувати → -ing."], ["This perfume ___ (smell) like roses.", ["smells"], "smell = пахнути → Simple."]], "note": null, "rule": ["st-list", "st-change"]}, {"kind": "sort", "instr": "Тільки Simple чи можна і в Continuous (з іншим значенням)? Впишіть номер.", "items": {"cats": ["1 — тільки Simple", "2 — можна в Continuous (інше значення)"], "items": [["feel", 1, "відчувати тактильно / почуватися."], ["have", 1, "інше значення / мати."], ["want", 0, "Mental state."], ["own", 0, "Possessions."], ["taste", 1, "пробувати / бути на смак."], ["know", 0, "Mental state."], ["see", 1, "зустрічатися / бачити."], ["belong", 0, "Possessions."], ["believe", 0, "Mental state."], ["think", 1, "роздумувати / вважати."]]}, "note": null, "rule": ["st-list", "st-change"], "compact": true}], "book": [38, 39]}];
const RULES = {"wo-plus": {"page": 1, "title": "Ствердження", "formula": "Підмет + допоміжне + основне + додаток.", "text": "Допоміжне дієслово не перекладається, але показує, в якому часі відбувається дія. Основне — перекладається і виражає саму дію.", "ex": "I am playing Minecraft."}, "wo-minus": {"page": 1, "title": "Заперечення", "formula": "Підмет + допоміжне + not + основне + додаток.", "text": "Щоб утворити заперечення, додаємо not до допоміжного.", "ex": "I am not playing Minecraft."}, "wo-q": {"page": 1, "title": "Питання", "formula": "(Питальне слово) + допоміжне + підмет + основне + додаток + ?", "text": "Щоб утворити питання, змінюємо порядок слів: допоміжне стає перед підметом.", "ex": "Am I playing…? Why am I playing Minecraft?"}, "ps-form": {"page": 4, "title": "Present Simple: будова", "formula": "do / does + V1; у ствердженні з he / she / it — V + s / es", "text": "do — для I / you / we / they, does — для he / she / it. У ствердженні допоміжне «ховається». -s стоїть тільки в одному місці: у дієслові (ствердження) або в does (заперечення, питання). Ніколи в обох.", "ex": "She works. She doesn’t work. Does she work?"}, "ps-use": {"page": 5, "title": "Present Simple: використання", "formula": "регулярні дії · загальновідомі факти · розклади і графіки", "text": "Слова-маркери: always, usually, often, sometimes, rarely, hardly ever, never; every day, every Monday, once a week, twice a month.", "ex": "The shop opens at 9."}, "ps-be": {"page": 6, "title": "Дія чи стан?", "formula": "дія → do / does · стан → am / is / are", "text": "Якщо в реченні можна знайти відповідь на питання «що робить?», використовуємо do / does. Якщо відповіді немає — теперішні форми to be.", "ex": "He drinks too much. → Does he drink…? / She is tired. → Is she tired?"}, "pc-form": {"page": 7, "title": "Present Continuous: будова", "formula": "am / is / are + V + ing", "text": "Якщо бачите в назві часу Continuous, то до основного дієслова 100% додаємо закінчення -ing.", "ex": "She is working."}, "pc-use": {"page": 7, "title": "Present Continuous: використання", "formula": "дія в даний момент · як майбутній", "text": "Як і в українському «я йду гуляти наступної суботи», час той самий, а майбутнє показують часові рамки.", "ex": "I am playing curling next weekend."}, "stative-short": {"page": 8, "title": "Stative Verbs", "formula": "дієслова, які не можна ставити в тривалі часи", "text": "know, want, like, understand, believe, own, need… Детально — в Додатку I.", "ex": "I know (не I am knowing)."}, "pp-form": {"page": 9, "title": "Present Perfect: будова", "formula": "Допоміжне: have / has. Основне: +ed / V3.", "text": "Past Participle (V3) — третій стовпчик таблиці неправильних дієслів, використовуємо для Perfect. Правильні дієслова просто отримують -ed.", "ex": "I have run a marathon."}, "pp-use": {"page": 9, "title": "Present Perfect: використання", "formula": "дія завершилась, час триває · результат у теперішньому · досвід", "text": "Тут немає чітких часових рамок. Коли відбулись усі ці події? Хтозна.", "ex": "She has seen this movie three times."}, "pp-markers": {"page": 9, "title": "Present Perfect: слова-маркери", "formula": "already · recently · yet · just · never · ever · since · for", "text": "Already — вже (для розповідних речень). Yet — вже, ще (питання і заперечення). Just — щойно. Ever — колись, коли-небудь.", "ex": "I have already cleaned my room."}, "forms": {"page": 3, "title": "Три форми дієслова", "formula": "V1 · V2 (Past Simple) · V3 (Perfect, Passive)", "text": "Правильні дієслова утворюють V2 і V3 через -ed. Неправильні треба знати — таблиця в Додатку II.", "ex": "work — worked — worked / go — went — gone"}, "pas-vs-pp": {"page": 15, "title": "Past Simple чи Present Perfect?", "formula": "точка → Past Simple · дужки → Present Perfect", "text": "Past Simple — дія в конкретний момент, який уже минув. Present Perfect — у будь-який момент періоду, який ще не закінчився. Лайфхак: є слово, яке каже «коли», — Past Simple; немає і сумніваєтесь — Present Perfect.", "ex": "I lived in Lviv in 2013. / I have changed jobs twice in the last 5 years."}, "ppc-form": {"page": 11, "title": "Present Perfect Continuous: будова", "formula": "Допоміжне: have been / has been. Основне: +ing.", "text": "Для будови ми буквально змішуємо Present Perfect (have / has і V3 — been) і Present Continuous (to be і -ing).", "ex": "She has been trying to understand grammar rules for the last 5 years."}, "ppc-use": {"page": 11, "title": "Present Perfect Continuous: використання", "formula": "дія почалась у минулому, триває досі або нещодавно закінчилась", "text": "Слова-маркери: for — протягом (якогось часу); since — з (якогось часу).", "ex": "I have been cooking all morning."}, "ppc-vs-pp": {"page": 12, "title": "Perfect чи Perfect Continuous?", "formula": "stative verbs → Perfect · наголос на тривалості → Continuous · на факті → Perfect", "text": "Через те, що ми не можемо використати know у тривалому часі, ми змушені будувати речення в Present Perfect. У решті випадків вирішує, що хочемо наголосити.", "ex": "I have known her for 10 years. / He has been living here since 2020."}, "pas-form": {"page": 13, "title": "Past Simple: будова", "formula": "did + V1; у ствердженні — V2", "text": "У ствердженні did «ховається», і дієслово стає V2 (worked, went). Після did / didn’t — тільки V1. was / were — без did.", "ex": "She went home. Did she go home? I wasn’t tired."}, "pas-use": {"page": 14, "title": "Past Simple: використання", "formula": "конкретний час («коли?») · хронологічні події · дії, що не повторяться", "text": "Слова-маркери: yesterday, two days ago, last year, in 2020, in the past.", "ex": "Her sister was born in 2008."}, "pco-form": {"page": 16, "title": "Past Continuous", "formula": "Допоміжне: was / were. Основне: +ing.", "text": "Буквально тривала дія в минулому.", "ex": "I was playing the guitar at 4 am yesterday."}, "pco-types": {"page": 17, "title": "Тривалі дії бувають різні", "formula": "1 тривала · 2 перервана раптовою дією · 3 паралельні", "text": "Тривала дія — Past Continuous. Раптова дія, яка її перериває, — Past Simple (when). Дві тривалі дії одночасно — while.", "ex": "She was watching series when her mom came back from work."}, "ppf": {"page": 18, "title": "Past Perfect", "formula": "Допоміжне: had. Основне: +ed / V3.", "text": "Дія перед іншою дією в минулому. Те, що сталося ПЕРЕД ТИМ, — Past Perfect; звичайна завершена дія в минулому — Past Simple.", "ex": "I was late because I had overslept."}, "ppf-logic": {"page": 18, "title": "Відчуваєте логіку?", "formula": "When I arrived, he left. ≠ When I arrived, he had left.", "text": "Past Perfect чітко показує, що дія передувала конкретному моменту в минулому: ми не перетнулись, він пішов до того, як я прийшла.", "ex": "When I arrived, he had left."}, "ppfc": {"page": 19, "title": "Past Perfect Continuous", "formula": "Допоміжне: had been. Основне: +ing.", "text": "Тривала дія перед іншою дією в минулому: зупиняємось у моменті й повертаємось назад, щоб розказати, що відбувалося до того.", "ex": "He had been cooking for two hours when I came home."}, "fs": {"page": 20, "title": "Future Simple", "formula": "will + V1 · shall з I / we", "text": "Спонтанні дії; погрози, обіцянки; безпідставні передбачення. Shall використовуємо з I і we, щоб щось запропонувати.", "ex": "Oh, it’s hot. I’ll open the window. / Shall I help you?"}, "fpc": {"page": 21, "title": "Present Continuous для майбутнього", "formula": "to be + V-ing + часові рамки", "text": "Домовленості та особисті плани на майбутнє: ваш френд має бути в курсі, квитки куплені.", "ex": "I’m flying to London next Monday."}, "fgt": {"page": 22, "title": "to be going to", "formula": "am / is / are + going to + V", "text": "Аналог «збиратися щось зробити»; висновки на основі фактів (темні хмари — буде дощ).", "ex": "It’s going to rain."}, "m-can": {"page": 25, "title": "Can · Could", "formula": "модальне + V1 · без to, без -s, без do", "text": "Can — можу: здатність, можливість, пропозиція, прохання, дозвіл. Could — міг / міг би: здатність у минулому, можливість, пропозиція, ввічливе прохання.", "ex": "She can swim. She can’t swim. Can she swim? / I could swim when I was five."}, "m-may": {"page": 26, "title": "May · Might", "formula": "may — можливо, можна · might — може, а може й ні", "text": "May: припущення, ввічливе прохання, формальний дозвіл. Might: обережне припущення, гіпотетичні ситуації.", "ex": "May I ask you a question? / He might know the answer."}, "m-must": {"page": 26, "title": "Must · Should", "formula": "must — мушу, обов’язково · should — варто, слід", "text": "Must: сильний обов’язок, сильне припущення, сувора заборона (mustn’t). Should: порада, моральний обов’язок, очікування.", "ex": "You mustn’t smoke here. / You should get more sleep."}, "c0": {"page": 27, "title": "Conditional 0", "formula": "if + Present Simple + Present Simple", "text": "Факти, ситуації, що відбуваються завжди. Просто запам’ятовуємо.", "ex": "If you heat ice, it melts."}, "c1": {"page": 27, "title": "First Conditional", "formula": "if + Present Simple, Future Simple", "text": "Реальні ситуації: якщо щось станеться зараз чи пізніше, наслідок буде в майбутньому. Після if — без will. Unless = if + don’t.", "ex": "If you leave now, we won’t be late."}, "c2": {"page": 28, "title": "Second Conditional", "formula": "if + Past Simple, would + V1", "text": "Уявні ситуації — неможливі або малоймовірні, «нереальне завжди». Для всіх осіб — were. Машина часу тут не допоможе.", "ex": "If I were you, I would call him."}, "c3": {"page": 29, "title": "Third Conditional", "formula": "if + Past Perfect, would have V3", "text": "Неможливі ситуації в минулому: якби тоді сталось щось інше, то й результат був би інший.", "ex": "If I had gone to sleep earlier, I wouldn’t have been so tired yesterday."}, "mixed": {"page": 30, "title": "Mixed Conditionals", "formula": "умова з одного типу + наслідок з іншого", "text": "Мікс 1: нереальне завжди → наслідок у минулому (if + Past Simple, would have V3). Мікс 2: минула умова → наслідок зараз (if + Past Perfect, would + V1).", "ex": "If I had made a better resume a month ago, I would have a better job now."}, "is-tense": {"page": 31, "title": "Непряма мова: часи", "formula": "беремо те, що в лапках, і переводимо «на час назад»", "text": "Present Simple → Past Simple; Present Continuous → Past Continuous; Past Simple і Present Perfect → Past Perfect; Past Continuous → Past Perfect Continuous; will → would. Фізичні й хімічні явища не зсуваються.", "ex": "She said (that) she was busy."}, "is-q": {"page": 31, "title": "Непряма мова: питання", "formula": "питальне слово або if · прямий порядок · «на час назад»", "text": "Питальне слово лишаємо, якщо його немає — додаємо if («чи»). do / did зникає, порядок як у звичайному реченні. Займенники міняємо за змістом.", "ex": "She asked me where the station was. / She asked if I liked her."}, "pv": {"page": 33, "title": "Passive Voice", "formula": "Об’єкт + to be (у потрібному часі) + V3 (+ by …)", "text": "Коли неважливо, невідомо або не хочемо казати, хто зробив дію. Змінюється тільки to be, V3 стоїть завжди.", "ex": "My bike was stolen. / The Mona Lisa was painted by Leonardo da Vinci."}, "art-a": {"page": 34, "title": "A (an)", "formula": "«якийсь / один» · тільки з одниною", "text": "a чи an — за звуком, не за буквою: an apple, an hour, a university. Згадуємо вперше; з професіями; замість per.", "ex": "I have a dog. / My dad is a doctor. / Once a week."}, "art-the": {"page": 34, "title": "The", "formula": "«цей, конкретний»", "text": "Згадуємо вдруге; щось унікальне; щось конкретне; прикметник → група людей (the rich); найвищий ступінь; порядкові числівники; назва виду (play the piano).", "ex": "The dog is very active. / the best, the first"}, "art-zero": {"page": 35, "title": "Без артикля", "formula": "узагальнення · most = більшість · сталі вирази", "text": "Books are expensive (усі книги в принципі). go to bed / be in bed; go to work / be at work; arrive home / be at home / stay home.", "ex": "Most shops are closed on holidays."}, "art-nat": {"page": 35, "title": "Національності", "formula": "-sh, -ch, -ese, -ss → the · інші → -s, без the", "text": "Коли говоримо про народ загалом: the English, the French, the Chinese, the Swiss; але Ukrainians, Italians, Mexicans.", "ex": "The French … / Many Italians …"}, "st-list": {"page": 38, "title": "Stative Verbs", "formula": "слова, які не можна використовувати в тривалих часах", "text": "Mental state (know, understand, believe, want, need…), emotional state (love, hate, like…), possessions (own, belong…), sense perceptions, states and conditions (seem, cost, contain…).", "ex": "I know the answer."}, "st-change": {"page": 39, "title": "Одне слово — два значення", "formula": "дія → Continuous можна · стан → не можна", "text": "У слова кілька значень. Стан — те, що просто є: думка, відчуття, властивість. Перевірка: «що робить?».", "ex": "I’m smelling the soup. / The soup smells good."}, "freq-pos": {"page": 5, "title": "Де стоять always, often, never…", "formula": "перед основним дієсловом · після am / is / are", "text": "Adverbs of frequency — перед основним дієсловом, але після am / is / are. Every day, twice a week — зазвичай у кінці речення.", "ex": "I always drink coffee. / She is always late. / I go to the gym twice a week."}, "pc-temp": {"page": 7, "title": "«Зараз» — це не тільки ця секунда", "formula": "Present Simple — норма · Present Continuous — тимчасове", "text": "«Зараз» може бути цей тиждень, цей рік чи навіть кілька років. Головне — це тимчасово, не норма.", "ex": "I live in Kyiv. / I’m living in Ireland now."}, "pco-q": {"page": 16, "title": "Що робила чи що зробила?", "formula": "що зробила? → Past Simple · що робила? → Past Continuous", "text": "Будова різна, а різниця — тільки в питанні, на яке відповідає дієслово.", "ex": "I cleaned the flat yesterday. / I was cleaning the flat at 5 pm yesterday."}, "fcont": {"page": 23, "title": "Future Continuous", "formula": "will be + V + ing", "text": "Тривала дія в майбутньому: що робитиму в певний момент. Маркери: at this time tomorrow, at 5 pm tomorrow, all day.", "ex": "I will be flying to Turkey at this time tomorrow."}, "fperf": {"page": 23, "title": "Future Perfect", "formula": "will have + V3", "text": "Дія, що завершиться до певного моменту в майбутньому. Маркери: by, till / until, before.", "ex": "I will have found a girlfriend by next year."}, "pc-vs-gt": {"page": 22, "title": "Present Continuous чи going to?", "formula": "домовились → Present Continuous · вирішили → going to", "text": "Present Continuous — вже в календарі: час, місце, інші в курсі. going to — рішення, план поки в голові; ще й для висновків з фактів і без часу.", "ex": "I’m going to the dentist tomorrow. / I’m going to go to the dentist tomorrow."}, "c-four": {"page": 29, "title": "Одне речення — чотири типи", "formula": "Zero, First — «якщо» · Second, Third — «якби»", "text": "Немає речень, які належать тільки одному типу. Те саме речення можна сказати в усіх чотирьох — зміниться контекст.", "ex": "If I drink / drank / had drunk coffee, I am / will be / would be / would have been happy."}, "is-saytell": {"page": 32, "title": "Say чи tell", "formula": "tell + кому · say + що", "text": "Після tell одразу стоїть людина, якій кажуть. Після say — самі слова; «кому» — тільки через to. Стійкі: tell a lie, the truth, a joke, a story.", "ex": "She told me she was busy. / She said (to me) she was busy."}, "pv-negq": {"page": 33, "title": "Пасив: заперечення і питання", "formula": "not — після першого допоміжного · вперед — перше допоміжне", "text": "has і been — обидва допоміжні, але not чіпляється тільки до першого. У питанні вперед виходить тільки перше.", "ex": "It hasn’t been cleaned. / Has it been cleaned?"}, "ioa-place": {"page": 36, "title": "In / On / At: місце", "formula": "in — в, всередині · on — на поверхні · at — біля, при, точка на мапі", "text": "Тут усе буквально. «На кухні» — але ж ми всередині → in the kitchen. at — у найближчій точці (at the door, at the table) або місце як точка на мапі (at home, at work). Транспорт: голова не торкається даху — on (on the bus), торкається — in (in the car).", "ex": "in Kyiv · on the wall · at the bus stop · in the photo · on the train"}, "ioa-event": {"page": 36, "title": "At the restaurant чи in the restaurant?", "formula": "at — де я і що роблю · in — саме всередині", "text": "at the cinema, at the party, at the wedding — місце події. in — коли важливо «всередині будівлі». on my birthday — коли? (день); at my birthday party — де?", "ex": "I’m at the restaurant. / Let’s wait in the restaurant, it’s raining."}, "ioa-time": {"page": 37, "title": "In / On / At: час", "formula": "at — точний час · on — дні й дати · in — довші періоди, частини дня", "text": "Мнемонічна магія: Антоніна — at, on, in від меншого до більшого: менше доби, рівно доба, більше доби. Винятки: in the morning, at night, at the weekend (брит.), at Christmas.", "ex": "at 8 · on Monday · in spring · in the evening · at night"}, "ioa-none": {"page": 37, "title": "Без прийменника", "formula": "this · next · last · every · today · tomorrow · yesterday", "text": "Перед цими словами прийменник не потрібен.", "ex": "next Monday, last year, this morning, every day"}};
