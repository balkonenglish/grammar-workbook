 font-size: 13px; color: #7A1F45; line-height: 23.2px\">?<\/span><span style=\"font-size: 16px; line-height: 1.45\"><span style=\"position: relative; display: inline-block\">Does<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> he hate me?<\/span><\/div><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center; transform: rotate(1deg)\">Якщо підмет he, she, it, то +s / es додаємо до <b>основного<\/b>, якщо це розповідне речення. До <b>допоміжного<\/b> — якщо заперечення або питання.<\/div><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\"><span style=\"color: #7A1F45\">Слова-маркери<\/span> — це слова, які позначають часові рамки і допомагають зрозуміти, який час використовувати в реченні.<\/p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Adverbs of Frequency<\/h3><div style=\"height: 8px\"><\/div><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Always<\/b> — завжди<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Usually<\/b> — зазвичай<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Often<\/b> — часто<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Sometimes<\/b> — інколи<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Rarely / Seldom<\/b> — рідко<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Hardly ever<\/b> — майже ніколи<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Never<\/b> — ніколи<\/p><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Adverbials of Frequency<\/h3><div style=\"height: 8px\"><\/div><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Every day<\/b> — кожного дня<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Every Monday<\/b> — кожного понеділка<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>On Wednesdays<\/b> — по середах<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Once a week<\/b> — раз на тиждень<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Twice a month<\/b> — двічі на місяць<\/p><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Present Simple<\/span><span>03 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 28px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 38px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Дія чи стан?<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Present Simple, продовження. Як зрозуміти, що ставити: do / does чи am / is / are.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 14px; align-items: stretch\"><div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; color: #7A1F45\">Дія<\/span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"46\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\/path><\/svg><\/div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Якщо в реченні можна знайти відповідь на питання «що робить? що роблю? що роблять? що робимо?», тоді для побудови використовуємо <b>do<\/b> або <b>does<\/b>.<\/p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: center\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 15px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg)\">— Що робить?<br>— П’є.<br>Є відповідь, значить <b>do / does<\/b>.<\/div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; justify-content: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">+<\/span><span style=\"font-size: 17px; line-height: 1.45\">He drinks too much.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">−<\/span><span style=\"font-size: 17px; line-height: 1.45\">He <span style=\"position: relative; display: inline-block\">doesn’t<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> drink too much.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">?<\/span><span style=\"font-size: 17px; line-height: 1.45\"><span style=\"position: relative; display: inline-block\">Does<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> he drink too much?<\/span><\/div><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><div style=\"display: flex; flex-direction: column; gap: 14px; align-items: stretch\"><div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; color: #7A1F45\">Стан<\/span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"46\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\/path><\/svg><\/div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Якщо в реченні немає відповіді на питання «що робить? що роблю? що роблять? що робимо?», тоді використовуємо теперішні форми дієслова <span style=\"color: #7A1F45\"><b>to be<\/b><\/span>.<\/p><div style=\"display: grid; grid-template-columns: 1fr 1fr auto; gap: 22px; align-items: center\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 15px; line-height: 1.45; text-align: left; transform: rotate(1.5deg)\">— Що робить?<br>— Є втомлена.<br>Ну такоє, тому використовуємо <b>am / is / are<\/b>.<\/div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; justify-content: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">+<\/span><span style=\"font-size: 17px; line-height: 1.45\">She <span style=\"position: relative; display: inline-block\">is<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> tired.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">−<\/span><span style=\"font-size: 17px; line-height: 1.45\">She <span style=\"position: relative; display: inline-block\">isn’t<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> tired.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">?<\/span><span style=\"font-size: 17px; line-height: 1.45\"><span style=\"position: relative; display: inline-block\">Is<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> she tired?<\/span><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><div style=\"display: grid; grid-template-columns: auto auto; gap: 14px 26px; font-size: 15px; align-items: center\"><span>I — <b>am<\/b><\/span><span><\/span><div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; line-height: 1.3\"><span>he<\/span><span>she<\/span><span>it<\/span><\/div><svg width=\"18\" height=\"54\" viewBox=\"0 0 18 54\" aria-hidden=\"true\"><path d=\"M2 2 C 10 2, 8 21.0, 9 25.0 C 10 27.0, 13 27.0, 16 27.0 C 13 27.0, 10 27.0, 9 29.0 C 8 33.0, 10 52, 2 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><\/svg><b>is<\/b><\/div><div style=\"display: flex; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; line-height: 1.3\"><span>you<\/span><span>we<\/span><span>they<\/span><\/div><svg width=\"18\" height=\"54\" viewBox=\"0 0 18 54\" aria-hidden=\"true\"><path d=\"M2 2 C 10 2, 8 21.0, 9 25.0 C 10 27.0, 13 27.0, 16 27.0 C 13 27.0, 10 27.0, 9 29.0 C 8 33.0, 10 52, 2 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><\/svg><b>are<\/b><\/div><\/div><\/div><\/div><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg); margin-top: 18px\">Перевірка проста: поставте до речення питання «що робить?». Є відповідь-дія — do / does. Немає — to be.<\/p><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Present Continuous<\/span><span>04 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Continuous<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Або Present Progressive. Теперішній Тривалий.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> to be (am / is / are)<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> +ing<\/p><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13px; line-height: 1.45; text-align: left; transform: rotate(-1deg); font-family: 'PT Serif', serif\">Якщо бачите в назві часу <b>Continuous<\/b>, то до основного дієслова 100% додаємо закінчення <b>-ing<\/b>.<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">дія, що відбувається в даний момент;<\/li><li style=\"margin: 0 0 2px\">як майбутній.<\/li><\/ol><\/div><\/div><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; justify-content: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">+<\/span><span style=\"font-size: 17px; line-height: 1.45\">My cat <span style=\"position: relative; display: inline-block\">is<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> ruin<span style=\"position: relative; display: inline-block\">ing<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> my kitchen.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">−<\/span><span style=\"font-size: 17px; line-height: 1.45\">My cat isn’t ruining my kitchen.<\/span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">?<\/span><span style=\"font-size: 17px; line-height: 1.45\">Is my cat ruining my kitchen?<\/span><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Present Continuous також можна використати як майбутній (ми робимо ідентичну штуку в українській мові):<\/p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">Я <span style=\"position: relative; display: inline-block\">йду<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> гуляти з подругою.<\/p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">В якому часі дієслово «йду» українською мовою? Правильно, в теперішньому.<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">Я <span style=\"position: relative; display: inline-block\">йду<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> гуляти з подругою <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">наступної суботи<\/span>.<\/p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">А якщо так? Дієслово залишилось у тому ж часі, ми лише додали «наступної суботи» — і за рахунок цього розуміємо, що це майбутній.<\/div><\/div><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 24px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">Англійською можна так само!<\/p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">I am playing curling.<\/p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">в даний момент.<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">I am playing curling <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">next weekend<\/span>.<\/p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">наступних вихідних — майбутній!<\/div><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: center\">Present Continuous наче легкий час, але є підводні камені у вигляді Stative Verbs… або State Verbs… або Non-continuous verbs… або Non-progressive Verbs. Але не панікуємо! Це все назви одного й того ж: дієслів, які не можна ставити в тривалі часи. <b>Їх детально поясню в Додатку I.<\/b><\/p><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Present Perfect<\/span><span>05 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><p style=\"position: absolute; left: -6px; top: 0; width: 150px; margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.05; color: #7A1F45; transform: rotate(-5deg)\">Українською виражаємо за допомогою префікса: зробив, написав, прочитав, сходив.<\/p><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Perfect<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Теперішній Доконаний.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> have / has<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> +ed / V3<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">дія завершилась, час триває;<\/li><li style=\"margin: 0 0 2px\">результат у теперішньому;<\/li><li style=\"margin: 0 0 2px\">досвід.<\/li><\/ol><\/div><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.5deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">В англійській мові є три основні форми неправильних дієслів:<\/p><ul style=\"margin: 8px 0; padding-left: 18px; font-size: 14px; line-height: 1.45\"><li><b>Base form (V1).<\/b> Перший стовпчик, найбільш базова форма.<\/li><li><b>Past Simple form (V2).<\/b> Другий стовпчик, використовуємо ТІЛЬКИ І ВИКЛЮЧНО для Past Simple. Скоро ще з ним познайомимось.<\/li><li><b>Past Participle (V3).<\/b> Третій стовпчик — оцю форму, третю, використовуємо для Perfect.<\/li><\/ul><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Для того, щоб утворити другу і третю форму з правильних дієслів, просто додаємо закінчення <b>-ed<\/b>.<\/p><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Як зрозуміти, які дієслова правильні, а які ні? Таблицю неправильних дієслів знайдете в <b>Додатку II<\/b>.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><p style=\"margin: 0 0 6px; font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">слова-маркери:<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Already<\/b> — вже (для розповідних речень)<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Recently<\/b> — нещодавно<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Yet<\/b> — вже, ще (питання і заперечення)<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Just<\/b> — щойно<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Never<\/b> — ніколи<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Ever<\/b> — колись, коли-небудь<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Since<\/b> — з (якогось часу)<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>For<\/b> — протягом (якогось часу)<\/p><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Present Perfect має очевидний результат, досягнення, яке майже можна поставити собі на полочку :)<\/p><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I have run a marathon.<\/i> Я маю марафон пробіжений (ага, отак воно звучить).<\/p><p style=\"margin: 10px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I have cleaned my room.<\/i> Я маю кімнату прибрану.<\/p><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Present Perfect<\/span><span>06 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Perfect<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Розбираємось: що б мав означати перший пункт — «дія завершилась, час триває»?<\/p><\/div><p style=\"margin: 0; font-size: 22px; line-height: 1.3; text-align: center\">I have cleaned my room <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">today<\/span>.<\/p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"66\" viewBox=\"0 0 560 66\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M150 20 C 136 30, 136 56, 150 62\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M410 20 C 424 30, 424 56, 410 62\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><circle cx=\"190\" cy=\"44\" r=\"5\" fill=\"#3A1626\"><\/circle><text x=\"176\" y=\"24\" font-family=\"Caveat, cursive\" font-size=\"19\" font-weight=\ vie three times.<\/i><i>He has heard this song.<\/i><\/div><\/div><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 24px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1.5deg); margin-top: 10px\">Але тут є ще важливий нюанс. Тут немає чітких часових рамок. Коли відбулись усі ці події? Хтозна.<\/p><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Present Perfect Continuous<\/span><span>07 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Perfect Continuous<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Або ж Present Perfect Progressive. Теперішній Доконаний Тривалий.< width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Past Perfect<\/span><span>11 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 20px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Perfect<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Минулий Доконаний.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> had<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> +ed / V3<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">дія перед іншою дією в минулому.<\/li><\/ol><\/div><\/div><p style=\"margin: 0; font-size: 21px; line-height: 1.3; text-align: center\">I was late because I <span style=\"position: relative; display: inline-block\">had overslept<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span>.<\/p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"64\" viewBox=\"0 0 560 64\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now<\/text><path d=\"M214 36 L 230 52 M 230 36 L 214 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><circle cx=\"310\" cy=\"44\" r=\"5\" fill=\"#3A1626\"><\/circle><path d=\"M310 36 C 300 4, 250 2, 228 30 M 222 20 L 227 31 L 237 26\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><div style=\"display: grid; grid-template-columns: 200px 200px; gap: 40px; justify-content: center; font-size: 14px; line-height: 1.4\"><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">Тому що ПЕРЕД ТИМ я проспав.<\/p>Past Perfect.<\/div><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Я спізнився.<\/p>Past Simple. Звичайна завершена дія в минулому.<\/div><\/div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Тут з’являється цілком логічне питання: чому я не можу сказати <i>«I was late because I overslept»<\/i>?<\/p><p style=\"margin: 0; text-align: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">МОЖЕТЕ.<\/p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">В такому випадку нахіба мені той Past Perfect?<\/p><div style=\"display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 22px; align-items: start\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><span style=\"color: #7A1F45\">Як викладач<\/span> я скажу: тут Past Perfect показує, що певна дія передувала конкретному моменту в минулому. Якщо послідовність і так зрозуміла, то цілком виправдано використати Past Simple в обидвох випадках. Але це не завжди так очевидно. Наприклад:<\/p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: center\"><i>When I arrived, he left.<\/i><\/p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Він пішов до того, як я прийшла, чи в той самий момент? Ми перетнулись чи ні? Якщо сказати:<\/p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: center\"><i>When I arrived, he had left.<\/i><\/p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">— то буде чітко зрозуміло, що ми не перетнулись: він пішов до того, як я прийшла. Відчуваєте логіку?<\/p><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><span style=\"color: #7A1F45\">Як людина, яка махала вчити більше, ніж треба<\/span>, скажу: та нінахіба.<\/p><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Він просто пригодиться вам надалі в складнішій граматиці, без якої вже тяжче добитись високого рівня.<\/p><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Past Perfect Continuous<\/span><span>12 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Perfect Continuous<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Past Perfect Progressive. Минулий Доконаний Тривалий.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> had been<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> +ing<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">тривала дія перед іншою дією в минулому.<\/li><\/ol><\/div><\/div><p style=\"margin: 0; font-size: 21px; line-height: 1.3; text-align: center\">He <span style=\"position: relative; display: inline-block\">had been cooking<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> for two hours when I <span style=\"position: relative; display: inline-block\">came<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> home.<\/p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"64\" viewBox=\"0 0 560 64\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M462 44 V 28 H 528\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\"><\/path><text x=\"476\" y=\"22\" font-family=\"PT Serif, serif\" font-size=\"13\" fill=\"#3A1626\">now<\/text><path d=\"M150 36 V 52\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><path d=\"M150 26 Q 156.0 22, 162 26 Q 168.0 30, 174 26 Q 180.0 22, 186 26 Q 192.0 30, 198 26 Q 204.0 22, 210 26 Q 216.0 30, 222 26 Q 228.0 22, 234 26 Q 240.0 30, 246 26 Q 252.0 22, 258 26 Q 264.0 30, 270 26 Q 276.0 22, 282 26 M 275 21 L 282 26 L 275 31\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><circle cx=\"300\" cy=\"44\" r=\"5\" fill=\"#3A1626\"><\/circle><\/svg><div style=\"display: grid; grid-template-columns: 220px 200px; gap: 40px; justify-content: center; font-size: 14px; line-height: 1.4\"><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">А ДО ТОГО він уже 2 години готував.<\/p>Тривала дія. Past Perfect Continuous.<\/div><div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Я прийшла.<\/p>Past Simple. Звичайна завершена дія в минулому.<\/div><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 16px 22px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Система приблизно така ж: ми можемо використати Past Continuous — тривала дія, перервана іншою дією. <b>Але!<\/b><\/p><p style=\"margin: 8px 0 0; font-size: 15px; line-height: 1.45; text-align: center\">Як у Past Perfect, так і в Past Perfect Continuous ми наче зупиняємось у моменті і повертаємось назад, щоб розказати події до того.<\/p><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Future Actions<\/span><span>13 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Future Actions<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Це набір часів і конструкцій, які прості смертні використовують замість того, щоб будувати якийсь крейзі Future Perfect Continuous. Вам пригодиться.<\/p><\/div><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; color: #7A1F45\">1.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.8px\">Future Simple<\/h2><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> will (у деяких випадках можна використовувати shall)<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> V1 (нічого не змінюємо, звичайне дієслово)<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">спонтанні дії;<\/li><li style=\"margin: 0 0 2px\">погрози, обіцянки;<\/li><li style=\"margin: 0 0 2px\">безпідставні передбачення.<\/li><\/ol><\/div><\/div><div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 26px; align-items: start\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 16px 18px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.2deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Весь цивілізований світ використовує <b>will<\/b> для утворення майбутнього. <b>Але!<\/b> <b>Shall<\/b> ми використовуємо із займенниками I і we для того, щоб щось запропонувати (або ж у формальному стилі мовлення).<\/p><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><i>Shall we go out?<br>Shall I help you?<\/i><\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 16px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>Oh, it’s hot. I’ll open the window.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Спонтанно. Подумав, що спекотно — відкрив вікно. Ви ж не планували це рік наперед, окей.<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>Man, I’ll kill you!<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">«Я тебе приб’ю!» — але ж це ну не означає, що ви зібрались когось прибивать.<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">3<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>One day you will win the lottery!<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Прям лотерею виграю? А з чого такі висновки?<\/p><\/div><\/div><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Future Actions<\/span><span>14 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 30px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; color: #7A1F45\">2.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.8px\">Present Continuous<\/h2><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><p style=\"margin: 0\"><span style=\"color: #7A1F45\">допоміжне:<\/span> to be (am / is / are)<\/p><p style=\"margin: 0\"><span style=\"color: #7A1F45\">основне:<\/span> +ing<\/p><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13px; line-height: 1.45; text-align: left; transform: rotate(-1deg); font-family: 'PT Serif', serif\">Ми вже обговорювали, як так вийшло, тому пам’ятаємо: потрібно додавати часові рамки.<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">домовленості;<\/li><li style=\"margin: 0 0 2px\">особисті плани на майбутнє.<\/li><\/ol><\/div><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>I’m meeting my friend <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">tomorrow<\/span>.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Ваш френд має бути в курсі, що ви з ним зустрічаєтесь, якщо що.<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>I’m flying to London <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">next Monday<\/span>.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Квитки куплені, валізи складені.<\/p><\/div><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; color: #7A1F45\">3.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -.8px\">to be going to<\/h2><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 14px; line-height: 1.45; text-align: left; transform: rotate(1deg); font-family: 'PT Serif', serif\">Якщо десь є <b>to be<\/b>, то його треба змінити. В даному випадку — на <b>am / is / are<\/b>.<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:<\/span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">аналог «збиратись щось зробити»;<\/li><li style=\"margin: 0 0 2px\">висновки на основі фактів.<\/li><\/ol><\/div><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>I’m going to buy some groceries.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Я збираюсь купити трохи продуктів.<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2<\/span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>It’s going to rain.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Падатиме дощ (бо ви побачили темні хмари, і вітер піднявся, і взагалі точно буде дощ).<\/p><\/div><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Modal Verbs<\/span><span>15 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Modal Verbs<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Модальні слова не описують саму дію, як-от ходити, писати, читати. Вони показують ставлення мовця до дії — необхідність, пораду, дозвіл тощо.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: center\"><div style=\"display: flex; flex-direction: column; align-items: flex-start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">1. Could<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">міг би<\/p><\/div><div style=\"display: flex; align-items: center; justify-content: center; gap: 6px\"><svg width=\"50\" height=\"14\" viewBox=\"0 0 80 14\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M78 7 C 60 5, 30 9, 4 7 M 12 2 L 3 7 L 12 12\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><div style=\"display: flex; flex-direction: column; align-items: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">Can<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">можу<\/p><\/div><svg width=\"50\" height=\"14\" viewBox=\"0 0 80 14\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 20 9, 50 5, 76 7 M 68 2 L 77 7 L 68 12\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"display: flex; flex-direction: column; align-items: flex-start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">Will be able to<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">зможу<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Past ability (здатність у минулому):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I could swim when I was five.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It could rain tonight.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Suggestion (пропозиція):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">We could go to the cinema.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Polite request (ввічливе прохання):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Could you help me?<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (ввічливий дозвіл):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Could I use your phone?<\/span><\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Ability (здатність):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I can swim.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, щось фізично може відбутись):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It can happen.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Offer (пропозиція):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I can help you.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Request (прохання):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Can you help me?<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (дозвіл):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You can leave.<\/span><\/div><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.2deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Can<\/b> не має майбутньої форми, тому використовуємо цю конструкцію для позначення здатності в майбутньому.<\/p><p style=\"margin: 8px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i>I will be able to swim next summer.<\/i><\/p><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Modal Verbs<\/span><span>16 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Modal Verbs<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження.<\/p><\/div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: center\"><div style=\"display: flex; flex-direction: column; align-items: flex-start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">2. Might<\/span><\/div><div style=\"display: flex; align-items: center; justify-content: center; gap: 6px\"><svg width=\"50\" height=\"14\" viewBox=\"0 0 80 14\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M78 7 C 60 5, 30 9, 4 7 M 12 2 L 3 7 L 12 12\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><div style=\"display: flex; flex-direction: column; align-items: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">May<\/span><\/div><svg width=\"50\" height=\"14\" viewBox=\"0 0 80 14\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 20 9, 50 5, 76 7 M 68 2 L 77 7 L 68 12\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><\/div><div style=\"display: flex; flex-direction: column; align-items: flex-start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">Не має<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">майбутньої форми<\/p><\/div><\/div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, обережне припущення):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">He might know the answer. А може і не знати.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Polite permission (ввічливий дозвіл):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">Might I ask you a question?<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Hypothetical situations (гіпотетичні ситуації):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I might buy this dress if it were cheaper.<\/span><\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 16px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Possibility (можливість, припущення, ймовірніше, ніж might):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">It may rain today.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Polite request (ввічливе прохання):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">May I ask you a question?<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Permission (дозвіл, формальніше, ніж can):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You may leave now.<\/span><\/div><\/div><div><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">3.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Must<\/h2><\/div><div style=\"display: flex; flex-direction: column; gap: 14px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Obligation (обов’язок):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">I must finish the project today.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Strong deduction (сильне припущення, логічний висновок):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">She must be tired after the night shift.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Prohibition (сувора заборона):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You mustn’t smoke here.<\/span><\/div><\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">4.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Have to<\/h2><\/div><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Також виражає обов’язок, але:<\/p><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>must<\/b> — мовець сам наголошує на необхідності;<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I must clean my room.<\/i> (Я сам вирішив.)<\/p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>have to<\/b> — необхідність зумовлена зовнішніми обставинами, правилами чи ситуацією.<\/p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I have to wear a uniform at work.<\/i><\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 24px; color: #7A1F45\">5.<\/span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.8px\">Should<\/h2><\/div><div style=\"display: flex; flex-direction: column; gap: 14px\"><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Advice / recommendation (порада, рекомендація):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">You should get more sleep.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Duty (моральний обов’язок):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">People should respect each other.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 13px; line-height: 1.35\">Expectation (очікування):<\/span><span style=\"font-size: 14.5px; font-style: italic; line-height: 1.35\">The train should arrive at 6.<\/span><\/div><\/div><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Conditionals<\/span><span>17 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Conditionals<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Умовні речення. Складаються з двох частин: умови та наслідку.<\/p><\/div><section style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 0\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">якщо<\/p><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -.6px; line-height: 1.2\"><span style=\"color: #7A1F45\">0.<\/span> if + Present Simple + Present Simple<\/h2><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg); width: 210px; box-sizing: border-box\">Так, цей просто запам’ятовуємо, це легко.<\/div><\/div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Факти, ситуації, що відбуваються завжди.<\/p><p style=\"margin: 0; font-size: 19px; line-height: 1.3; text-align: left\">If you heat ice, it melts.<\/p><p style=\"margin: 0; font-size: 19px; line-height: 1.3; text-align: left\">I don’t go to the gym if I’m tired.<\/p><\/section><div style=\"height: 1px; background: #3A1626\"><\/div><section style=\"display: flex; flex-direction: column; gap: 12px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 0\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">якщо<\/p><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -.6px; line-height: 1.2\"><span style=\"color: #7A1F45\">I.<\/span> if + Present Simple + Future Simple<\/h2><\/div><div style=\"background: #DBE1E4; border: 1px
