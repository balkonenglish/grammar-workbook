nt-size: 14.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">on the photo</span></span> → <i>in the photo</i> (на фото — це in!)</p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">in the bus</span></span> → <i>on the bus / train / plane</i>, але <i>in the car / in a taxi</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left; padding-left: 16px\">Правило-прикол: якщо в транспорті голова не торкається даху — on, якщо торкається — in.</p></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.4deg)\"><p style=\"margin: 0; font-size: 15.5px; line-height: 1.45; text-align: left\"><i>There is a cat at 10 Downing Street. Larry has lived there since 2011 and has already seen seven prime ministers.</i></p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left; color: #6b6259\">Прем’єри приходять і йдуть. Кіт — at work.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>In / On / At</span><span>37 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 34px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">In / On / At</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Тепер час: коли?</p></div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">AT</span><span style=\"font-size: 13.5px; line-height: 1.4\">точний час, момент</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at 8 o’clock</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at 7:30</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at noon</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at midnight</span></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">ON</span><span style=\"font-size: 13.5px; line-height: 1.4\">дні й дати</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on Monday</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on 5 May</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on my birthday</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on Monday morning</span></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">IN</span><span style=\"font-size: 13.5px; line-height: 1.4\">довші періоди і частини дня</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in May, in spring</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in 2026, in the 90s</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in the 21st century</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in the morning</span></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.4deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px; justify-content: center\"><b style=\"color: #7A1F45\">Мнемонічна магія: Антоніна</b></div><div style=\"margin-top: 6px\"><div style=\"display: flex; justify-content: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 46px; line-height: 1; letter-spacing: 1px\"><span style=\"color: #7A1F45\">А</span><span style=\"color: #C9C2B4\">н</span><span style=\"color: #7A1F45\">т</span><span style=\"color: #4D74A8\">он</span><span style=\"color: #3A1626\">ін</span><span style=\"color: #C9C2B4\">а</span></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; margin-top: 4px\">Від меншого до більшого — як у самому слові.</p><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: 10px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">at</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">менше 24 годин</p><span style=\"font-size: 13.5px; line-height: 1.4\"><i>at 8 — восьма триває менше за добу</i></span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">on</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">рівно 24 години</p><span style=\"font-size: 13.5px; line-height: 1.4\"><i>on Monday — понеділок триває добу</i></span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 22px\">in</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">більше 24 годин</p><span style=\"font-size: 13.5px; line-height: 1.4\"><i>in spring — весна довша за добу</i></span></div></div><div style=\"margin-top: 10px; padding-top: 8px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3); display: flex; justify-content: center\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: center\">єслі чесно, цього вистачить у 9 випадках із 10)</p></div></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><b>Але магія спрацьовує не завжди</b><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><i>in the morning / in the afternoon / in the evening</i> — коротші за добу, але in.</p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><i>at night</i> — а ніч чомусь at.</p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><i>at the weekend</i> — британська, <i>on the weekend</i> — американська.</p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><i>at Christmas</i> — свято як період, але <i>on Christmas Day</i> — конкретний день.</p></div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Без прийменника</h3><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Перед <b>this, next, last, every</b> і зі словами <b>today, tomorrow, yesterday</b> прийменник не потрібен:</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>next Monday, last year, this morning, every day, tomorrow</i></p><p style=\"margin: 2px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">on next Monday</span></span> &nbsp; <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">in this morning</span></span> &nbsp; <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">at tomorrow</span></span></p></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(0.4deg)\"><p style=\"margin: 0; font-size: 15.5px; line-height: 1.45; text-align: left\"><i>Neil Armstrong stepped onto the Moon in 1969, in July, on the 21st, at 02:56.</i></p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left; color: #6b6259\">Це за Гринвічем. У Х’юстоні тоді ще був вечір 20 липня, тож американці святкують двадцяте. Прийменники ті самі, дата інша.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Додаток I</span><span>38 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Додаток I</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Stative Verbs. Слова, які не можна використовувати в тривалих часах.</p></div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; color: #7A1F45\">1.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.8px\">Mental state</h2></div><div style=\"display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45\"><span>know — знати</span><span>realize — усвідомлювати</span><span>understand — розуміти</span><span>recognize — впізнавати</span><span>believe — вірити</span><span>suppose — припускати</span><span><span style=\"color: #7A1F45\">*think</span> — вважати</span><span>imagine — уявляти</span><span>doubt — сумніватись</span><span>remember — пам’ятати</span><span>forget — забувати</span><span>want — хотіти</span><span>need — потребувати</span><span>prefer — надавати перевагу</span><span>mean — мати на увазі</span></div></div><div style=\"display: flex; flex-direction: column; gap: 20px; align-items: stretch\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; color: #7A1F45\">2.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.8px\">Emotional state</h2></div><div style=\"display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45\"><span>love — любити</span><span>hate — ненавидіти</span><span>like — подобатись</span><span>dislike — не подобатись</span><span>appreciate — цінувати</span><span>fear — боятись</span><span>envy — заздрити</span><span>mind — бути проти</span><span>care — піклуватись</span></div></div><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; color: #7A1F45\">3.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.8px\">Possessions</h2></div><div style=\"display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45\"><span><span style=\"color: #7A1F45\">*have</span> — мати</span><span>possess — володіти</span><span>own — володіти</span><span>belong — належати</span></div></div></div><div style=\"display: flex; flex-direction: column; gap: 20px; align-items: stretch\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; color: #7A1F45\">4.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.8px\">Sense perceptions</h2></div><div style=\"display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45\"><span><span style=\"color: #7A1F45\">*taste</span> — бути на смак</span><span>hear — чути</span><span><span style=\"color: #7A1F45\">*smell</span> — пахнути</span><span><span style=\"color: #7A1F45\">*see</span> — бачити</span><span><span style=\"color: #7A1F45\">*feel</span> — відчувати</span></div></div><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: baseline; gap: 10px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 20px; color: #7A1F45\">5.</span><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 16px; letter-spacing: -.8px\">States and Conditions</h2></div><div style=\"display: flex; flex-direction: column; font-size: 13.5px; line-height: 1.45\"><span>seem — здаватись</span><span><span style=\"color: #7A1F45\">*look</span> — виглядати</span><span><span style=\"color: #7A1F45\">*appear</span> — здаватися</span><span>cost — коштувати</span><span>owe — заборгувати</span><span><span style=\"color: #7A1F45\">*weigh</span> — важити</span><span><span style=\"color: #7A1F45\">*be</span> — бути</span><span>exist — існувати</span><span>contain — вміщувати</span><span>consist of — складатись з</span><span>include — включати</span></div></div></div></div><div style=\"align-self: flex-end\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg); width: 300px; box-sizing: border-box\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 21px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">Здавалось би, все зрозуміло, да нєт.</p><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><span style=\"color: #7A1F45\"><b>*</b></span> — слова, які можна ставити в Continuous, але… вони будуть мати інше значення. Дивіться наступну сторінку.</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Додаток I</span><span>39 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 18px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Додаток I</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Дієслова, які в одному значенні можна ставити в Continuous, а в іншому — ні.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.4deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Як так вийшло</b></div><p style=\"margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">У слова є кілька значень. Якщо значення — <b>дія</b>, Continuous можна. Якщо <b>стан</b> — не можна.</p><p style=\"margin: 8px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><b>Стан</b> — це не те, що ви робите, а те, що просто є: думка, відчуття, властивість. Перевірка та сама, що на сторінці «Дія чи стан?»: спитайте «що робить?».</p><div style=\"display: grid; grid-template-columns: 1fr 1fr; column-gap: 28px; margin-top: 12px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; color: #7A1F45; border-bottom: 1px solid #3A1626; padding-bottom: 3px\">ДІЯ · CONTINUOUS МОЖНА</span><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; color: #7A1F45; border-bottom: 1px solid #3A1626; padding-bottom: 3px\">СТАН · CONTINUOUS НЕ МОЖНА</span><div style=\"padding: 6px 0\"><i style=\"font-size: 15px\">I’m smelling the soup.</i><br><span style=\"font-size: 13.5px; line-height: 1.4\">Що роблю? Нюхаю. Є дія.</span></div><div style=\"padding: 6px 0\"><i style=\"font-size: 15px\">The soup smells good.</i><br><span style=\"font-size: 13.5px; line-height: 1.4\">Що робить суп? Нічого, він просто так пахне.</span></div><div style=\"padding: 6px 0\"><i style=\"font-size: 15px\">I’m thinking about it.</i><br><span style=\"font-size: 13.5px; line-height: 1.4\">Роздумую — щось роблю.</span></div><div style=\"padding: 6px 0\"><i style=\"font-size: 15px\">I think you’re right.</i><br><span style=\"font-size: 13.5px; line-height: 1.4\">Вважаю — це моя думка, а не дія.</span></div></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 21px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">ing — можна в Continuous; закреслене ing — не можна.</p><div style=\"display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 26px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: 76px 40px minmax(0, 1fr); column-gap: 10px; row-gap: 16px; align-items: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">THINK</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 1 ght: 1.2\"><span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span> — пробувати на смак</span><span><span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span></span> — бути на смак</span></div><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">SMELL</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 12, 40 10 M 33 6 L 40 10 L 34 15 M 2 22 C 14 24, 26 32, 40 34 M 34 29 L 40 34 L 33 38\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 3px; font-size: 15px; line-height: 1.2\"><span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span> — нюхати</span><span><span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span></span> — пахнути</span></div><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">FEEL</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 12, 40 10 M 33 6 L 40 10 L 34 15 M 2 22 C 14 24, 26 32, 40 34 M 34 29 L 40 34 L 33 38\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 3px; font-size: 15px; line-height: 1.2\"><span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span> — відчувати тактильно</span><span><span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span></span> — почуватись</span></div><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">SEE</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 12, 40 10 M 33 6 L 40 10 L 34 15 M 2 22 C 14 24, 26 32, 40 34 M 34 29 L 40 34 L 33 38\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 3px; font-size: 15px; line-height: 1.2\"><span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span> — зустрічатись</span><span><span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span></span> — бачити</span></div><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">LOOK</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 12, 40 10 M 33 6 L 40 10 L 34 15 M 2 22 C 14 24, 26 32, 40 34 M 34 29 L 40 34 L 33 38\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><div style=\"display: flex; flex-direction: column; gap: 3px; font-size: 15px; line-height: 1.2\"><span><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span> — дивитись</span><span><span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 13px\">ing</span></span> — виглядати</span></div><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .02em\">APPEAR</span><svg width=\"40\" height=\"40\" viewBox=\"0 0 46 44\" aria-hidden=\"true\"><path d=\"M2 22 C 14 20, 26 12, 4 const CHECKABLE = TOPICS.reduce((n, t) => n + t.ex.filter(e => e.kind !== 'free').length, 0);
function updateProgress() {

  const ok = rs.reduce((a, r) => a + r.ok, 0), tot = rs.reduce((a, r) => a + r.total, 0);
  document.getElementById('prog-text').textContent = `Перевірено вправ: ${done} з ${CHECKABLE}` + (tot ? ` · правильно ${Math.round(ok / tot * 100)}%` : '');

let pendingPage = null;
function route() {

  if (e.key === 'Enter' && e.target.matches('input.blank, input.full')) { const card = e.target.closest('.card'); if (card) check(card.id); }
});
window.addEventListener('hashchange', () => { const p = pendingPage; route(); if (!p) window.scrollTo(0, 0); });
window.addEventListener('resize', fitPages);
route();
</script>
