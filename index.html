s: 66px 50px minmax(0, 1fr); column-gap: 10px; margin-top: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45; padding: 6px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">ZERO</span><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #4D74A8; padding: 3px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">якщо</span><div style=\"padding: 5px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><i style=\"font-size: 15.5px\">If I drink coffee, I am happy.</i><br><span style=\"font-size: 13.5px\">→ Якщо я п’ю каву, я щаслива.</span> <span style=\"font-size: 12.5px; color: #6b6259\">(так буває завжди)</span></div><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45; padding: 6px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">FIRST</span><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #4D74A8; padding: 3px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">якщо</span><div style=\"padding: 5px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><i style=\"font-size: 15.5px\">If I drink coffee, I will be happy.</i><br><span style=\"font-size: 13.5px\">→ Якщо я вип’ю каву, я буду щаслива.</span> <span style=\"font-size: 12.5px; color: #6b6259\">(реально: сьогодні ще можу випити)</span></div><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45; padding: 6px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">SECOND</span><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #4D74A8; padding: 3px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">якби</span><div style=\"padding: 5px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><i style=\"font-size: 15.5px\">If I drank coffee, I would be happy.</i><br><span style=\"font-size: 13.5px\">→ Якби я випила каву, я була б щаслива.</span> <span style=\"font-size: 12.5px; color: #6b6259\">(уява: кави немає, і не буде)</span></div><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45; padding: 6px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">THIRD</span><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 700; color: #4D74A8; padding: 3px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">якби</span><div style=\"padding: 5px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><i style=\"font-size: 15.5px\">If I had drunk coffee, I would have been happy.</i><br><span style=\"font-size: 13.5px\">→ Якби я вчора випила каву, я була б щаслива.</span> <span style=\"font-size: 12.5px; color: #6b6259\">(— Чого в тебе вчора був поганий настрій?)</span></div></div><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Zero і First — реальність, українською <b>«якщо»</b>. Second і Third — уява, українською <b>«якби»</b>.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Conditionals</span><span>30 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 20px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Mixed Conditionals</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Умовні речення. Змішані.</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Ходіть мішать.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Що це таке</b></div><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Mixed Conditional — це буквально перемішані другий і третій тип: умову беремо з одного, наслідок — з іншого. Так показуємо, як щось в одному часі впливає на інший час.</p></div><div style=\"position: relative; width: 600px; height: 92px; align-self: center; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px\"><span style=\"position: absolute; left: 0; top: 8px\"><span style=\"font-family: PT Mono, monospace; font-size: 12px; font-weight: 400; color: #7A1F45\">SECOND</span> if + Past Simple</span><span style=\"position: absolute; left: 0; top: 54px\"><span style=\"font-family: PT Mono, monospace; font-size: 12px; font-weight: 400; color: #7A1F45\">THIRD</span> if + Past Perfect</span><span style=\"position: absolute; left: 420px; top: 8px; white-space: nowrap\">would</span><span style=\"position: absolute; left: 420px; top: 54px; white-space: nowrap\">would have V3</span><svg style=\"position: absolute; left: 0; top: 0\" width=\"600\" height=\"92\" viewBox=\"0 0 600 92\" aria-hidden=\"true\"><path d=\"M286 22 C 330 36, 360 52, 404 68 M 394 62 L 405 69 L 394 75\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M286 68 C 330 54, 360 38, 404 22 M 394 16 L 405 22 L 396 30\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></div><section style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">МІКС 1 · УМОВА З ДРУГОГО, НАСЛІДОК З ТРЕТЬОГО</span></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">нереальне завжди → наслідок у минулому</p><p style=\"margin: 0; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5; text-align: center\">if + Past Simple, would have V3</p><div style=\"display: flex; justify-content: center; align-items: flex-start; gap: 14px; margin-top: 4px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 18px; line-height: 1.15; white-space: nowrap\">If I were more organized,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1; color: #4D74A8; text-align: center; white-space: nowrap\">загальна риса:<br>«якби я в принципі був<br>більш організований»</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 18px; line-height: 1.15; white-space: nowrap\">I wouldn’t have missed my train yesterday.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">«то я б не пропустив<br>свій потяг учора»</span></div></div><div style=\"display: flex; flex-direction: column; gap: 0\"><i style=\"font-size: 15.5px; line-height: 1.4\">If I weren’t so afraid of flying, I would have gone to Bali with you last summer.</i><span style=\"font-size: 13.5px; line-height: 1.4\">→ Якби я так не боялась літати (а боюсь я завжди), я б полетіла з тобою на Балі минулого літа.</span></div><div style=\"display: flex; flex-direction: column; gap: 0\"><i style=\"font-size: 15.5px; line-height: 1.4\">If I spoke Spanish, I would have got that job in Madrid.</i><span style=\"font-size: 13.5px; line-height: 1.4\">→ Якби я знала іспанську (не знаю ні тоді, ні зараз), я б отримала ту роботу в Мадриді.</span></div><div style=\"display: flex; flex-direction: column; gap: 0\"><i style=\"font-size: 15.5px; line-height: 1.4\">If I were a cat, I wouldn’t have gone to work this morning.</i><span style=\"font-size: 13.5px; line-height: 1.4\">→ Якби я була котом, я б не пішла сьогодні зранку на роботу.</span></div></section><div style=\"height: 1px; background: #3A1626\"></div><section style=\"display: flex; flex-direction: column; gap: 8px\"><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #7A1F45\">МІКС 2 · УМОВА З ТРЕТЬОГО, НАСЛІДОК З ДРУГОГО</span></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">минула умова → наслідок зараз</p><p style=\"margin: 0; font-family: 'PT Mono', monospace; font-size: 14px; line-height: 1.5; text-align: center\">if + Past Perfect, would + V1</p><div style=\"display: flex; justify-content: center; align-items: flex-start; gap: 14px; margin-top: 4px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 18px; line-height: 1.15; white-space: nowrap\">If I had made a better resume a month ago,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1; color: #4D74A8; text-align: center; white-space: nowrap\">дія в минулому</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 18px; line-height: 1.15; white-space: nowrap\">I would have a better job now.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">наслідок зараз</span></div></div><div style=\"display: flex; flex-direction: column; gap: 0\"><i style=\"font-size: 15.5px; line-height: 1.4\">If I had made a better resume a month ago, I would have a better job now.</i><span style=\"font-size: 13.5px; line-height: 1.4\">→ Якби місяць тому я зробила краще резюме, зараз у мене була б краща робота.</span></div><div style=\"display: flex; flex-direction: column; gap: 0\"><i style=\"font-size: 15.5px; line-height: 1.4\">If I had bought that lottery ticket, I would be rich now.</i><span style=\"font-size: 13.5px; line-height: 1.4\">→ Якби я купила той лотерейний квиток, я б зараз була багата.</span></div></section></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Indirect Speech</span><span>31 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 22px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Indirect Speech</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Або Reported Speech. Непряма мова. Будемо вчитись передавати чужі слова іншим людям.</p></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">Щоб утворити непряму мову, потрібно взяти те, що в лапках, і перевести «на час назад».</p><div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1.25fr); row-gap: 12px; column-gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left; color: #7A1F45\">Direct Speech</h3><span></span><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left; color: #7A1F45\">Indirect Speech</h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Present Simple</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I’m busy.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Simple</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she was busy.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Present Continuous</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I’m working.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Continuous</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she was working.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Simple</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I worked hard.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Perfect</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she had worked hard.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Present Perfect</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I have done it.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Perfect</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she had done it.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Continuous</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I was waiting.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Perfect Continuous</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she had been waiting.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Future Simple</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I’ll help you.”</span></div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Future-in-the-Past</span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she would help me.</span></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; flex-direction: column; gap: 4px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Як переказати питання: крок за кроком</h3></div><div style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; padding: 10px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .05em; color: #7A1F45\">ПИТАННЯ З ПИТАЛЬНИМ СЛОВОМ</span><i style=\"font-size: 16px\">“Where is the station?”</i><span style=\"font-size: 16px\">↓</span><i style=\"font-size: 16px\">She asked me <b style=\"color: #4D74A8\">where</b> <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">the station</span> <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">was</b>.</i></div><div style=\"display: flex; flex-direction: column; gap: 3px\"><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">1</b><span>Питальне слово лишаємо: <b>where</b>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">2</b><span>Порядок — як у звичайному реченні: <i>the station is</i>, а не <i>is the station</i>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">3</b><span>«На час назад»: <i>is → was</i>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">4</b><span>Лапки і знак питання прибираємо.</span></div></div></div><div style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; padding: 10px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .05em; color: #7A1F45\">ПИТАННЯ «ТАК / НІ»</span><i style=\"font-size: 16px\">“Do you like me?”</i><span style=\"font-size: 16px\">↓</span><i style=\"font-size: 16px\">She asked <b style=\"color: #4D74A8\">if</b> <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">I</span> <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">liked</b> her.</i></div><div style=\"display: flex; flex-direction: column; gap: 3px\"><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">1</b><span>Питального слова немає — додаємо <b>if</b> («чи»).</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">2</b><span><i>do</i> зникає, порядок звичайний: <i>I like</i>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">3</b><span>«На час назад»: <i>like → liked</i>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">4</b><span>Займенники міняємо за змістом: <i>you → I, me → her</i>.</span></div></div></div><div style=\"display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 22px; align-items: start; padding: 10px 0; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .05em; color: #7A1F45\">ПИТАННЯ З МОДАЛЬНИМ</span><i style=\"font-size: 16px\">“Can you help me?”</i><span style=\"font-size: 16px\">↓</span><i style=\"font-size: 16px\">She asked <b style=\"color: #4D74A8\">if</b> <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">I</span> <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">could</b> help her.</i></div><div style=\"display: flex; flex-direction: column; gap: 3px\"><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">1</b><span>Додаємо <b>if</b> («чи»).</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">2</b><span>Порядок звичайний: <i>I can</i>.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">3</b><span>«На час назад»: <i>can → could</i>. Таблиця модальних — на наступній сторінці.</span></div><div style=\"display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 6px; font-size: 13.5px; line-height: 1.4\"><b style=\"font-family: Unbounded, sans-serif; color: #7A1F45\">4</b><span>Займенники: <i>you → I, me → her</i>.</span></div></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Indirect Speech</span><span>32 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 26px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Indirect Speech</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження: say чи tell, модальні, слова часу і коли нічого не зсуваємо.</p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Say чи tell</h3></div><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><b>tell</b> + <b>кому</b> — одразу після tell стоїть людина, якій кажуть: <i>She told <u>me</u> (that)…</i></p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><b>say</b> + <b>що</b> — одразу йдуть самі слова. Якщо треба «кому» — тільки через to: <i>She said (that)…</i> · <i>She said <u>to me</u>…</i></p><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Не плутаємо: у <i>She says (that) <b>she</b> is busy</i> друга she — це не «кому», а початок переказаних слів. Якщо хочемо tell — обов’язково з людиною: <i>She tells <u>me</u> she is busy.</i></p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She said me</span></span> і не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She tells she is busy</span></span>.</p><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Стійкі: <i>tell a lie, tell the truth, tell a joke, tell a story</i>.</p></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Модальні</h3></div><div style=\"display: grid; grid-template-columns: 60px 40px auto; row-gap: 4px; align-items: center\"><span style=\"font-size: 15px\"><b>will</b></span><span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"30\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></span><span style=\"font-size: 15px\"><b>would</b></span><span style=\"font-size: 15px\"><b>can</b></span><span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"30\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></span><span style=\"font-size: 15px\"><b>could</b></span><span style=\"font-size: 15px\"><b>may</b></span><span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"30\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></span><span style=\"font-size: 15px\"><b>might</b></span><span style=\"font-size: 15px\"><b>must</b></span><span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"30\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></span><span style=\"font-size: 15px\"><b>had to</b></span><span style=\"font-size: 15px\"><b>shall</b></span><span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"30\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></span><span style=\"font-size: 15px\"><b>should</b></span></div><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>would, could, should, might</b> — не змінюються.</p></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Слова часу і місця</h3></div><div style=\"display: grid; grid-template-columns: 90px 20px 170px 90px 20px auto; row-gap: 2px\"><span style=\"font-size: 14.5px\">now</span><span>→</span><span style=\"font-size: 14.5px\"><b>then</b></span><span style=\"font-size: 14.5px\">today</span><span>→</span><span style=\"font-size: 14.5px\"><b>that day</b></span><span style=\"font-size: 14.5px\">tomorrow</span><span>→</span><span style=\"font-size: 14.5px\"><b>the next day</b></span><span style=\"font-size: 14.5px\">yesterday</span><span>→</span><span style=\"font-size: 14.5px\"><b>the day before</b></span><span style=\"font-size: 14.5px\">next week</span><span>→</span><span style=\"font-size: 14.5px\"><b>the following week</b></span><span style=\"font-size: 14.5px\">here</span><span>→</span><span style=\"font-size: 14.5px\"><b>there</b></span><span style=\"font-size: 14.5px\">this</span><span>→</span><span style=\"font-size: 14.5px\"><b>that</b></span></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Коли «на час назад» не потрібно</h3></div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">1. <b>say</b> стоїть у теперішньому (<b>says</b>, а не said): <i>She says she is busy.</i></p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">2. Це досі правда: <i>Anya said she lives in a new flat.</i> (вона й досі там живе)</p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">3. Загальні факти: <i>He said the Earth is round.</i></p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Passive Voice</span><span>33 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 11px; margin-top: 18px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Passive Voice</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Пасивний стан.</p></div><div style=\"display: flex; justify-content: center; align-items: baseline; gap: 6px\"><p style=\"margin: 0; font-family: 'PT Mono', monospace; font-size: 16px; line-height: 1.5; text-align: center\">Об’єкт + to be (у потрібному часі) + V3 (+ by …)</p></div><div style=\"display: flex; align-items: flex-start; justify-content: center; gap: 16px\"><div style=\"display: flex; justify-content: center; align-items: flex-start; gap: 14px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">I</span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">підмет</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">bought<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">основне</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">an apple.</span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">додаток</span></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left; margin-top: 4px\">— активний стан</p></div><div style=\"display: flex; align-items: flex-start; justify-content: center; gap: 16px\"><div style=\"display: flex; justify-content: center; align-items: flex-start; gap: 14px\"><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">An apple<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #4D74A8; text-align: center; white-space: nowrap\">додаток</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">was</span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">to be<br>в Past Simple</span></div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">bought<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">V3</span></div><div style=\"display: flex; flex-direction: column; align-items: center\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">(by me).</span></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left; margin-top: 4px\">— пасивний стан</p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.6deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Коли використовуємо</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Коли неважливо, невідомо або не хочемо казати, хто зробив дію. Нам цікаво, що сталось із предметом, а не хто це зробив.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(0.6deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Чому V3</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Підмет тут нічого не робить — дію роблять над ним. V3 працює як український дієприкметник: кімната <b>прибрана</b>, кава <b>зроблена</b> (мною).</p></div></div><div style=\"height: 1px; background: #3A1626\"></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 21px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">Змінюється тільки to be. V3 стоїть завжди.</p><div style=\"display: grid; grid-template-columns: 130px 215px minmax(0, 1fr); column-gap: 12px\"><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Present Simple</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">am / is / are + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room is cleaned every day.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Present Continuous</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">am / is / are being + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room is being cleaned.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Past Simple</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">was / were + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room was cleaned yesterday.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Past Continuous</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">was / were being + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room was being cleaned when I came.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Present Perfect</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">have / has been + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room has been cleaned.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Past Perfect</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">had been + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room had been cleaned before the guests came.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">Future Simple</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">will be + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room will be cleaned tomorrow.</span><span style=\"font-size: 14px; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">модальні</span><span style=\"font-family: 'PT Mono', monospace; font-size: 13.5px; color: #4D74A8; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">can / must / should be + V3</span><span style=\"font-size: 14.5px; font-style: italic; padding: 4px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">The room must be cleaned.</span></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Заперечення і питання</b></div><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>not</b> — тільки після <u>першого</u> допоміжного:</p><p style=\"margin: 2px 0 0; font-size: 15px; line-height: 1.45; text-align: left\">The room <b style=\"color: #4D74A8\">is</b><b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">n’t</b> cleaned.<br>It <b style=\"color: #4D74A8\">has</b><b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">n’t</b> <b style=\"color: #4D74A8\">been</b> cleaned.</p><p style=\"margin: 2px 0 0; font-size: 12.5px; line-height: 1.45; text-align: left; color: #6b6259\"><b>has</b> і <b>been</b> — обидва допоміжні, але not чіпляється тільки до першого.</p><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Питання — <u>перше</u> допоміжне виходить вперед:</p><p style=\"margin: 2px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><b style=\"color: #4D74A8\">Is</b> the room cleaned?<br><b style=\"color: #4D74A8\">Has</b> it <b style=\"color: #4D74A8\">been</b> cleaned?</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Коли by</b></div><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Коли важливо, ким зроблено: <i>The Mona Lisa was painted by Leonardo da Vinci.</i></p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Якщо невідомо, очевидно чи неважливо — by не треба: <i>My bike was stolen.</i> (ким? хтозна)</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Articles</span><span>34 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 16px; margin-top: 22px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Articles</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Артиклі.</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Коли пройдете цю тему, купіть собі чогось смачного…</p></div><div style=\"display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; align-items: center\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-2deg)\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>My girlfriend is a 10.</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Моя дівчина — 10/10.</p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>My girlfriend is 10.</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Моїй дівчині 10… років.</p></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">В англійській є два з половиною артиклі:</p><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: center\"><div><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px\">a (an)</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">неозначений артикль</p></div><div><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px\">the</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">означений артикль</p></div></div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: center\">Вони не перекладаються, але для зручності можете сприймати <b>a (an)</b> як «якийсь / один», а <b>the</b> — «цей / конкретний».</p></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.3deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Базове правило: де стоїть артикль</b></div><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Артикль стоїть <b>перед іменником</b>, а якщо є прикметник — перед прикметником: <i>a dog, a big dog, the big dog</i>.</p><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><b>a / an</b> — тільки з <b>одниною</b>: <i>a dog</i>, але <i>dogs</i> (без a). <b>the</b> — і з одниною, і з множиною: <i>the dog, the dogs</i>.</p></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">A (an)</h3><div style=\"font-size: 13.5px; line-height: 1.4; padding: 6px 10px; border-left: 3px solid #7A1F45\"><b>a чи an — за звуком, не за буквою:</b> <i>an apple, an hour</i> (h не читається), <i>a university</i> (звучить «ю»).</div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.</b> згадуємо про щось уперше:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">I have a dog.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.</b> щось, що належить до ряду таких же речей:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">I’ve bought a book. <span style=\"font-style: normal\">(книг існує багато)</span></span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">3.</b> з професіями:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">My dad is a doctor.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">4.</b> замість «per»:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">Once a week, $5 a kilo.</span></div></div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">The</h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.</b> згадуємо про щось удруге:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">The dog is very active.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.</b> щось унікальне, єдине у своєму роді:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">the Sun, the universe, the environment, the Internet</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">3.</b> коли говоримо про щось конкретне:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">We took the children to the zoo.</span></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left; padding-left: 16px\">КОНКРЕТНИХ дітей, яких ми знаємо, не робіть ваші речення creepy.</p><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">4.</b> додаємо the до прикметників, щоб утворити групу людей:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">rich — the rich <span style=\"font-style: normal\">(багатий — багаті люди)</span><br>young — the young <span style=\"font-style: normal\">(молодий — молоді люди)</span></span></div></div></div></div><p style=\"position: absolute; left: 22px; top: 118px; width: 153px; margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.05; color: #7A1F45; transform: rotate(-5deg); height: 87px\">Часто питають: «нахіба нам артиклі взагалі, от в українській їх нема». Відчуйте різницю ↓</p></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Articles</span><span>35 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 26px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Articles</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження.</p></div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">The (продовження)</h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">5.</b> з найвищим ступенем порівняння прикметників:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">the best, the most beautiful</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">6.</b> з порядковими числівниками:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">the first, the second, the third</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">7.</b> з музичними інструментами, коли говоримо про вміння грати:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">play the piano, play the guitar, play the violin</span></div><div style=\"padding-left: 16px; display: flex; flex-direction: column; gap: 6px; margin-top: 2px\"><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i>I can play <span style=\"position: relative; display: inline-block\">the<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> piano.</i> — Я вмію грати на піаніно. Мова не про конкретне піаніно, а про інструмент загалом.</p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i>I want to buy <span style=\"position: relative; display: inline-block\">a<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> piano.</i> — Я хочу купити піаніно. Тут уже предмет: одне якесь піаніно.</p></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">8.</b> коли говоримо про весь вид чи винахід загалом (так часто пишуть у новинах і книжках):</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">The tiger is in danger. <span style=\"font-style: normal\">— Тигри як вид під загрозою.</span><br>The wheel changed the world. <span style=\"font-style: normal\">— Колесо як винахід змінило світ.</span></span></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Національності</h3></div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Коли говоримо про <b>народ загалом</b>:</p><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.</b> на -sh, -ch, -ese, -ss — <b>the</b> + слово, без -s:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">the English, the French, the Chinese, the Swiss <span style=\"font-style: normal\">— англійці, французи, китайці, швейцарці як народ</span></span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.</b> усі інші — просто множина з -s, <b>без the</b>:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">Ukrainians, Italians, Mexicans <span style=\"font-style: normal\">— українці, італійці, мексиканці</span></span></div></div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Без артикля</h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.</b> узагальнення:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">Books are expensive. <span style=\"font-style: normal\">— Усі книги в принципі дорогі.</span></span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.</b> most у значенні «більшість»:</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">Most shops are closed on holidays.</span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">3.</b> go to bed / be in bed</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\"></span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">4.</b> go to work / be at work / start work / finish work</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\"></span></div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">5.</b> arrive home / be at home / stay home</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\"></span></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>In / On / At</span><span>36 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 14px; margin-top: 20px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 38px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">In / On / At</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Прийменники місця і часу. Спершу — місце: де?</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Тут, слава богу, все буквально: in — в, on — на, at — при, біля.</p></div><div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 26px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 4px; align-items: flex-start\"><svg width=\"68\" height=\"48\" viewBox=\"0 0 68 48\" style=\"display: block\"><rect x=\"14\" y=\"6\" width=\"40\" height=\"34\" rx=\"3\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\"></rect><circle cx=\"34\" cy=\"26\" r=\"6\" fill=\"#7A1F45\"></circle></svg><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">IN</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">в, всередині</p></div><span style=\"font-size: 13.5px; line-height: 1.4\">Щось усередині. Ми кажемо «<i>на</i> кухні», але ж ми всередині → <i>in the kitchen</i>. Навіть логічніше, ніж українською.</span><div style=\"display: flex; flex-direction: column; margin-top: 2px\"><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in the box</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in the car</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">in Kyiv, in Ukraine</span></div></div><div style=\"display: flex; flex-direction: column; gap: 4px; align-items: flex-start\"><svg width=\"68\" height=\"48\" viewBox=\"0 0 68 48\" style=\"display: block\"><path d=\"M6 36 H 62\" stroke=\"#3A1626\" stroke-width=\"2.4\" stroke-linecap=\"round\"></path><path d=\"M14 36 V 46 M 54 36 V 46\" stroke=\"#3A1626\" stroke-width=\"1.6\" stroke-linecap=\"round\"></path><circle cx=\"34\" cy=\"28\" r=\"6\" fill=\"#7A1F45\"></circle></svg><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">ON</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">на</p></div><span style=\"font-size: 13.5px; line-height: 1.4\">Щось на поверхні, торкається її.</span><div style=\"display: flex; flex-direction: column; margin-top: 2px\"><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on the table</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on the wall</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on the floor</span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">on the screen</span></div></div><div style=\"display: flex; flex-direction: column; gap: 4px; align-items: flex-start\"><svg width=\"68\" height=\"48\" viewBox=\"0 0 68 48\" style=\"display: block\"><rect x=\"6\" y=\"8\" width=\"30\" height=\"30\" rx=\"3\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\"></rect><path d=\"M40 23 H 47\" stroke=\"#3A1626\" stroke-width=\"1.4\" stroke-dasharray=\"2 3\"></path><circle cx=\"55\" cy=\"23\" r=\"6\" fill=\"#7A1F45\"></circle></svg><div style=\"display: flex; align-items: baseline; gap: 8px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 30px; line-height: 1\">AT</span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">біля, при</p></div><span style=\"font-size: 13.5px; line-height: 1.4\">У найближчій точці до чогось.</span><div style=\"display: flex; flex-direction: column; margin-top: 2px\"><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at the door <span style=\"font-style: normal; font-size: 13.5px\">— біля дверей</span></span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at the window <span style=\"font-style: normal; font-size: 13.5px\">— біля вікна</span></span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\">at the bus stop <span style=\"font-style: normal; font-size: 13.5px\">— біля зупинки</span></span><span style=\"font-size: 15px; font-style: italic; line-height: 1.45\"><span style=\"font-style: normal; font-size: 13px; color: #6b6259\">Стійкі вирази, місце як точка на мапі: <i>at home, at work, at school</i>.</span></span></div></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: center; transform: rotate(-1deg)\">Ми за столом. On the table? Ні, ми не лежимо на столі. In the table? Тим паче. Ми в найближчій точці до столу → We are at the table.</p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-0.8deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">At the restaurant чи in the restaurant?</b></div><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>at</b> — ресторан як точка на мапі: де ти зараз, чим зайнятий. <i>I’m at the restaurant, I’ll call you later.</i> Так само: <i>at the cinema, at the airport, at the dentist’s.</i></p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>in</b> — наголос саме на «всередині будівлі». <i>It’s raining, let’s wait in the restaurant.</i></p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left; margin-top: 4px\">Можна сказати «всередині» — in. «Там, де я зараз щось роблю» — at.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(0.8deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">On my birthday чи at my birthday?</b></div><p style=\"margin: 4px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>on my birthday</b> — <i>коли?</i> У день народження. День — це час, а з днями завжди <b>on</b> (див. наступну сторінку).</p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>at my birthday party</b> — <i>де?</i> На святкуванні. Подія як місце — <b>at</b>: <i>at the party, at the wedding, at the concert.</i></p></div></div><div style=\"display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 5px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Адреса</h3><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i><b>in</b> London</i> — місто, країна</p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i><b>on</b> Downing Street</i> — вулиця</p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><i><b>at</b> 10 Downing Street</i> — точна адреса з номером</p></div><div style=\"display: flex; flex-direction: column; gap: 5px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Не так</h3><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">in home</span></span> → <i>at home</i></p><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">at Kyiv</span></span> → <i>in Kyiv</i></p><p style=\"margin: 0; fo
