00; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Де + коли</h3></div><p style=\"margin: 0; font-size: 14.5px; line-height: 1.45; text-align: left\">Після додатка спершу <b>місце</b> (де?), потім <b>час</b> (коли?):</p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\"><i>I work <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">in Kyiv</span> <span style=\"text-decoration: underline; text-decoration-color: #4D74A8; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">every day</span>.</i></p><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\"><i>We met <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">at the café</span> <span style=\"text-decoration: underline; text-decoration-color: #4D74A8; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">yesterday</span>.</i></p></div><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Час можна винести на самий початок: <i>Yesterday we met at the café.</i></p></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: flex; align-items: center; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Питальні слова</h3></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 30px\"><span style=\"font-size: 14.5px; line-height: 1.5\"><b>What</b> — що? який?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>Who</b> — хто?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>Where</b> — де? куди?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>When</b> — коли?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>Why</b> — чому?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>How</b> — як?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>How much / How many</b> — скільки?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>Which</b> — який (з кількох)?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>Whose</b> — чий?</span><span style=\"font-size: 14.5px; line-height: 1.5\"><b>What time</b> — о котрій?</span></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Як читати формули</span><span>03 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 18px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Як читати формули</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Формула — це просто порядок місць у реченні. Ось що означають позначки.</p></div><div style=\"display: flex; align-items: center; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Позначки</h3></div><div style=\"display: grid; grid-template-columns: 110px minmax(0, 1fr); column-gap: 14px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">V</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">дієслово, яке ви обираєте самі: <i>work, love, go</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">V1</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">базова форма, як у словнику: <i>go, work</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">V2</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">друга форма — тільки для Past Simple: <i>went, worked</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">V3</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">третя форма — для Perfect і Passive: <i>gone, worked</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">V + ing</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">дієслово + закінчення -ing: <i>working</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">+s / es</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">додаємо до дієслова, коли підмет he / she / it: <i>works, watches</i>.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">допоміжне</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">службове слово, яке показує час: <i>do, am, have, will…</i> Не перекладається.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">+ − ?</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">ствердження, заперечення, питання.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">( )</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">можна поставити, а можна й ні.</span><span style=\"font-family: 'PT Mono', monospace; font-size: 15px; color: #7A1F45; padding: 3px 0\">/</span><span style=\"font-size: 14.5px; line-height: 1.45; padding: 3px 0\">або одне, або інше: <i>do / does</i>.</span></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Правильні дієслова</b> утворюють V2 і V3 однаково: + <b>-ed</b>.</p><p style=\"margin: 4px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>work — worked — worked</i></p><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><b>Неправильні</b> треба знати: <i>go — went — gone</i>. Таблиця — в Додатку II.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">Як читати: <span style=\"font-family: 'PT Mono', monospace\">does + підмет + V1 + ?</span></p><p style=\"margin: 4px 0 0; font-size: 16px; line-height: 1.45; text-align: left\">→ <i>Does she work?</i></p><p style=\"margin: 8px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><span style=\"font-family: 'PT Mono', monospace\">have / has + V3</span></p><p style=\"margin: 4px 0 0; font-size: 16px; line-height: 1.45; text-align: left\">→ <i>I have worked. She has gone.</i></p></div></div><div style=\"height: 1px; background: #3A1626\"></div><div style=\"display: flex; align-items: center; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Скорочення</h3></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px\"><span style=\"font-size: 14px; line-height: 1.55\">do not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>don’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">does not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>doesn’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">did not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>didn’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">is not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>isn’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">are not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>aren’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">was not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>wasn’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">were not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>weren’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">have not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>haven’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">has not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>hasn’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">will not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>won’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">cannot</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>can’t</b></span><span style=\"font-size: 14px; line-height: 1.55\">must not</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>mustn’t</b></span></div><div style=\"display: flex; flex-direction: column; gap: 12px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 10px\"><span style=\"font-size: 14px; line-height: 1.55\">I am</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>I’m</b></span><span style=\"font-size: 14px; line-height: 1.55\">you are</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>you’re</b></span><span style=\"font-size: 14px; line-height: 1.55\">he is / she is</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>he’s / she’s</b></span><span style=\"font-size: 14px; line-height: 1.55\">I have</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>I’ve</b></span><span style=\"font-size: 14px; line-height: 1.55\">I will</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>I’ll</b></span><span style=\"font-size: 14px; line-height: 1.55\">I would / I had</span><span style=\"font-size: 14px; line-height: 1.55\">→ <b>I’d</b></span></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><p style=\"margin: 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><i>I am not</i> скорочується тільки так: <b>I’m not</b>.</p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\"><b>’s</b> — це is або has, дивіться на наступне слово: <i>he’s working</i> (is), <i>he’s worked</i> (has).</p></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Simple</span><span>04 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Simple</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Теперішній Простий. Він, чесно кажучи, ні разу не простий, бо багато нюансів. Далі буде легше. Trust me.</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 6px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11px; letter-spacing: .06em; color: #7A1F45\">ФОРМУЛА</span></div><div style=\"display: grid; grid-template-columns: auto 18px auto 18px auto; justify-content: start; column-gap: 4px; row-gap: 6px; align-items: start\"><span style=\"justify-self: start; border: 1.5px solid #3A1626; border-radius: 6px; padding: 2px 8px; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1.35; white-space: nowrap\">підмет</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #4D74A8; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\"><b style=\"color: #4D74A8\">do / does</b></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V1</span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">у ствердженні ховається</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">без змін; з he / she / it: +s</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">She</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><span style=\"color: color-mix(in srgb, #3A1626 45%, #F6F1E3); font-style: normal\">—</span></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">s</b>.</span></div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">регулярні дії;</li><li style=\"margin: 0 0 2px\">загальновідомі факти;</li><li style=\"margin: 0 0 2px\">розклади і графіки.</li></ol></div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 16px 12px; font-size: 13.5px; line-height: 1.45; text-align: left; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор</span></div><div style=\"display: grid; grid-template-columns: 26px repeat(2, minmax(0, 1fr)); column-gap: 18px; align-items: start\"><span></span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">I / you / we / they</span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">he / she / it</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">+</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I work.<br>You love coffee.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">He work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">s</b>.<br>She love<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">s</b> coffee.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">−</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #4D74A8\">don’t</b> work.<br>You <b style=\"color: #4D74A8\">don’t</b> love coffee.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">He <b style=\"color: #4D74A8\">doesn’t</b> work.<br>She <b style=\"color: #4D74A8\">doesn’t</b> love coffee.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Do</b> I work?<br><b style=\"color: #4D74A8\">Do</b> you love coffee?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Does</b> he work?<br><b style=\"color: #4D74A8\">Does</b> she love coffee?</span></div><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.45\"><b>do</b> — для I / you / we / they. <b>does</b> — для he / she / it.</p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start\"><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.6deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Правило -s</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">З he / she / it -s стоїть тільки в одному місці:</p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">у <b>дієслові</b>, якщо це ствердження: <i>She work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">s</b>.</i></p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">у <b>does</b>, якщо заперечення чи питання: <i>She <b style=\"color: #4D74A8\">does</b>n’t work. <b style=\"color: #4D74A8\">Does</b> she work?</i></p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Ніколи в обох: <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">She doesn’t works.</span></span></p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: left\">А де ж допоміжне у ствердженні?</p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Воно <b>ховається</b>: у ствердженні do / does не пишемо.</p><p style=\"margin: 6px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><i>I work</i>, а не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">I do work</span></span>.</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left; margin-top: 6px\">Так само в Past Simple з did.</p></div></div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><div style=\"display: flex; align-items: center; gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Як пишеться -s</h3></div><div style=\"display: grid; grid-template-columns: 80px 190px minmax(0, 1fr); column-gap: 14px; row-gap: 6px; align-items: baseline\"><span style=\"font-family: 'PT Mono', monospace; font-size: 14px; color: #7A1F45\">+ s</span><span style=\"font-size: 13.5px\">більшість дієслів</span><span style=\"font-size: 14.5px; font-style: italic\">work → works, love → loves</span><span style=\"font-family: 'PT Mono', monospace; font-size: 14px; color: #7A1F45\">+ es</span><span style=\"font-size: 13.5px\">після -s, -sh, -ch, -x, -o</span><span style=\"font-size: 14.5px; font-style: italic\">watch → watches, wash → washes, go → goes</span><span style=\"font-family: 'PT Mono', monospace; font-size: 14px; color: #7A1F45\">y → ies</span><span style=\"font-size: 13.5px\">приголосна + y</span><span style=\"font-size: 14.5px; font-style: italic\">study → studies, cry → cries <span style=\"color: #6b6259\">(але play → plays)</span></span><span style=\"font-fam -size: 13.5px; line-height: 1.45; text-align: left\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Adverbs of Frequency</h3><div style=\"height: 8px\"></div><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Always</b> — завжди</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Usually</b> — зазвичай</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Often</b> — часто</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Sometimes</b> — інколи</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Rarely / Seldom</b> — рідко</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Hardly ever</b> — майже ніколи</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Never</b> — ніколи</p><div style=\"margin-top: 10px; padding-top: 8px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"font-size: 13.5px\">Де стоять</b></div><p style=\"margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Перед основним дієсловом: <i>I <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">always</span> drink coffee.</i></p><p style=\"margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Але після am / is / are: <i>She is <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">always</span> late.</i></p></div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Adverbials of Frequency</h3><div style=\"height: 8px\"></div><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Every day</b> — кожного дня</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Every Monday</b> — кожного понеділка</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>On Wednesdays</b> — по середах</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Once a week</b> — раз на тиждень</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Twice a month</b> — двічі на місяць</p><div style=\"margin-top: 10px; padding-top: 8px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"font-size: 13.5px\">Де стоять</b></div><p style=\"margin: 2px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Зазвичай у кінці речення: <i>I go to the gym <span style=\"text-decoration: underline; text-decoration-color: #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 4px\">twice a week</span>.</i></p></div></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Simple</span><span>06 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 28px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 38px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Дія чи стан?</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Present Simple, продовження. Як зрозуміти, що ставити: do / does чи am / is / are.</p></div><div style=\"display: flex; flex-direction: column; gap: 14px; align-items: stretch\"><div style=\"display: flex; align-items: center; gap: 12px\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px; color: #7A1F45\">Дія</span><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"46\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg></div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Якщо в реченні можна знайти відповідь на питання «що робить? що роблю? що роблять? що робимо?», тоді для побудови використовуємо <b>do</b> або <b>does</b>.</p><div style=\"display: grid; grid-template-columns: 250px 60px minmax(0, 1fr); gap: 14px; align-items: center\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 15px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><i>Він п’є забагато.</i></div>— Що робить?<br>— П’є.<br>Є відповідь — значить <b>do / does</b>.</div><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"56\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"></path></svg><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; justify-content: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">+</span><span style=\"font-size: 17px; line-height: 1.45\">He drinks too much.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">−</span><span style=\"font-size: 17px; line-height: 1.45\">He <span style=\"position: relative; display: inline-block\">doesn’t<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> drink too much.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 24.65px\">?</span><span style=\"font-size: 17px; line-height: 1.45\"><span style=\"position: relative; display: inline-block\">Does<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\ transform: rotate(-1deg)\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45\">PRESENT SIMPLE — НОРМА</span><p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>I live in Kyiv.</i></p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Я тут живу. Це мій дім, так і буде.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45\">PRESENT CONTINUOUS — ТИМЧАСОВЕ</span><p style=\"margin: 6px 0 0; font-size: 17px; line-height: 1.45; text-align: left\"><i>I’m living in Ireland now.</i></p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Живу в Ірландії вже 4 роки, але це не назавжди. Для мене це тимчасова ситуація.</p></div></div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Ще приклади: <i>I’m learning German this year. She’s working from home this month.</i></p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: center\"><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; color: #7A1F45\">СЛОВА-МАРКЕРИ:</span> now, right now, at the moment, today, this week, this year, these days, currently</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Continuous</span><span>08 / 41</span></div><div style=\"display: flex; flex-dir stroke\" stroke-linecap=\"round\"></path></svg></span> гуляти з подругою.</p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">В якому часі дієслово «йду» українською мовою? Правильно, в теперішньому.</div></div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">Я <span style=\"position: relative; display: inline-block\">йду<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> гуляти з подругою <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">наступної суботи</span>.</p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">А якщо так? Дієслово залишилось у тому ж часі, ми лише додали «наступної суботи» — і за рахунок цього розуміємо, що це майбутній.</div></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 24px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">Англійською можна так само!</p><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">I am playing curling.</p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">в даний момент.</div></div><div style=\"display: flex; flex-direction: column; gap: 6px; align-items: stretch\"><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: center\">I am playing curling <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">next weekend</span>.</p><div style=\"display: flex; justify-content: center\"><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: center\">наступних вихідних — майбутній!</div></div></div><div style=\"height: 1px; background: #3A1626\"></div><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">Present Continuous наче легкий час, але є підводні камені у вигляді Stative Verbs… або State Verbs… або Non-continuous verbs… або Non-progressive Verbs. Але не панікуємо! Це все назви одного й того ж: дієслів, які не можна ставити в тривалі часи. <b>Їх детально поясню в Додатку I.</b></p></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Perfect</span><span>09 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 30px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><p style=\"position: absolute; left: -6px; top: 0; width: 150px; margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.05; color: #7A1F45; transform: rotate(-5deg)\">Українською виражаємо за допомогою префікса: зробив, написав, прочитав, сходив.</p><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Perfect</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Теперішній Доконаний.</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 6px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11px; letter-spacing: .06em; color: #7A1F45\">ФОРМУЛА</span></div><div style=\"display: grid; grid-template-columns: auto 18px auto 18px auto; justify-content: start; column-gap: 4px; row-gap: 6px; align-items: start\"><span style=\"justify-self: start; border: 1.5px solid #3A1626; border-radius: 6px; padding: 2px 8px; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1.35; white-space: nowrap\">підмет</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #4D74A8; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\"><b style=\"color: #4D74A8\">have / has</b></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V3</span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">показує час</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">третя форма дієслова</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">She</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">has</b></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span></div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">дія завершилась, час триває;</li><li style=\"margin: 0 0 2px\">результат у теперішньому;</li><li style=\"margin: 0 0 2px\">досвід.</li></ol></div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 16px 12px; font-size: 13.5px; line-height: 1.45; text-align: left; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор</span></div><div style=\"display: grid; grid-template-columns: 26px repeat(2, minmax(0, 1fr)); column-gap: 18px; align-items: start\"><span></span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">I / you / we / they</span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">he / she / it</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">+</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #4D74A8\">have</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.<br>We <b style=\"color: #4D74A8\">have</b> <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">seen</b> it.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">He <b style=\"color: #4D74A8\">has</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.<br>She <b style=\"color: #4D74A8\">has</b> <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">seen</b> it.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">−</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #4D74A8\">haven’t</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">He <b style=\"color: #4D74A8\">hasn’t</b> finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Have</b> you finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Has</b> he finish<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>?</span></div><p style=\"margin: 8px 0 0; font-size: 13.5px; line-height: 1.45\"><b>have</b> — для I / you / we / they. <b>has</b> — для he / she / it. Що таке V3 — на сторінці «Як читати формули».</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 28px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><p style=\"margin: 0 0 6px; font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">слова-маркери:</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Already</b> — вже (для розповідних речень)</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Recently</b> — нещодавно</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Yet</b> — вже, ще (питання і заперечення)</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Just</b> — щойно</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Never</b> — ніколи</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Ever</b> — колись, коли-небудь</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>Since</b> — з (якогось часу)</p><p style=\"margin: 0; font-size: 14px; line-height: 1.5\"><b>For</b> — протягом (якогось часу)</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>Present Perfect — це ачівка</b></div><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\">Результат, який можна «поставити на полицю» і показати. Буквально: <b>have</b> — маю, <b>V3</b> — пробіжений, зроблений, відвіданий.</p><div style=\"display: flex; flex-direction: column; gap: 4px; margin-top: 8px\"><div style=\"display: flex; flex-direction: column; font-size: 14.5px; line-height: 1.35\"><i>I have run a marathon.</i><span style=\"font-size: 13.5px; color: #4D74A8\">→ я маю пробіжений марафон</span></div><div style=\"display: flex; flex-direction: column; font-size: 14.5px; line-height: 1.35\"><i>I have done my homework.</i><span style=\"font-size: 13.5px; color: #4D74A8\">→ я маю зроблену домашку</span></div><div style=\"display: flex; flex-direction: column; font-size: 14.5px; line-height: 1.35\"><i>I have visited Turkey.</i><span style=\"font-size: 13.5px; color: #4D74A8\">→ я маю відвідану Туреччину</span></div></div><p style=\"margin: 8px 0 0; font-size: 13px; line-height: 1.45; text-align: left; color: #6b6259\">Звісно, так ми не перекладаємо: кажемо «я пробігла марафон», «я зробила домашку», «я була в Туреччині». Буквальний переклад — тільки щоб зрозуміти логіку часу.</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Perfect</span><span>10 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 36px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Present Perfect</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Розбираємось: що б мав означати перший пункт — «дія завершилась, час триває»?</p></div><p style=\"margin: 0; font-size: 22px; line-height: 1.3; text-align: center\">I have cleaned my room <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">today</span>.</p><svg style=\"align-self: center; display: block\" width=\"560\" height=\"66\" viewBox=\"0 0 560 66\" aria-hidden=\"true\"><path d=\"M10 44 H 545 M 535 38 L 545 44 L 535 50\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M150 20 C 136 30, 136 56, 150 62\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><path d=\"M410 20 C 424 30, 424 56, 410 62\" fill=\"none\" stroke=\"#3A1626\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path><circle cx=\"190\" cy=\"44\" r=\"5\" fill=\"#3A1626\"></circle><text x=\"176\" y=\"24\" font-family=\"Caveat, cursive\" font-size=\"19\" font-weight=\"700\" fill=\"#7A1F45\">прибрав</text><text x=\"255\" y=\"24\" font-family=\"Caveat, cursive\" font-size=\"19\" font-weight=\"700\" fill=\"#4D74A8\">сьогодні</text></svg><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">1</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Уявімо, що точка — це завершена дія: прибрав. Дужки окреслюють сьогоднішній день. Дія, прибирання, вже завершилась, але це не означає, що ви прокинулись, прибрали — і все, спать. Ви прибрали і пішли далі по справах, день триває. Власне, це я і маю на увазі.</p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">2</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Це речення підпадає і під другий пункт. Я сьогодні прибрав у кімнаті — відповідно, станом на зараз кімната чиста. Чим не результат?</p></div></div><div style=\"display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1; color: #7A1F45\">3</span><div style=\"display: flex; flex-direction: column; gap: 8px\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">До третього пункту відносимо буквально будь-який досвід без конкретного часу:</p><div style=\"display: flex; flex-direction: column; gap: 2px; font-size: 17px; line-height: 1.45; padding-left: 10px\"><i>I have tried this dish.</i><i>We haven’t been to Spain.</i><i>She has seen this movie three times.</i><i>He has heard this song.</i></div></div></div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 24px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1.5deg); margin-top: 10px\">Але тут є ще важливий нюанс. Тут немає чітких часових рамок. Коли відбулись усі ці події? Хтозна.</p><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: center\">Чим Present Perfect відрізняється від Past Simple — на окремій сторінці після Past Simple.</p></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Present Perfect Continuous</span><span>11 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 18px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px v style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #7A1F45\">PRESENT PERFECT</span><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1.1; color: #4D74A8\">що зробив?</span><i style=\"font-size: 15px; line-height: 1.35\">I have cooked dinner.</i><span style=\"font-size: 13.5px; line-height: 1.35\">Вечеря готова — є результат.</span></div><div style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #7A1F45\">PRESENT PERFECT CONTINUOUS</span><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1.1; color: #4D74A8\">що робив?</span><i style=\"font-size: 15px; line-height: 1.35\">I have been cooking all morning.</i><span style=\"font-size: 13.5px; line-height: 1.35\">Процес: чим я займалась і як довго.</span></div></div></div><div style=\"display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 32px; align-items: center\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg)\"><p style=\"margin: 0 0 6px; font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">слова-маркери:</p><p style=\"margin: 0; font-size: 15px; line-height: 1.5\"><b>For</b> — протягом (якогось часу)</p><p style=\"margin: 0; font-size: 15px; line-height: 1.5\"><b>Since</b> — з (якогось часу)</p></div><p style=\"margin: 0; font-size: 17px; line-height: 1.45; text-align: left\">Як так вийшло, що слова-маркери співпадають у Present Perfect і Present Perfect Continuous? <b>Є два пояснення.</b></p></div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px; align-items: start\"><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 18px 18px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1deg)\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: center\">Stative Verbs</h3><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.45; text-align: center\">Через те, що ми не можемо використати слово <b>know</b> у тривалому часі, ми змушені будувати речення в Present Perfect.</p><p style=\"margin: 16px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><svg style=\"display: inline-block; vertical-align: -2px; margin-right: 6px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2 3 C 6 7, 10 10, 14 14 M 14 2 C 10 6, 6 10, 2 14\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" stroke-linecap=\"round\"></path></svg>I have been <span style=\"text-decoration: line-through; text-decoration-color: #7A1F45; text-decoration-thickness: 2px\">knowing</span> her for 10 years.</p><p style=\"margin: 8px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><svg style=\"display: inline-block; vertical-align: -2px; margin-right: 6px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2 9 C 4 10, 5 12, 6 14 C 8 9, 11 5, 15 2\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"2\" stroke-linecap=\"round\"></path></svg>I have <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">known</span> her for 10 years.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 18px 18px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1deg)\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.2; letter-spacing: -.5px; text-align: center\">Main focus</h3><p style=\"margin: 10px 0 0; font-size: 15px; line-height: 1.45; text-align: center\">У деяких випадках ми можемо використовувати Present Perfect і Present Perfect Continuous взаємозамінно, опираючись лише на те, що хочемо наголосити.</p><p style=\"margin: 16px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><svg style=\"display: inline-block; vertical-align: -2px; margin-right: 6px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2 9 C 4 10, 5 12, 6 14 C 8 9, 11 5, 15 2\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"2\" stroke-linecap=\"round\"></path></svg>He has been living here <span style=\"position: relative; display: inline-block\">since 2020<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span>.</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: right\">наголос на тривалості</p><p style=\"margin: 10px 0 0; font-size: 16px; line-height: 1.45; text-align: left\"><svg style=\"display: inline-block; vertical-align: -2px; margin-right: 6px\" width=\"16\" height=\"16\" viewBox=\"0 0 16 16\" aria-hidden=\"true\"><path d=\"M2 9 C 4 10, 5 12, 6 14 C 8 9, 11 5, 15 2\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"2\" stroke-linecap=\"round\"></path></svg>He <span style=\"position: relative; display: inline-block\">has lived<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> here since 2020.</p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: right\">наголос на самому факті</p></div></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Simple</span><span>13 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 26px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Simple</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Минулий Простий.</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); gap: 28px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 6px\"><div style=\"display: flex; align-items: center; gap: 6px\"><span style=\"font-family: 'PT Mono', monospace; font-size: 11px; letter-spacing: .06em; color: #7A1F45\">ФОРМУЛА</span></div><div style=\"display: grid; grid-template-columns: auto 18px auto 18px auto; justify-content: start; column-gap: 4px; row-gap: 6px; align-items: start\"><span style=\"justify-self: start; border: 1.5px solid #3A1626; border-radius: 6px; padding: 2px 8px; font-family: 'PT Mono', monospace; font-size: 13px; line-height: 1.35; white-space: nowrap\">підмет</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #4D74A8; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\"><b style=\"color: #4D74A8\">did</b></span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 14px; text-align: center\">+</span><span style=\"justify-self: start; border: 1.5px solid #7A1F45; border-radius: 6px; padding: 2px 8px; font-family: 'PT Serif', serif; font-size: 15px; line-height: 1.35; white-space: nowrap\">V2</span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #3A1626\">хто?</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #4D74A8\">допоміжне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">у ствердженні ховається</span></div><span></span><div style=\"display: flex; flex-direction: column; gap: 0\"><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 700; line-height: 1.05; color: #7A1F45\">основне</span><span style=\"font-size: 11.5px; line-height: 1.3; color: #6b6259\">друга форма; у − і ? — V1</span></div><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">She</span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><span style=\"color: color-mix(in srgb, #3A1626 45%, #F6F1E3); font-style: normal\">—</span></span><span></span><span style=\"font-size: 17px; font-style: italic; padding-top: 4px; border-top: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 14px; font-size: 13px; line-height: 1.45; text-align: left; transform: rotate(-1deg); font-family: 'PT Serif', serif\">Друга форма дієслова — тут, і тільки тут, і більше ніде в англійській. Дивимось у Додаток II.</div></div><div style=\"display: flex; flex-direction: column; gap: 4px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; line-height: 1; color: #7A1F45\">використання:</span><ol style=\"margin: 0; padding-left: 22px; font-size: 15px; line-height: 1.45\"><li style=\"margin: 0 0 2px\">конкретний час (відповідь на питання «коли?»);</li><li style=\"margin: 0 0 2px\">хронологічні події в минулому;</li><li style=\"margin: 0 0 2px\">дії, що не повторяться.</li></ol></div></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 16px 12px; font-size: 13.5px; line-height: 1.45; text-align: left; background: #F6F1E3\"><div style=\"display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px\"><span style=\"font-family: Caveat, cursive; font-size: 22px; font-weight: 700; color: #7A1F45; line-height: 1\">конструктор — однаковий для всіх осіб</span></div><div style=\"display: grid; grid-template-columns: 26px repeat(2, minmax(0, 1fr)); column-gap: 18px; align-items: start\"><span></span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">правильне дієслово</span><span style=\"font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .04em; color: #7A1F45; padding-bottom: 6px; border-bottom: 1.5px solid #3A1626\">неправильне дієслово</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">+</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.<br>She work<b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">ed</b>.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">went</b> home.<br>She <b style=\"color: #7A1F45; text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px\">went</b> home.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">−</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #4D74A8\">didn’t</b> work.</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\">I <b style=\"color: #4D74A8\">didn’t</b> go home.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 15px; color: #7A1F45; padding-top: 7px\">?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Did</b> you work?</span><span style=\"font-size: 16px; line-height: 1.35; padding: 6px 0; border-bottom: 1px dotted color-mix(in srgb, #3A1626 45%, #F6F1E3)\"><b style=\"color: #4D74A8\">Did</b> you go home?</span></div></div><div style=\"border: 2px solid #7A1F45; padding: 12px 16px; font-size: 14px; line-height: 1.45; background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); transform: rotate(-0.6deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b style=\"color: #7A1F45\">Після did / didn’t — тільки V1</b></div><p style=\"margin: 6px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\"><b style=\"color: #4D74A8\">Did</b> you <b>go</b>? — не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">Did you went?</span></span></p><p style=\"margin: 4px 0 0; font-size: 14.5px; line-height: 1.45; text-align: left\">I <b style=\"color: #4D74A8\">didn’t</b> <b>see</b> him. — не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">I didn’t saw him.</span></span></p><p style=\"margin: 6px 0 0; font-size: 13.5px; line-height: 1.45; text-align: left\">Минуле вже показує <b>did</b>, дієслову вдруге «минулити» не треба.</p></div></div></div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar</span><span>Past Simple</span><span>14 / 41</span></div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Past Simple</h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження: to be у минулому, маркери і три пояснення.</p></div><div style=\"background: color-mix(in srgb, #A9C2E6 35%, #F6F1E3); border: 1px solid #3A1626; padding: 12px 16px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(0.8deg)\"><div style=\"display: flex; align-items: baseline; gap: 6px\"><b>to be у минулому: was / were — без did</b></div><div style=\"display: grid; grid-template-columns: 26px repeat(2, minmax(0, 1fr)); column-gap: 18px; align- ft\">Не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">Did you be tired?</span></span> і не <span style=\"white-space: nowrap\"><span style=\"color: #7A1F45; font-weight: 700; font-style: normal\">✗</span> <span style=\"text-decoration: line-through; text-decoration-color: #6b6259; text-decoration-thickness: 1px; color: #6b6259\">I didn’t be</span></span>.</p></div><div style=\"display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><div style=\"display: grid; grid-template-columns: 16px auto; column-gap: 8px; justify-content: center\"><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 21.75px\">+</span><span style=\"font-size: 15px; line-height: 1.45\">I <span style=\"position: relative; display: inline-block\">posted<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"></path></svg></span> this cringe story 2 years ago.</span><span style=\"font-family: Unbounded, sans-serif; font-weight: 700; font-size: 13px; color: #7A1F45; line-height: 21.75px\">−</span><span style=\"font-size: 15px; line-height: 1.45\">I <span style=\"position: relative; display: inline-block\">didn’t<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow:
