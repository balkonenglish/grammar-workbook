 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> study hard, she won’t go to the concert.<\/span><span><span style=\"position: relative; display: inline-block\">Unless<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> she studies hard, she won’t go to the concert.<\/span><\/div><\/div><\/section><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Conditionals<\/span><span>18 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 20px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Conditionals<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження: другий і третій тип.<\/p><\/div><section style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 0\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">якби … б<\/p><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -.6px; line-height: 1.2\"><span style=\"color: #7A1F45\">II.<\/span> if + Past Simple + would<\/h2><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(1.5deg); width: 210px; box-sizing: border-box\">А тепер включаємо логіку і замість запам’ятовування будемо будувати. Щоб утворити умовне речення другого типу, потрібно будову першого переробити в минулий час:<br><br>Present Simple → Past Simple<br>will → would<br><br>Так, <b>would<\/b> — це минула форма will.<\/div><\/div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Неможливі / малоймовірні ситуації в теперішньому чи майбутньому.<\/p><p style=\"margin: 0; font-size: 21px; line-height: 1.3; text-align: left\">If I <span style=\"position: relative; display: inline-block\">were<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> you, I would call him.<\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">а ще тут забуваємо про was і для всіх осіб використовуємо were.<\/p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Якби я була тобою, я б йому подзвонила.<\/p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><span style=\"color: #555\">(Уявіть, що ви маєте машину часу. От дії в умовному реченні другого типу не можуть відбутись, навіть якщо ви повернетесь у минуле чи почапаєте в майбутнє. Якби я була тобою, я б йому подзвонила. Але я не можу бути тобою, і ніяка машина часу мене тут не врятує.)<\/span><\/p><\/section><div style=\"height: 1px; background: #3A1626\"><\/div><section style=\"display: flex; flex-direction: column; gap: 10px\"><div style=\"display: flex; justify-content: space-between; align-items: center; gap: 18px\"><div style=\"display: flex; flex-direction: column; gap: 0\"><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 17px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">якби<\/p><h2 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -.6px; line-height: 1.2\"><span style=\"color: #7A1F45\">III.<\/span> if + Past Perfect + would have V3<\/h2><\/div><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-1.5deg); width: 210px; box-sizing: border-box\">Тут схожа ситуація: беремо умовне речення другого типу і утворюємо третій тип, переробляючи все в Perfect:<br><br>Past Simple → Past Perfect<br>would → would have V3<\/div><\/div><p style=\"margin: 0; font-size: 16px; line-height: 1.45; text-align: left\">Неможливі ситуації в минулому.<\/p><p style=\"margin: 0; font-size: 19px; line-height: 1.3; text-align: left\"><span style=\"position: relative; display: inline-block\">If I had gone to sleep earlier,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> <span style=\"position: relative; display: inline-block\">I wouldn’t have been so tired yesterday.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span><\/p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\">Якби я ВЧОРА пішов спати раніше, то ВЧОРА я б не був такий втомлений.<\/p><p style=\"margin: 4px 0 0; font-size: 14px; line-height: 1.45; text-align: left\"><span style=\"color: #555\">(Єдиний кондішонал, який відповідає за минуле… і шкодування про сумнівні рішення, які вже можна вирішити хіба що за допомогою машини часу.)<\/span><\/p><\/section><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Seri  1.15; white-space: nowrap\">If I had made a better resume a month ago,<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#4D74A8\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1; color: #4D74A8; text-align: center; white-space: nowrap\">дія в минулому:<br>«якби я зробив краще<br>резюме в минулому»<\/span><\/div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 19px; line-height: 1.15; white-space: nowrap\">I would have a better job.<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span style=\"font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">«то зараз мав би<br>кращу роботу».<br>Наслідок у теперішньому<\/span><\/div><\/div><\/section><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Indirect Speech<\/span><span>20 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 24px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Indirect Speech<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Або Reported Speech. Непряма мова. Будемо вчитись передавати чужі слова іншим людям.<\/p><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; transform: rotate(-1deg)\">Щоб утворити непряму мову, потрібно взяти те, що в лапках, і перевести «на час назад».<\/p><div style=\"display: grid; grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1.25fr); row-gap: 12px; column-gap: 6px\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left; color: #7A1F45\">Direct Speech<\/h3><span><\/span><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 17px; line-height: 1.2; letter-spacing: -.5px; text-align: left; color: #7A1F45\">Indirect Speech<\/h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Present Simple<\/span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I’m busy.”<\/span><\/div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 12\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 7 C 12 4, 24 8, 37 6 M 31 2 L 37 6 L 31 10\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\"><\/path><\/svg><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Past Simple<\/span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said (that) she was busy.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 16px; font-weight: 700\">Present Continuous<\/span><span style=\"font-size: 13.5px; font-style: italic; line-height: 1.35\">She said: “I’m working.”<\/span><\/div><div style=\"display: flex; align-items: center\"><svg style=\"display: inline-block; vertical-align: middle; margin: 0 6px\" width=\"44\" height=\"12\" viewBox=\"0 0 40 1 olute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> I liked her.<\/i><\/p><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13px; line-height: 1.45; text-align: center; transform: rotate(0.8deg)\">Додаємо слово «чи» — if / whether, змінюємо порядок слів і «на час назад».<\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 16px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">Modal Verbs<\/h3><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>She asked me: “Can you help me?”<\/i><\/p><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>She asked <span style=\"position: relative; display: inline-block\">if<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span> I <span style=\"text-decoration: underline wavy #7A1F45; text-decoration-thickness: 1.5px; text-underline-offset: 5px\">could<\/span> help her.<\/i><\/p><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13px; line-h A8; text-align: center; white-space: nowrap\">додаток<\/span><\/div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">was<\/span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">to be<br>в Past Simple<\/span><\/div><div style=\"display: flex; flex-direction: column; align-items: center; gap: 2px\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">bought<svg style=\"position: absolute; left: -7px; top: -5px; width: calc(100% + 14px); height: calc(100% + 10px); overflow: visible; pointer-events: none\" viewBox=\"0 0 100 40\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M8 24 C 4 10, 36 3, 66 4 C 90 5, 99 14, 96 24 C 92 35, 62 39, 36 37 C 14 35, 2 29, 5 18 C 8 10, 22 5, 42 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.7\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/span><svg width=\"14\" height=\"16\" viewBox=\"0 0 14 18\" aria-hidden=\"true\"><path d=\"M5 1 C 9 6, 3 10, 7 16 M 3 12 L 7 16 L 10 11\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\/path><\/svg><span style=\"font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1; color: #7A1F45; text-align: center; white-space: nowrap\">V3<\/span><\/div><div style=\"display: flex; flex-direction: column; align-items: center\"><span style=\"position: relative; font-size: 24px; line-height: 1.15; white-space: nowrap\">(by me).<\/span><\/div><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 22px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left; margin-top: 4px\">— пасивний стан<\/p><\/div><div style=\"align-self: center; margin-top: 10px\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 18px 22px; font-size: 16px; line-height: 1.45; text-align: center; transform: rotate(-1.2deg); width: 420px; box-sizing: border-box\">Використовуємо, коли фокус на дії або об’єкті, над яким відбувається дія, а не на людині, яка її виконує.<\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Articles<\/span><span>22 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 22px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><p style=\"position: absolute; left: -6px; top: 0; width: 150px; margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.05; color: #7A1F45; transform: rotate(-5deg)\">Часто питають: «нахіба нам артиклі взагалі, от в українській їх нема». Відчуйте різницю ↓<\/p><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 40px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Articles<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Артиклі.<\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 20px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: center; max-width: 560px\">Коли пройдете цю тему, купіть собі чогось смачного…<\/p><\/div><div style=\"display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; align-items: center\"><div style=\"background: #DBE1E4; border: 1px solid #3A1626; padding: 12px 14px; font-size: 13.5px; line-height: 1.45; text-align: left; transform: rotate(-2deg)\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>My girlfriend is a 10.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Моя дівчина — 10/10.<\/p><p style=\"margin: 6px 0 0; font-size: 15px; line-height: 1.45; text-align: left\"><i>My girlfriend is 10.<\/i><\/p><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left\">Моїй дівчині 10… років.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 8px; align-items: stretch\"><p style=\"margin: 0; font-size: 15px; line-height: 1.45; text-align: center\">В англійській є два з половиною артиклі:<\/p><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 16px; text-align: center\"><div><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px\">a (an)<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">неозначений артикль<\/p><\/div><div><span style=\"font-family: Unbounded, sans-serif; font-weight: 800; font-size: 26px\">the<\/span><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 19px; font-weight: 600; line-height: 1.1; color: #7A1F45; text-align: left\">означений артикль<\/p><\/div><\/div><p style=\"margin: 0; font-size: 14px; line-height: 1.45; text-align: center\">Вони не перекладаються, але для зручності можете сприймати <b>a (an)<\/b> як «якийсь, один», а <b>the<\/b> — «цей, конкретний».<\/p><\/div><\/div><div style=\"height: 1px; background: #3A1626\"><\/div><div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px; align-items: start\"><div style=\"display: flex; flex-direction: column; gap: 12px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">A (an)<\/h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.<\/b> згадуємо про щось уперше:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">I have a dog.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.<\/b> щось, що належить до ряду таких же речей:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">I’ve bought a book. <span style=\"font-style: normal\">(книг існує багато)<\/span><\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">3.<\/b> з професіями:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">My dad is a doctor.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">4.<\/b> замість «per»:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">Once a week, $5 a kilo.<\/span><\/div><\/div><div style=\"display: flex; flex-direction: column; gap: 12px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 22px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">The<\/h3><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">1.<\/b> згадуємо про щось удруге:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">The dog is very active.<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">2.<\/b> щось унікальне, єдине у своєму роді:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">the Sun, the universe, the environment, the Internet<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">3.<\/b> коли говоримо про щось конкретне:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">We took the children to the zoo.<\/span><\/div><p style=\"margin: 0; font-family: Caveat, cursive; font-size: 18px; font-weight: 600; line-height: 1.1; color: #4D74A8; text-align: left; padding-left: 16px\">КОНКРЕТНИХ дітей, яких ми знаємо, не робіть ваші речення creepy.<\/p><div style=\"display: flex; flex-direction: column; gap: 1px\"><span style=\"font-size: 14px; line-height: 1.4\"><b style=\"color: #7A1F45\">4.<\/b> додаємо the до прикметників, щоб утворити групу людей:<\/span><span style=\"font-size: 15px; font-style: italic; line-height: 1.4; padding-left: 16px\">rich — the rich <span style=\"font-style: normal\">(багатий — багаті люди)<\/span><br>young — the young <span style=\"font-style: normal\">(молодий — молоді люди)<\/span><\/span><\/div><\/div><\/div><\/div><\/div>", "<div style=\"width: 794px; height: 1123px; box-sizing: border-box; padding: 38px 56px 34px; background: #F6F1E3; color: #3A1626; font-family: 'PT Serif', serif; display: flex; flex-direction: column; overflow: hidden\"><div style=\"display: flex; justify-content: space-between; font-family: 'PT Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 8px; border-bottom: 1px solid #3A1626\"><span>Grammar<\/span><span>Articles<\/span><span>23 / 26<\/span><\/div><div style=\"display: flex; flex-direction: column; gap: 24px; margin-top: 28px\"><div style=\"position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px\"><div style=\"display: flex; flex-direction: column; align-items: stretch; gap: 2px\"><h1 style=\"margin: 0 auto; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -1.5px; text-align: center; width: fit-content; background: linear-gradient(transparent 52%, #A9C2E6 52%, #A9C2E6 92%, transparent 92%); padding: 0 6px\">Articles<\/h1><svg style=\"width: 100%; height: 10px; display: block\" viewBox=\"0 0 300 10\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path d=\"M2 6 C 40 2, 70 9, 110 5 S 190 2, 230 6 S 280 8, 298 4\" fill=\"none\" stroke=\"#7A1F45\" stroke-width=\"2\" vector-effect=\"non-scaling-stroke\" stroke-linecap=\"round\"><\/path><\/svg><\/div><p style=\"margin: 2px 0 0; font-size: 13px; line-height: 1.45; text-align: center; max-width: 520px\">Продовження.<\/p><\/div><div style=\"display: flex; flex-direction: column; gap: 10px; align-items: stretch\"><h3 style=\"margin: 0; font-family: Unbounded, sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; letter-spacing: -.5px; text-align: left\">The (продо                       : `<p>Перевіряємо граматику теми: тут потрібно ${esc(d.target)}. Саме цієї конструкції у вашому перекладі немає.</p>`;
      h += `<span class="diag-h soft">Ваш переклад поруч із варіантом:</span>${d.html}`;
      if (d.msgs.length) h += '<span class="diag-h soft">Інші відмінності — на оцінку не впливають, але гляньте:</span>' + d.msgs.map(m => `<p class="soft-msg">${esc(m)}</p>`).join('');
    } else {
      if (d.html) h += '<span class="diag-h">Ваша відповідь:</span>' + d.html;
      h += d.msgs.map(m => `<p>${esc(m)}</p>`).join('');
    }
  });
  box.innerHTML = h ? (ds.some(d => d.target && d.targetOk) ? '' : '<span class="diag-h">Що не так:</span>') + h : '';
  const why = li.querySelector('.why'); if (why) why.hidden = ds.length > 0 && ds.every(d => d.typoOnly);
}
function show(exId) {
  const card = document.getElementById(exId);
  card.querySelectorAll('li[data-i]').forEach(fillDiag);
  card.querySelectorAll('.exp').forEach(e => e.hidden = false);
  card.querySelectorAll('.choices').forEach(g => g.querySelectorAll('label').forEach(l => l.classList.toggle('right', l.querySelector('input').value === g.dataset.ans)));
  const c = card.querySelector('.clips'); if (c) c.hidden = false;
  card.querySelectorAll('.why-btn').forEach(b => b.remove());
}
function clearEx(exId) {
  const card = document.getElementById(exId);
  card.querySelectorAll('.exp').forEach(e => e.hidden = true);
  card.querySelectorAll('.why-btn').forEach(b => b.remove());
  const c = card.querySelector('.clips'); if (c) c.hidden = true;
  card.querySelectorAll('input.blank, input.full, select, textarea').forEach(el => { el.value = ''; el.classList.remove('ok', 'bad', 'near'); el._diag = null; delete store.v[el.id]; });
  card.querySelectorAll('.choices').forEach(g => { g.classList.remove('ok', 'bad'); g.querySelectorAll('input').forEach(r => r.checked = false); g.querySelectorAll('label').forEach(l => l.classList.remove('right')); delete store.v[g.id]; });
  document.getElementById(exId + '-score').textContent = '';
  delete store.r[exId]; save(); updateProgress();
}

const CHECKABLE = TOPICS.reduce((n, t) => n + t.ex.filter(e => e.kind !== 'free').length, 0);
function updateProgress() {
  const rs = Object.values(store.r); const done = rs.length;
  const ok = rs.reduce((a, r) => a + r.ok, 0), tot = rs.reduce((a, r) => a + r.total, 0);
  document.getElementById('prog-text').textContent = `Перевірено вправ: ${done} з ${CHECKABLE}` + (tot ? ` · правильно ${Math.round(ok / tot * 100)}%` : '');
  document.getElementById('prog-bar').style.width = (done / CHECKABLE * 100) + '%';
  TOPICS.forEach((t, ti) => {
    const ids = t.ex.map((e, ei) => e.kind !== 'free' ? `t${ti + 1}e${ei + 1}` : null).filter(Boolean);
    const d = ids.filter(id => store.r[id]).length;
    const st = document.getElementById('st-' + t.id);
    if (st) { st.textContent = `${d}/${ids.length}`; st.classList.toggle('done', d === ids.length); }
  });
}
function renderNav(cur, mode) {
  const pre = mode === 'book' ? 'book-' : '';
  document.getElementById('nav').innerHTML = TOPICS.map((t, ti) =>
    `<a href="#${pre}${t.id}"${ti === cur ? ' aria-current="page"' : ''}><span class="n">${String(ti + 1).padStart(2, '0')}</span><span>${esc(t.title)}</span><span class="st" id="st-${t.id}"></span></a>`).join('');
}
let pendingPage = null;
function route() {
  let h = location.hash.slice(1); let mode = 'ex';
  if (!h) { h = 'book-' + TOPICS[0].id; }
  if (h.startsWith('book-')) { mode = 'book'; h = h.slice(5); }
  let ti = TOPICS.findIndex(t => t.id === h); if (ti < 0) { ti = 0; mode = 'book'; }
  renderNav(ti, mode);
  if (mode === 'book') renderBook(ti, pendingPage); else renderTopic(ti);
  pendingPage = null;
  updateProgress();
}

document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('input.blank, input.full, textarea')) { store.v[el.id] = el.value; el.classList.remove('ok', 'bad'); save(); }
  if (el.matches('.choices input')) { const g = el.closest('.choices'); store.v[g.id] = el.value; g.classList.remove('ok', 'bad'); save(); }
});
document.addEventListener('change', e => { const el = e.target; if (el.matches('select')) { store.v[el.id] = el.value; el.classList.remove('ok', 'bad'); save(); } });
document.addEventListener('click', e => {
  const w = e.target.closest('.why-btn');
  if (w) { const li = w.closest('li'); fillDiag(li); const ex = li.querySelector('.exp'); if (ex) ex.hidden = false; const c = li.closest('.card').querySelector('.clips'); if (c) c.hidden = false; w.remove(); return; }
  const a = e.target.closest('a[data-page]'); if (a) pendingPage = a.dataset.page;
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const id = b.dataset.ex;
  if (b.dataset.act === 'check') check(id); else if (b.dataset.act === 'show') show(id); else clearEx(id);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.blank, input.full')) { const card = e.target.closest('.card'); if (card) check(card.id); }
});
window.addEventListener('hashchange', () => { const p = pendingPage; route(); if (!p) window.scrollTo(0, 0); });
window.addEventListener('resize', fitPages);
route();
</script>
</body>
